tion(){var go=function(){setTimeout(function(){import(\"https://www.gstatic.com/firebasejs/11.4.0/firebase-analytics.js\").then(function(m){m.getAnalytics(app)}).catch(function(){})},2500)};document.readyState===\"complete\"?go():window.addEventListener(\"load\",go)})();\n  const auth = getAuth(app);\n  const db = getFirestore(app);\n  // থিম (ডার্ক/লাইট) — settings/site থেকে, বাকি পেজের মতোই\n  onSnapshot(doc(db, \"settings\", \"site\"), (snap) => {\n    if (!snap.exists()) return;\n    const s = snap.data();\n    const __theme = (s.theme === 'light') ? 'light' : 'dark';\n    document.documentElement.setAttribute('data-theme', __theme);\n    try { localStorage.setItem('onuvutiTheme', __theme); } catch (e) {}\n  });\n  const provider = new GoogleAuthProvider();\n\n  // ---------- মোবাইলে ঠিকানার বক্স/টুলবারের কারণে 100vh আসল স্ক্রিনের চেয়ে বড় হয়ে যাওয়ার\n  // সমস্যা এড়াতে — window.innerHeight দিয়ে সরাসরি আসল দৃশ্যমান উচ্চতা মেপে বসানো হচ্ছে।\n  // এটা 100dvh সাপোর্ট না করা পুরনো ব্রাউজারেও কাজ করে (CSS ইউনিটের বদলে সরাসরি পিক্সেল ব্যবহার করে)\n  const appScreenEl = document.getElementById('appScreen');\n  function fixAppHeight() {\n    appScreenEl.style.height = window.innerHeight + 'px';\n  }\n  fixAppHeight();\n  window.addEventListener('resize', fixAppHeight);\n  window.addEventListener('orientationchange', () => setTimeout(fixAppHeight, 200));\n\n  let currentUser = null;\n  let myProfile = {};\n  let messagingEnabled = true;\n  let AUDIO_MAX_MB = 10, PHOTO_MAX_MB = 5;   // অ্যাডমিন সেটিং থেকে বদলায়\n  let VOICE_MAX_SEC = 300;   // ভয়েসের সর্বোচ্চ সময় (সেকেন্ড) — অ্যাডমিন প্যানেলের settings/messages.voiceMaxMin থেকে বদলায়\n\n  // চ্যাটের অবস্থা (পেইজ রিলোড ছাড়াই ইনবক্স ↔ চ্যাট বদলায়, তাই আবার লগইন স্ক্রিন আসে না)\n  let otherUid = null;\n  let otherName = 'ব্যবহারকারী';\n  let otherPhoto = '';\n  let otherLastActive = null;\n  let otherOnline = false;\n  let convId = null;\n  let convExists = false;\n  let lastMsgSnap = null;\n  let unsubMessages = null;\n  let unsubOther = null;\n  let unsubConv = null;      // চ্যাট খোলা অবস্থায় কনভারসেশন ডকুমেন্ট শোনে (lastSeenAt-এর জন্য, \"সিন\" ইন্ডিকেটর)\n  let unsubInbox = null;\n  let unreadUnsubs = [];     // ইনবক্সে প্রতিটা কনভারসেশনের \"নতুন মেসেজ গণনা\" লিসেনার\n  let statusTimer = null;\n  let routeToken = 0;\n  let otherSeenAt = null;    // ওপাশের লোক সর্বশেষ কখন চ্যাট দেখেছে (lastSeenAt) — \"সিন\" ইন্ডিকেটরের জন্য\n\n  // রিপ্লাই/এডিট — মেসেজ পাঠানোর আগে কোন মেসেজে রিপ্লাই দেওয়া হচ্ছে বা কোনটা এডিট হচ্ছে তা রাখে\n  let replyingTo = null;     // { id, text, mine }\n  let editingId = null;      // এডিট হচ্ছে এমন মেসেজের id (থাকলে সেন্ড বাটনে চাপলে নতুন মেসেজ না, আপডেট হবে)\n\n  const bootScreen = document.getElementById('bootScreen');\n  const loginScreen = document.getElementById('loginScreen');\n  const appScreen = document.getElementById('appScreen');\n  const blockedScreen = document.getElementById('blockedScreen');\n  const blockedTitle = document.getElementById('blockedTitle');\n  const blockedMsg = document.getElementById('blockedMsg');\n  const blockedBackBtn = document.getElementById('blockedBackBtn');\n  const loginBtn = document.getElementById('googleLoginBtn');\n  const loginStatus = document.getElementById('loginStatus');\n  const logoutBtn = document.getElementById('logoutBtn');\n  const backBtn = document.getElementById('backBtn');\n  const headerCenter = document.getElementById('headerCenter');\n  const headerTitle = document.getElementById('headerTitle');\n  const headerAvatar = document.getElementById('headerAvatar');\n  const headerStatus = document.getElementById('headerStatus');\n  const disabledNotice = document.getElementById('disabledNotice');\n\n  const inboxView = document.getElementById('inboxView');\n  const inboxLoading = document.getElementById('inboxLoading');\n  const inboxEmpty = document.getElementById('inboxEmpty');\n  const convList = document.getElementById('convList');\n\n  const chatView = document.getElementById('chatView');\n  const chatLoading = document.getElementById('chatLoading');\n  const messagesScroll = document.getElementById('messagesScroll');\n  const messagesEmpty = document.getElementById('messagesEmpty');\n  const messagesList = document.getElementById('messagesList');\n  const messageInput = document.getElementById('messageInput');\n  const sendBtn = document.getElementById('sendBtn');\n  const composePreview = document.getElementById('composePreview');\n  const cpLabel = document.getElementById('cpLabel');\n  const cpText = document.getElementById('cpText');\n  const cpClose = document.getElementById('cpClose');\n  const ctxBackdrop = document.getElementById('ctxBackdrop');\n  const ctxMenu = document.getElementById('ctxMenu');\n\n  const REACTIONS = { like: '👍', love: '❤️', haha: '😆', sad: '😢', angry: '😠', wow: '😮' };\n\n  function showOnly(which) {\n    bootScreen.style.display = which === 'boot' ? 'flex' : 'none';\n    loginScreen.style.display = which === 'login' ? 'flex' : 'none';\n    blockedScreen.style.display = which === 'blocked' ? 'flex' : 'none';\n    appScreen.style.display = which === 'app' ? 'flex' : 'none';\n  }\n\n  loginBtn.addEventListener('click', async () => {\n    loginBtn.disabled = true;\n    loginStatus.textContent = 'লগইন হচ্ছে...';\n    try { await signInWithPopup(auth, provider); }\n    catch (e) {\n      loginStatus.textContent = 'এরর: ' + (e && e.message ? e.message : String(e));\n      loginBtn.disabled = false;\n    }\n  });\n  logoutBtn.addEventListener('click', async () => {\n    hangup();\n    try { await writePresence(false); } catch (e) {}\n    await signOut(auth);\n  });\n  blockedBackBtn.addEventListener('click', () => { showOnly('login'); });\n\n  backBtn.addEventListener('click', () => {\n    if (ctxOpen) { closeCtxMenu(); return; }\n    if (window.__composerBackBtn && window.__composerBackBtn()) return;\n    if (convId) {\n      // চ্যাট থেকে ইনবক্সে — পেইজ রিলোড ছাড়াই\n      if (history.state && history.state.inApp) history.back();\n      else { history.replaceState({}, '', location.pathname); route(); }\n    } else if (window.history.length > 1) {\n      window.history.back();\n    } else {\n      __go('index.html');\n    }\n  });\n  window.addEventListener('popstate', () => {\n    if (imgViewer.classList.contains('open')) { closeImgViewer(true); return; }   // ছবি খোলা থাকলে ব্যাক = শুধু ছবি বন্ধ\n    if (viewerIgnorePop) { viewerIgnorePop = false; return; }\n    if (window.__composerBack && window.__composerBack()) return;   // স্টিকার/মেসেজ বক্স খোলা থাকলে ব্যাক = শুধু সেটা বন্ধ\n    if (ctxOpen) { closeCtxMenu(true); return; }      // মেনু খোলা থাকলে ব্যাক = শুধু মেনু বন্ধ\n    if (ctxIgnorePop) { ctxIgnorePop = false; return; } // মেনু নিজে বন্ধ হওয়ার popstate — উপেক্ষা\n    route();\n  });\n\n  // ---------- একাউন্ট ডিলিট/সাসপেন্ড চেক — profile.html এর মতোই একই লজিক ----------\n  async function checkAccountBlocked(user) {\n    try {\n      const banSnap = await getDoc(doc(db, \"bannedUsers\", user.uid));\n      if (banSnap.exists()) {\n        await signOut(auth);\n        blockedTitle.textContent = '⛔ একাউন্ট মুছে ফেলা হয়েছে';\n        blockedMsg.textContent = 'আপনার এই একাউন্টটি এডমিন কর্তৃক স্থায়ীভাবে মুছে ফেলা হয়েছে। এই একাউন্ট দিয়ে আর প্রবেশ করা যাবে না।';\n        showOnly('blocked');\n        return true;\n      }\n      const userSnap = await getDoc(doc(db, \"users\", user.uid));\n      const data = userSnap.exists() ? userSnap.data() : null;\n      const susp = data && data.suspended;\n      if (susp && susp.active && susp.until) {\n        const untilDate = susp.until.toDate ? susp.until.toDate() : new Date(susp.until);\n        if (untilDate.getTime() > Date.now()) {\n          await signOut(auth);\n          const months = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];\n          const untilStr = untilDate.getDate() + ' ' + months[untilDate.getMonth()] + ' ' + untilDate.getFullYear();\n          blockedTitle.textContent = '⛔ একাউন্ট সাসপেন্ড করা হয়েছে';\n          blockedMsg.textContent = (susp.message || 'আপনার একাউন্টটি সাময়িকভাবে সাসপেন্ড করা হয়েছে।') + '\\n\\nমেয়াদ শেষ হবে: ' + untilStr;\n          showOnly('blocked');\n          return true;\n        } else {\n          await setDoc(doc(db, \"users\", user.uid), { suspended: { active: false } }, { merge: true });\n        }\n      }\n      return false;\n    } catch (err) {\n      console.error('checkAccountBlocked এরর:', err);\n      return false;\n    }\n  }\n\n  async function ensureUserProfile(user) {\n    const ref = doc(db, \"users\", user.uid);\n    const snap = await getDoc(ref);\n    const syncedFields = {\n      name: user.displayName || 'User',\n      photoURL: user.photoURL || '',\n      email: user.email || ''\n    };\n    if (snap.exists()) {\n      myProfile = { ...snap.data(), ...syncedFields };\n      await setDoc(ref, syncedFields, { merge: true });\n    } else {\n      myProfile = { ...syncedFields, createdAt: serverTimestamp() };\n      await setDoc(ref, myProfile);\n    }\n  }\n\n  function escapeHtml(str) {\n    return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  }\n\n  // ছবি থাকলে ছবি, না থাকলে/লোড না হলে নামের প্রথম অক্ষর\n  function avatarHtml(photo, name, size) {\n    const initial = (String(name || '?').trim().charAt(0) || '?').toUpperCase();\n    const fb = '<span class=\"avFallback\">' + escapeHtml(initial) + '<\/span>';\n    const img = photo\n      ? '<img src=\"' + escapeHtml(photo) + '\" alt=\"\" referrerpolicy=\"no-referrer\" loading=\"lazy\" decoding=\"async\" onerror=\"this.remove()\">'\n      : '';\n    return '<div class=\"av ' + size + '\">' + fb + img + '<\/div>';\n  }\n\n  // ================= লং-প্রেস কনটেক্সট মেনু (মেসেজ ও ইনবক্স রো — দুই জায়গাতেই ব্যবহৃত হয়) =================\n  // মেনু এখন ফেসবুকের মতো ফুল-স্ক্রিন বটম শিট। খোলার সময় একটা history এন্ট্রি পুশ হয়,\n  // তাই ফোনের/ব্রাউজারের ব্যাক চাপলে শুধু মেনু বন্ধ হয় — চ্যাট থেকে বের হয় না।\n  let ctxOpen = false, ctxPushed = false, ctxIgnorePop = false;\n  // মেসেজ বাবল / ইনবক্স রো-তে টেক্সট সিলেক্ট শুরুই হতে দেওয়া হবে না (ইনপুট বক্স বাদে)\n  document.addEventListener('selectstart', e => {\n    const t = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement);\n    if (t && t.closest && t.closest('.msgRow, .convRow, #ctxBackdrop')) e.preventDefault();\n  });\n  function clearTextSelection() {\n    try { const sel = window.getSelection && window.getSelection(); if (sel && sel.removeAllRanges) sel.removeAllRanges(); } catch (e) {}\n  }\n  function openCtxMenu(anchorEl, itemsHtml) {\n    clearTextSelection();\n    ctxMenu.innerHTML = itemsHtml;\n    ctxMenu.scrollTop = 0;\n    ctxBackdrop.style.display = 'flex';\n    // লং-প্রেসের আঙুল ছাড়ার সময় যেন ভুল করে মেনু/বাটনে ট্যাপ না পড়ে — প্রথম ৩৫০ms ট্যাপ বন্ধ\n    ctxBackdrop.style.pointerEvents = 'none';\n    setTimeout(() => { if (ctxOpen) ctxBackdrop.style.pointerEvents = 'auto'; }, 350);\n    if (!ctxOpen) {\n      try {\n        history.pushState(Object.assign({}, history.state || {}, { ctx: true }), '', location.href);\n        ctxPushed = true;\n      } catch (e) { ctxPushed = false; }\n    }\n    ctxOpen = true;\n  }\n  function closeCtxMenu(fromPop) {\n    const wasOpen = ctxOpen;\n    ctxOpen = false;\n    ctxBackdrop.style.display = 'none';\n    ctxBackdrop.style.pointerEvents = 'auto';\n    ctxMenu.innerHTML = '';\n    if (wasOpen && ctxPushed) {\n      ctxPushed = false;\n      if (fromPop !== true) {\n        // বাটন/ব্যাকড্রপ দিয়ে বন্ধ হলে পুশ করা এন্ট্রিটা সরিয়ে দিই; এই popstate-এ route() চালানো যাবে না\n        ctxIgnorePop = true;\n        try { history.back(); } catch (e) { ctxIgnorePop = false; }\n        setTimeout(() => { ctxIgnorePop = false; }, 600);\n      }\n    }\n  }\n  ctxBackdrop.addEventListener('click', e => { if (e.target === ctxBackdrop) closeCtxMenu(); });\n\n  // এলিমেন্টে টাচ/মাউস \"লং-প্রেস\" বাঁধে (৪৫০ms); নড়াচড়া করলে বা তাড়াতাড়ি ছেড়ে দিলে বাতিল হয়ে যায়।\n  // লং-প্রেস ট্রিগার হলে window.__lpFired সেট হয়, যাতে ওই একই এলিমেন্টের normal click handler\n  // (যেমন ইনবক্স রো-তে চ্যাট খোলার ক্লিক) ভুল করে চলে না যায় — lpConsumed() দিয়ে চেক হয়।\n  function bindLongPress(el, handler) {\n    let t = null, moved = false, sx = 0, sy = 0;\n    const start = (x, y) => {\n      moved = false; sx = x; sy = y;\n      clearTimeout(t);\n      t = setTimeout(() => { if (!moved) { window.__lpFired = true; handler(); } }, 450);\n    };\n    const move = (x, y) => { if (Math.abs(x - sx) > 10 || Math.abs(y - sy) > 10) { moved = true; clearTimeout(t); } };\n    const cancel = () => clearTimeout(t);\n    el.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });\n    el.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY), { passive: true });\n    el.addEventListener('touchend', cancel);\n    el.addEventListener('touchcancel', cancel);\n    el.addEventListener('mousedown', e => start(e.clientX, e.clientY));\n    el.addEventListener('mousemove', e => { if (t) move(e.clientX, e.clientY); });\n    el.addEventListener('mouseup', cancel);\n    el.addEventListener('mouseleave', cancel);\n    el.addEventListener('contextmenu', e => { e.preventDefault(); clearTimeout(t); window.__lpFired = true; handler(); });\n  }\n  function lpConsumed() {\n    if (window.__lpFired) { window.__lpFired = false; return true; }\n    return false;\n  }\n\n  function copyText(text) {\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text || '').catch(() => fallbackCopy(text));\n    } else fallbackCopy(text);\n  }\n  function fallbackCopy(text) {\n    try {\n      const ta = document.createElement('textarea');\n      ta.value = text || ''; ta.style.position = 'fixed'; ta.style.opacity = '0';\n      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();\n    } catch (e) {}\n  }\n\n  // ---------- রিপ্লাই/এডিট প্রিভিউ বার ----------\n  function updateComposePreview() {\n    if (editingId) {\n      composePreview.style.display = 'flex';\n      cpLabel.textContent = '✏️ মেসেজ এডিট করা হচ্ছে';\n      cpText.textContent = 'পরিবর্তন করে ➤ চাপুন';\n    } else if (replyingTo) {\n      composePreview.style.display = 'flex';\n      cpLabel.textContent = replyingTo.name + '-কে রিপ্লাই';\n      cpText.textContent = replyingTo.text;\n    } else {\n      composePreview.style.display = 'none';\n    }\n  }\n  function startEditMessage(msgId, text) {\n    setTyping(true);\n    editingId = msgId;\n    replyingTo = null;\n    messageInput.value = text || '';\n    messageInput.style.height = 'auto';\n    messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';\n    messageInput.focus();\n    updateComposePreview();\n    updateSendBtn();\n  }\n  function startReply(msgId, m, mine) {\n    editingId = null;\n    replyingTo = { id: msgId, text: (m.text || '').slice(0, 120), name: mine ? 'নিজের মেসেজ' : otherName };\n    setTyping(true);\n    messageInput.focus();\n    updateComposePreview();\n  }\n  cpClose.addEventListener('click', () => {\n    if (editingId) { editingId = null; messageInput.value = ''; messageInput.style.height = 'auto'; }\n    replyingTo = null;\n    updateComposePreview();\n    updateSendBtn();\n  });\n\n  // ---------- মেসেজ ডিলিট / রিঅ্যাকশন ----------\n  async function deleteMessage(msgId) {\n    if (!confirm('মেসেজটি মুছে ফেলতে চান?')) return;\n    try { await deleteDoc(doc(db, \"conversations\", convId, \"messages\", msgId)); }\n    catch (e) { alert('এরর: ' + e.message); }\n  }\n  async function toggleReaction(msgId, key) {\n    if (!currentUser || !convId) return;\n    try {\n      const mRef = doc(db, \"conversations\", convId, \"messages\", msgId);\n      let already = false;\n      if (lastMsgSnap) {\n        lastMsgSnap.forEach(d => {\n          if (d.id === msgId) { const r = d.data().reactions; already = !!(r && r[currentUser.uid] === key); }\n        });\n      }\n      await updateDoc(mRef, already\n        ? { [`reactions.${currentUser.uid}`]: deleteField() }\n        : { [`reactions.${currentUser.uid}`]: key });\n    } catch (e) { console.error('রিঅ্যাকশন দেওয়া যায়নি:', e); }\n  }\n\n  // মেসেজটা এখনো এডিট করা যাবে কিনা — ওপাশের লোক ইতিমধ্যে চ্যাট \"সিন\" করে ফেললে আর যাবে না\n  function messageEditable(m) {\n    if (!m.createdAt || !m.createdAt.toMillis) return true;\n    if (!otherSeenAt || !otherSeenAt.toMillis) return true;\n    return otherSeenAt.toMillis() < m.createdAt.toMillis();\n  }\n\n  function openMessageMenu(anchorEl, msgId, m, mine) {\n    let html = '';\n    if (mine) {\n      if (!isMediaMsg(m)) html += '<button class=\"ctxItem\" data-act=\"copy\">📋 কপি করুন<\/button>';\n      if (!isMediaMsg(m) && messageEditable(m)) html += '<button class=\"ctxItem\" data-act=\"edit\">✏️ এডিট করুন<\/button>';\n      if (isMediaMsg(m)) html += '<button class=\"ctxItem\" data-act=\"download\">⬇ ডাউনলোড<\/button>';\n      html += '<button class=\"ctxItem danger\" data-act=\"delete\">🗑️ ডিলিট করুন<\/button>';\n    } else {\n      html += '<div class=\"ctxReactions\">' +\n        Object.keys(REACTIONS).map(k => '<button data-react=\"' + k + '\">' + REACTIONS[k] + '<\/button>').join('') +\n        '<\/div>';\n      html += '<button class=\"ctxItem\" data-act=\"reply\">↩️ রিপ্লাই<\/button>';\n      if (!isMediaMsg(m)) html += '<button class=\"ctxItem\" data-act=\"copy\">📋 কপি করুন<\/button>';\n      if (isMediaMsg(m)) html += '<button class=\"ctxItem\" data-act=\"download\">⬇ ডাউনলোড<\/button>';\n    }\n    openCtxMenu(anchorEl, html);\n    ctxMenu.querySelectorAll('.ctxItem').forEach(b => b.addEventListener('click', () => {\n      const act = b.dataset.act;\n      closeCtxMenu();\n      if (act === 'copy') copyText(m.text || '');\n      else if (act === 'edit') startEditMessage(msgId, m.text || '');\n      else if (act === 'delete') deleteMessage(msgId);\n      else if (act === 'download') downloadMedia(m.audioUrl || m.imageUrl, mediaName(m));\n      else if (act === 'reply') startReply(msgId, m, mine);\n    }));\n    ctxMenu.querySelectorAll('[data-react]').forEach(b => b.addEventListener('click', () => {\n      closeCtxMenu();\n      toggleReaction(msgId, b.dataset.react);\n    }));\n  }\n\n  // ---------- ইনবক্স রো: Mark as Read / পুরো চ্যাট ডিলিট ----------\n  function openInboxMenu(anchorEl, convIdTarget) {\n    const html =\n      '<button class=\"ctxItem\" data-act=\"read\">✅ Mark as Read<\/button>' +\n      '<button class=\"ctxItem danger\" data-act=\"delete\">🗑️ চ্যাট ডিলিট করুন<\/button>';\n    openCtxMenu(anchorEl, html);\n    ctxMenu.querySelectorAll('.ctxItem').forEach(b => b.addEventListener('click', async () => {\n      const act = b.dataset.act;\n      closeCtxMenu();\n      if (act === 'read') markConversationRead(convIdTarget);\n      else if (act === 'delete') {\n        if (!confirm('পুরো চ্যাট ডিলিট করতে চান? এটা ফিরিয়ে আনা যাবে না।')) return;\n        try { await deleteConversation(convIdTarget); }\n        catch (e) { alert('এরর: ' + e.message); }\n      }\n    }));\n  }\n  async function markConversationRead(cid) {\n    try { await updateDoc(doc(db, \"conversations\", cid), { [`lastRead.${currentUser.uid}`]: serverTimestamp() }); }\n    catch (e) { console.error('Mark as read এরর:', e); }\n  }\n  async function deleteConversation(cid) {\n    const mcol = collection(db, \"conversations\", cid, \"messages\");\n    // ৪০০-৪০০ করে ব্যাচে মেসেজ মোছা হয় (Firestore batch limit 500) — সবগুলো শেষ হলে তারপর কনভারসেশন ডকুমেন্ট মোছা হয়\n    while (true) {\n      const snap = await getDocs(query(mcol, limit(400)));\n      if (snap.empty) break;\n      const batch = writeBatch(db);\n      snap.forEach(d => batch.delete(d.ref));\n      await batch.commit();\n      if (snap.size < 400) break;\n    }\n    await deleteDoc(doc(db, \"conversations\", cid));\n  }\n\n  function timeAgo(ts) {\n    if (!ts || !ts.toDate) return '';\n    const diffMs = Date.now() - ts.toDate().getTime();\n    const mins = Math.floor(diffMs / 60000);\n    if (mins < 1) return 'এই মাত্র';\n    if (mins < 60) return mins + ' মিনিট আগে';\n    const hrs = Math.floor(mins / 60);\n    if (hrs < 24) return hrs + ' ঘণ্টা আগে';\n    return Math.floor(hrs / 24) + ' দিন আগে';\n  }\n\n  // ---------- বাংলা তারিখ/সময় (লাস্ট একটিভের জন্য) ----------\n  const BN_DIGITS = '০১২৩৪৫৬৭৮৯';\n  const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];\n  function bn(n) { return String(n).replace(/\\d/g, d => BN_DIGITS[d]); }\n  function fmtDateBn(d) {\n    // \"২০ সেপ্টেম্বর\" (আলাদা বছর হলে বছরসহ)\n    const now = new Date();\n    let s = bn(d.getDate()) + ' ' + BN_MONTHS[d.getMonth()];\n    if (d.getFullYear() !== now.getFullYear()) s += ' ' + bn(d.getFullYear());\n    return s;\n  }\n  function fmtLastActive(d) {\n    // ১-৫৯ মিনিট আগে → ১-২৩ ঘণ্টা আগে → ১-৭ দিন আগে → তারপর শুধু তারিখ (যেমন \"১৬ সেপ্টেম্বর\")\n    const now = new Date();\n    const diff = Math.max(0, now.getTime() - d.getTime());\n    const mins = Math.max(1, Math.floor(diff / 60000));\n    if (mins < 60) return bn(mins) + ' মিনিট আগে';\n    const hrs = Math.floor(diff / 3600000);\n    if (hrs < 24) return bn(hrs) + ' ঘণ্টা আগে';\n    const days = Math.floor(diff / 86400000);\n    if (days <= 7) return bn(days) + ' দিন আগে';\n    return fmtDateBn(d);\n  }\n\n  // ---------- অনলাইন / লাস্ট একটিভ (presence) ----------\n  // নিজের presence/{uid} ডকুমেন্টে lastActive + online লেখা হয়; অন্যজনের presence ডকুমেন্ট শুনে হেডারে দেখানো হয়\n  const ACTIVE_WINDOW_MS = 100000;\n  let presenceTimer = null;\n  function writePresence(online) {\n    if (!currentUser) return Promise.resolve();\n    return setDoc(doc(db, \"presence\", currentUser.uid), { lastActive: serverTimestamp(), online: !!online }, { merge: true }).catch(() => {});\n  }\n  function startPresence() {\n    stopPresence();\n    writePresence(!document.hidden);\n    presenceTimer = setInterval(() => { if (!document.hidden) writePresence(true); }, 45000);\n  }\n  function stopPresence() { if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; } }\n  document.addEventListener('visibilitychange', () => { if (currentUser) writePresence(!document.hidden); });\n  window.addEventListener('pagehide', () => {\n    if (!currentUser) return;\n    writePresence(false);\n    if (call && call.docCreated) updateDoc(call.ref, { status: 'ended' }).catch(() => {});\n  });\n\n  function renderStatus() {\n    headerAvatar.classList.remove('online');\n    if (!convId) { headerStatus.style.display = 'none'; return; }\n    headerStatus.style.display = 'block';\n    const d = otherLastActive && otherLastActive.toDate ? otherLastActive.toDate() : null;\n    if (!d) {\n      // অন্যজন নতুন ভার্সনে একবারও ঢোকেনি (বা পড়ার পারমিশন নেই) — তথ্য নেই, তাই কিছুই দেখানো হবে না\n      headerStatus.textContent = '';\n      headerStatus.className = '';\n      headerStatus.style.display = 'none';\n      return;\n    }\n    if (otherOnline && Date.now() - d.getTime() < ACTIVE_WINDOW_MS) {\n      headerStatus.textContent = 'এখন একটিভ আছে';\n      headerStatus.className = 'active';\n      headerAvatar.classList.add('online');\n    } else {\n      headerStatus.textContent = fmtLastActive(d);\n      headerStatus.className = '';\n    }\n  }\n\n  // ---------- দুইজনের uid থেকে সবসময় একই ও নির্দিষ্ট conversationId বানানো হয় ----------\n  function makeConvId(a, b) { return [a, b].sort().join('_'); }\n\n  async function loadMessagingSettings() {\n    try {\n      const snap = await getDoc(doc(db, \"settings\", \"messages\"));\n      const d = snap.exists() ? snap.data() : {};\n      messagingEnabled = d.enabled !== false;\n      VOICE_MAX_SEC = Math.max(1, Math.min(60, Number(d.voiceMaxMin) || 5)) * 60;\n      AUDIO_MAX_MB = Math.max(1, Math.min(50, Number(d.audioMaxMB) || 10));\n      PHOTO_MAX_MB = Math.max(1, Math.min(20, Number(d.photoMaxMB) || 5));\n      disabledNotice.style.display = messagingEnabled ? 'none' : 'block';\n      sendBtn.disabled = !messagingEnabled;\n      messageInput.disabled = !messagingEnabled;\n      audioCallBtn.disabled = videoCallBtn.disabled = !messagingEnabled;\n    } catch (e) {\n      console.error('মেসেজিং সেটিংস লোড এরর:', e);\n    }\n  }\n\n  function clearUnreadListeners() { unreadUnsubs.forEach(u => { try { u(); } catch (e) {} }); unreadUnsubs = []; }\n  function stopInbox() { if (unsubInbox) { unsubInbox(); unsubInbox = null; } clearUnreadListeners(); }\n  function stopChat() {\n    if (unsubMessages) { unsubMessages(); unsubMessages = null; }\n    if (unsubOther) { unsubOther(); unsubOther = null; }\n    if (unsubConv) { unsubConv(); unsubConv = null; }\n    if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }\n    convId = null; otherUid = null; lastMsgSnap = null; otherLastActive = null; otherOnline = false;\n    otherSeenAt = null; replyingTo = null; editingId = null;\n    updateComposePreview();\n  }\n\n  // ================= ইনবক্স মোড =================\n  function startInbox() {\n    headerCenter.classList.add('inbox');\n    headerTitle.textContent = 'মেসেজ';\n    headerAvatar.style.display = 'none';\n    headerStatus.style.display = 'none';\n    logoutBtn.style.display = 'block';\n    callBtns.style.display = 'none';\n    inboxView.style.display = 'block';\n    chatView.style.display = 'none';\n    inboxLoading.style.display = 'block';\n    inboxLoading.textContent = 'লোড হচ্ছে...';\n    inboxEmpty.style.display = 'none';\n    convList.innerHTML = '';\n\n    const q = query(\n      collection(db, \"conversations\"),\n      where(\"participants\", \"array-contains\", currentUser.uid),\n      orderBy(\"lastMessageAt\", \"desc\")\n    );\n\n    unsubInbox = onSnapshot(q, snap => {\n      clearUnreadListeners();\n      inboxLoading.style.display = 'none';\n      if (snap.empty) {\n        inboxEmpty.style.display = 'block';\n        convList.innerHTML = '';\n        return;\n      }\n      inboxEmpty.style.display = 'none';\n      const frag = document.createDocumentFragment();\n      snap.forEach(d => {\n        const c = d.data();\n        const otherU = (c.participants || []).find(u => u !== currentUser.uid);\n        if (!otherU) return;\n        const info = (c.participantInfo && c.participantInfo[otherU]) || {};\n        const name = info.name || 'ব্যবহারকারী';\n        const photo = info.photoURL || '';\n        const lastRead = c.lastRead && c.lastRead[currentUser.uid];\n        const isUnread = c.lastMessageAt && c.lastSenderUid && c.lastSenderUid !== currentUser.uid &&\n          (!lastRead || lastRead.toMillis() < c.lastMessageAt.toMillis());\n\n        const row = document.createElement('div');\n        row.className = 'convRow' + (isUnread ? ' unread' : '');\n        row.innerHTML = `\n          ${avatarHtml(photo, name, 'md')}\n          <div class=\"convBody\">\n            <div class=\"convTop\">\n              <div class=\"convName\">${escapeHtml(name)}<\/div>\n              <div class=\"convTime\">${timeAgo(c.lastMessageAt)}<\/div>\n            <\/div>\n            <div class=\"convLast\">${escapeHtml(c.lastMessage || '')}<\/div>\n          <\/div>\n          ${isUnread ? '<div class=\"unreadSlot\"><div class=\"unreadDot\"><\/div><\/div>' : ''}\n        `;\n        // কয়টা নতুন মেসেজ (অন্যজনের পাঠানো, আমার শেষ পড়ার পরের) — গুনে সংখ্যা দেখানো হয়\n        if (isUnread) {\n          const slot = row.querySelector('.unreadSlot');\n          const mcol = collection(db, \"conversations\", d.id, \"messages\");\n          const cq = lastRead ? query(mcol, where(\"createdAt\", \">\", lastRead), limit(100)) : query(mcol, limit(100));\n          unreadUnsubs.push(onSnapshot(cq, ms => {\n            let n = 0;\n            ms.forEach(x => { if (x.data().senderUid !== currentUser.uid) n++; });\n            if (n > 0 && slot) slot.innerHTML = '<div class=\"unreadBadge\">' + (n > 99 ? bn(99) + '+' : bn(n)) + '<\/div>';\n          }, err => console.error('নতুন মেসেজ গণনা এরর:', err)));\n        }\n        bindLongPress(row, () => openInboxMenu(row, d.id));\n        row.addEventListener('click', () => {\n          if (lpConsumed()) return;   // লং-প্রেসের পরে ছাড়ার সময় যেন ভুল করে চ্যাট খুলে না যায়\n          // পেইজ রিলোড ছাড়াই চ্যাট খোলা — তাই আর লগইন স্ক্রিন আসে না\n          const url = location.pathname + '?uid=' + encodeURIComponent(otherU) +\n            '&name=' + encodeURIComponent(name) + '&avatar=' + encodeURIComponent(photo);\n          history.pushState({ inApp: true }, '', url);\n          route();\n        });\n        frag.appendChild(row);\n      });\n      convList.innerHTML = '';\n      convList.appendChild(frag);\n    }, err => {\n      console.error('ইনবক্স লোড এরর:', err);\n      inboxLoading.style.display = 'block';\n      inboxLoading.textContent = 'কনভারসেশন লোড করা যায়নি। (প্রথমবার হলে Firebase Console-এ ইনডেক্স তৈরি করার একটা লিংক ব্রাউজার কনসোলে (F12) দেখাতে পারে — সেখানে ক্লিক করে ইনডেক্স বানিয়ে নিন)';\n    });\n  }\n\n  // ================= চ্যাট মোড =================\n  function renderHeader() {\n    headerCenter.classList.remove('inbox');\n    headerTitle.textContent = otherName;\n    headerAvatar.innerHTML = avatarHtml(otherPhoto, otherName, 'hd');\n    headerAvatar.style.display = 'flex';\n    logoutBtn.style.display = 'none';\n    callBtns.style.display = 'flex';\n    renderStatus();\n  }\n\n  function renderMessages() {\n    const snap = lastMsgSnap;\n    if (!snap) return;\n    chatLoading.style.display = 'none';\n    if (snap.empty) {\n      messagesEmpty.style.display = 'block';\n      messagesList.innerHTML = '';\n      return;\n    }\n    messagesEmpty.style.display = 'none';\n    const frag = document.createDocumentFragment();\n    const myPhoto = myProfile.photoURL || (currentUser && currentUser.photoURL) || '';\n    co -------\n  // স্পিকার অন = (১) সম্ভব হলে ফোনের স্পিকার ডিভাইসে আউটপুট (২) ওপাশের আওয়াজ ২.২ গুণ জোরে (Web Audio)\n  let loudNodes = null;\n  let outputChanged = false;\n  function setMicUI(muted) {\n    micBtn.innerHTML = muted ? MIC_OFF_SVG : MIC_ON_SVG;\n    micLabel.textContent = muted ? 'আনমিউট' : 'মিউট';\n  }\n  function setSpeakerUI(on) {\n    speakerBtn.classList.toggle('on', !!on);\n    speakerLabel.textContent = on ? 'স্পিকার চালু' : 'স্পিকার';\n  }\n  function stopLoudBoost() {\n    if (loudNodes) {\n      try { loudNodes.src.disconnect(); loudNodes.gain.disconnect(); loudNodes.comp.disconnect(); } catch (e) {}\n      loudNodes = null;\n    }\n    remoteVideo.muted = false;\n  }\n  function startLoudBoost() {\n    const stream = remoteVideo.srcObject;\n    const ctx = getAudioCtx();\n    if (!stream || !ctx) return false;\n    const track = stream.getAudioTracks()[0];\n    if (!track) return false;\n    if (loudNodes && loudNodes.stream === stream && loudNodes.track === track) return true;\n    stopLoudBoost();\n    try {\n      if (ctx.state === 'suspended') ctx.resume().catch(() => {});\n      if (ctx.state !== 'running') return false;      // অডিও সিস্টেম চালু না থাকলে ভিডিও এলিমেন্ট মিউট করা হবে না (যাতে আওয়াজ কখনো বন্ধ না হয়)\n      const src = ctx.createMediaStreamSource(stream);\n      const gain = ctx.createGain(); gain.gain.value = 2.2;\n      const comp = ctx.createDynamicsCompressor();      // বেশি জোরে হলে ফাটা আওয়াজ ঠেকায়\n      src.connect(gain); gain.connect(comp); comp.connect(ctx.destination);\n      remoteVideo.muted = true;\n      loudNodes = { src, gain, comp, stream, track };\n      return true;\n    } catch (e) { stopLoudBoost(); return false; }\n  }\n  async function routeOutput(on) {\n    try {\n      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;\n      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audiooutput');\n      const target = on\n        ? devs.find(d => /speaker/i.test(d.label) && !/head|ear|bluetooth/i.test(d.label))\n        : devs.find(d => /earpiece|receiver/i.test(d.label));\n      if (!target) return;                              // আলাদা ডিভাইস না পেলে রাউটিং বদলানো হয় না\n      if (remoteVideo.setSinkId) await remoteVideo.setSinkId(target.deviceId);\n      if (audioCtx && audioCtx.setSinkId) await audioCtx.setSinkId(target.deviceId);\n      outputChanged = true;\n    } catch (e) {}\n  }\n  function resetOutput() {\n    if (!outputChanged) return;\n    outputChanged = false;\n    try { if (remoteVideo.setSinkId) remoteVideo.setSinkId('').catch(() => {}); } catch (e) {}\n    try { if (audioCtx && audioCtx.setSinkId) audioCtx.setSinkId('').catch(() => {}); } catch (e) {}\n  }\n  async function applyLoud(c) {\n    if (!c || call !== c) return;\n    if (c.loud) { startLoudBoost(); await routeOutput(true); }\n    else { stopLoudBoost(); await routeOutput(false); }\n  }\n\n  // ---------- আউটগোয়িং কল ----------\n  async function startOutgoingCall(type) {\n    if (call || incoming) { alert('আরেকটি কল চলছে।'); return; }\n    if (!currentUser || !otherUid || !messagingEnabled) return;\n    if (!callSupported()) return;\n    const c = newCall('caller', type);\n    c.peerUid = otherUid; c.peerName = otherName; c.peerPhoto = otherPhoto;\n    call = c;\n    showCallScreen(otherName, otherPhoto, type, 'কল করা হচ্ছে...');\n    try {\n      const stream = await getMedia(type, c.facing);\n      if (c.ended) { stream.getTracks().forEach(t => t.stop()); return; }\n      c.localStream = stream;\n    } catch (e) { mediaError(e); finishCall(''); hideCallScreen(); return; }\n\n    try {\n      c.ref = doc(collection(db, 'calls'));\n      const pc = createPeer(c);\n      const offer = await pc.createOffer();\n      await pc.setLocalDescription(offer);\n      if (c.ended) return;\n      await setDoc(c.ref, {\n        callerUid: currentUser.uid, calleeUid: otherUid,\n        callerName: myProfile.name || 'ব্যবহারকারী', callerPhoto: myProfile.photoURL || '',\n        calleeName: otherName, type, status: 'ringing',\n        offer: { type: offer.type, sdp: offer.sdp },\n        createdAt: serverTimestamp()\n      });\n      c.docCreated = true;\n      if (c.ended) { updateDoc(c.ref, { status: 'canceled', endedAt: serverTimestamp() }).catch(() => {}); logCallMessage(c, 'canceled'); return; }\n      c.sigReady = true;\n      flushQueued(c);\n      watchCall(c);\n      takeWakeLock();\n      setCallStatus('রিং হচ্ছে...');\n      startRing('back');\n      c.ringT = setTimeout(() => {\n        if (call === c && !c.answerSet) {\n          updateDoc(c.ref, { status: 'missed' }).catch(() => {});\n          logCallMessage(c, 'missed');\n          finishCall('কেউ ধরেননি');\n        }\n      }, RING_TIMEOUT_MS);\n    } catch (e) {\n      console.error('কল শুরু করা যায়নি:', e);\n      finishCall('কল করা যায়নি: ' + (e && e.message ? e.message : e));\n    }\n  }\n\n  // ---------- ইনকামিং কল ----------\n  function stopIncomingListener() { if (unsubIncoming) { unsubIncoming(); unsubIncoming = null; } }\n  function startIncomingListener() {\n    stopIncomingListener();\n    const q = query(collection(db, 'calls'),\n      where('calleeUid', '==', currentUser.uid), where('status', '==', 'ringing'));\n    unsubIncoming = onSnapshot(q, s => {\n      s.docChanges().forEach(ch => {\n        if (ch.type === 'added') onRing(ch.doc);\n        else if (ch.type === 'removed') { if (incoming && incoming.id === ch.doc.id) dismissIncoming(); }\n      });\n    }, err => console.error('ইনকামিং কল শোনা যাচ্ছে না (Firestore Rules চেক করুন):', err));\n  }\n  function onRing(docSnap) {\n    const d = docSnap.data();\n    if (incoming && incoming.id === docSnap.id) return;\n    const created = d.createdAt && d.createdAt.toMillis ? d.createdAt.toMillis() : Date.now();\n    if (Date.now() - created > 75000) return;              // পুরনো/আটকে থাকা রিং\n    if (call || incoming) { updateDoc(docSnap.ref, { status: 'busy' }).catch(() => {}); return; }\n    incoming = { id: docSnap.id, ref: docSnap.ref, data: d, timer: null };\n    incAvatar.innerHTML = avatarHtml(d.callerPhoto || '', d.callerName || '', 'xl');\n    incName.textContent = d.callerName || 'ব্যবহারকারী';\n    incType.textContent = d.type === 'video' ? '📹 ভিডিও কল আসছে...' : '📞 অডিও কল আসছে...';\n    incomingCall.style.display = 'flex';\n    startRing('ring');\n    incoming.timer = setTimeout(dismissIncoming, 50000);\n  }\n  function dismissIncoming() {\n    if (incoming) clearTimeout(incoming.timer);\n    incoming = null;\n    stopRing();\n    incomingCall.style.display = 'none';\n  }\n  async function declineIncoming() {\n    const inc = incoming;\n    if (!inc) return;\n    dismissIncoming();\n    updateDoc(inc.ref, { status: 'declined', endedAt: serverTimestamp() }).catch(() => {});\n  }\n  async function acceptIncoming() {\n    const inc = incoming;\n    if (!inc || call) return;\n    const d = inc.data;\n    dismissIncoming();\n    if (!callSupported()) { updateDoc(inc.ref, { status: 'declined' }).catch(() => {}); return; }\n    const c = newCall('callee', d.type);\n    c.ref = inc.ref;\n    call = c;\n    showCallScreen(d.callerName || 'ব্যবহারকারী', d.callerPhoto || '', d.type, 'কানেক্ট হচ্ছে...');\n    try {\n      const stream = await getMedia(d.type, c.facing);\n      if (c.ended) { stream.getTracks().forEach(t => t.stop()); return; }\n      c.localStream = stream;\n    } catch (e) {\n      mediaError(e);\n      updateDoc(inc.ref, { status: 'declined' }).catch(() => {});\n      finishCall(''); hideCallScreen();\n      return;\n    }\n    try {\n      const pc = createPeer(c);\n      await pc.setRemoteDescription(d.offer);\n      const answer = await pc.createAnswer();\n      await pc.setLocalDescription(answer);\n      if (c.ended) return;\n      await updateDoc(c.ref, { status: 'accepted', answer: { type: answer.type, sdp: answer.sdp } });\n      c.docCreated = true;\n      c.answerSet = true;\n      if (c.ended) { updateDoc(c.ref, { status: 'ended', endedAt: serverTimestamp() }).catch(() => {}); return; }\n      c.sigReady = true;\n      flushQueued(c);\n      watchCall(c);      // callerCandidates শুনবে (remoteDescription আগেই সেট, তাই সরাসরি যোগ হবে)\n      takeWakeLock();\n      armConnectTimeout(c);\n    } catch (e) {\n      console.error('কল ধরা যায়নি:', e);\n      updateDoc(inc.ref, { status: 'ended' }).catch(() => {});\n      finishCall('কল ধরা যায়নি');\n    }\n  }\n\n  // ---------- কল কন্ট্রোল ----------\n  micBtn.addEventListener('click', () => {\n    if (!call || !call.localStream) return;\n    const t = call.localStream.getAudioTracks()[0];\n    if (!t) return;\n    t.enabled = !t.enabled;\n    micBtn.classList.toggle('off', !t.enabled);\n    setMicUI(!t.enabled);\n  });\n  speakerBtn.addEventListener('click', () => {\n    const c = call;\n    if (!c) return;\n    c.loud = !c.loud;\n    setSpeakerUI(c.loud);\n    applyLoud(c);\n  });\n  camBtn.addEventListener('click', () => {\n    if (!call || !call.localStream) return;\n    const t = call.localStream.getVideoTracks()[0];\n    if (!t) return;\n    t.enabled = !t.enabled;\n    camBtn.classList.toggle('off', !t.enabled);\n  });\n  flipBtn.addEventListener('click', async () => {\n    const c = call;\n    if (!c || c.type !== 'video' || !c.pc) return;\n    const next = c.facing === 'user' ? 'environment' : 'user';\n    try {\n      const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: next } } });\n      const nt = ns.getVideoTracks()[0];\n      const old = c.localStream.getVideoTracks()[0];\n      nt.enabled = old ? old.enabled : true;\n      const sender = c.pc.getSenders().find(s => s.track && s.track.kind === 'video');\n      if (sender) await sender.replaceTrack(nt);\n      if (old) { old.stop(); c.localStream.removeTrack(old); }\n      c.localStream.addTrack(nt);\n      c.facing = next;\n      localVideo.style.transform = next === 'user' ? 'scaleX(-1)' : 'none';\n    } catch (e) { console.error('ক্যামেরা ঘোরানো যায়নি:', e); }\n  });\n  endBtn.addEventListener('click', () => hangup());\n  audioCallBtn.addEventListener('click', () => startOutgoingCall('audio'));\n  videoCallBtn.addEventListener('click', () => startOutgoingCall('video'));\n  incAccept.addEventListener('click', acceptIncoming);\n  incDecline.addEventListener('click', declineIncoming);\n\n  // ---------- পারমিশন: এক ট্যাপে মাইক + ক্যামেরা ----------\n  // ব্রাউজার নিয়ম: ওয়েবসাইট নিজে অনুমতি \"দিয়ে দিতে\" পারে না — ইউজারকে Allow চাপতেই হয়।\n  // তাই এখানে দুটো অনুমতি একসাথে (একটা প্রম্পটে) চাওয়া হয়, একবার Allow করলে ব্রাউজার মনে রাখে।\n  const permOpenBtn = document.getElementById('permOpenBtn');\n  const permSheet = document.getElementById('permSheet');\n  const permMicState = document.getElementById('permMicState');\n  const permCamState = document.getElementById('permCamState');\n  const permHelp = document.getElementById('permHelp');\n  const permGrantBtn = document.getElementById('permGrantBtn');\n  const permLaterBtn = document.getElementById('permLaterBtn');\n  const permReloadBtn = document.getElementById('permReloadBtn');\n  const PERM_LABEL = { granted: '✅ দেওয়া আছে', denied: '⛔ ব্লক করা', prompt: '⏳ দেওয়া হয়নি', unknown: '— (চাপলে জানা যাবে)' };\n\n  async function permState(name) {\n    try { return (await navigator.permissions.query({ name })).state; }\n    catch (e) { return 'unknown'; }\n  }\n  async function refreshPermUI() {\n    const mic = await permState('microphone');\n    const cam = await permState('camera');\n    permMicState.textContent = PERM_LABEL[mic] || '—';\n    permCamState.textContent = PERM_LABEL[cam] || '—';\n    const denied = mic === 'denied' || cam === 'denied';\n    permHelp.style.display = denied ? 'block' : 'none';\n    const allOk = mic === 'granted' && cam === 'granted';\n    permOpenBtn.style.display = allOk ? 'none' : 'block';\n    return { mic, cam, allOk, denied };\n  }\n  async function openPermSheet() {\n    permSheet. ign-items:center;justify-content:center;font-size:15px;font-family:inherit}<\/style>\n<\/head>\n<body>\n<div id=\"authLoading\">লোড হচ্ছে...<\/div>\n<script>(function(){var need={};function hide(){var e=document.getElementById(\"authLoading\");if(e)e.style.display=\"none\";}window.hideAuthLoading=hide;window.bootDone=function(k){delete need[k];for(var x in need)return;hide();};setTimeout(function(){hide();},10000);})();<\/script>\n\n<div id=\"app\">\n  <header>\n    <button class=\"hBtn\" id=\"hdrBack\" type=\"button\" aria-label=\"ফিরে যান\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 12H5M12 19l-7-7 7-7\"/><\/svg><\/button>\n    <h1 id=\"hdrTitle\">🔔 নোটিফিকেশন<\/h1>\n    <button class=\"hBtn\" id=\"hdrSettings\" type=\"button\" aria-label=\"সেটিংস\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/><\/svg><\/button>\n  <\/header>\n\n  <main>\n    <!-- লোড হচ্ছে (লগইন যাচাই শেষ হওয়া পর্যন্ত) -->\n    <section id=\"vLoad\" class=\"view active\">\n      <div class=\"secBar\"><button class=\"secBack\" type=\"button\" data-back>← ফিরে যান<\/button><span class=\"secTitle\">নোটিফিকেশন<\/span><\/div>\n      <div class=\"empty\">লোড হচ্ছে...<\/div>\n    <\/section>\n\n    <!-- লগইন নেই -->\n    <section id=\"vLogin\" class=\"view\">\n      <div class=\"secBar\"><button class=\"secBack\" type=\"button\" data-back>← ফিরে যান<\/button><span class=\"secTitle\">নোটিফিকেশন<\/span><\/div>\n      <div class=\"loginBox\">\n        <p>নোটিফিকেশন দেখতে Google দিয়ে লগইন করুন<\/p>\n        <button class=\"btn fill\" id=\"loginBtn\" type=\"button\">🔵 Google দিয়ে লগইন করুন<\/button>\n        <div id=\"loginMsg\" class=\"note\"><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- মূল পেজ: ওপরে সেকশনের বাটন (সব/পোস্ট/প্রোফাইল/...), নিচে সেই সেকশনের নোটিফিকেশন -->\n    <section id=\"vGroup\" class=\"view\">\n      <div class=\"tabs\" id=\"tabs\"><\/div>\n      <div class=\"clearRow\"><button class=\"btn\" id=\"grpClear\" type=\"button\">সব মুছুন<\/button><\/div>\n      <div id=\"groupItems\"><\/div>\n      <button class=\"btn loadMore\" id=\"grpMore\" type=\"button\" style=\"display:none\">আরও দেখুন<\/button>\n    <\/section>\n\n    <!-- সেকশন ৩: সেটিংস -->\n    <section id=\"vSettings\" class=\"view\">\n      <div class=\"secBar\"><button class=\"secBack\" type=\"button\" data-back>← ফিরে যান<\/button><span class=\"secTitle\">নোটিফিকেশন সেটিংস<\/span><\/div>\n      <div class=\"setRow\"><div class=\"lbl\">ব্রাউজার নোটিফিকেশন<br><small id=\"permState\" style=\"opacity:.7\"><\/small><\/div><button class=\"btn\" id=\"permBtn\" type=\"button\">চালু করুন<\/button><\/div>\n      <div class=\"sub\">কোন সেকশনের নোটিফিকেশন দেখতে চান<\/div>\n      <div id=\"muteList\"><\/div>\n      <div class=\"note\">এই পছন্দ শুধু এই ডিভাইসে প্রযোজ্য। বন্ধ করা সেকশনের নোটিফিকেশন জমা হবে, কিন্তু গণনা ও পপআপে আসবে না।<\/div>\n    <\/section>\n  <\/main>\n<\/div>\n\n<script type=\"module\">\nimport { GoogleAuthProvider, signInWithPopup } from \"https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js\";\nimport { doc, onSnapshot } from \"https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js\";\nimport { OnuNotify, GROUPS, TYPES, auth, db, getMuted, setMuted, timeAgo } from \"./notify.js\";\nimport { getApp } from \"https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js\";\n(function(){var go=function(){setTimeout(function(){import(\"https://www.gstatic.com/firebasejs/11.4.0/firebase-analytics.js\").then(function(m){m.getAnalytics(getApp())}).catch(function(){})},2500)};document.readyState===\"complete\"?go():window.addEventListener(\"load\",go)})();\n\nconst $ = id => document.getElementById(id);\nconst bn = n => String(n).replace(/\\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);\nconst GMAP = {}; GROUPS.forEach(g => GMAP[g.k] = g);\n\n// থিম লাইভ\nonSnapshot(doc(db, \"settings\", \"site\"), snap => {\n  if (!snap.exists()) return;\n  const t = snap.data().theme === 'light' ? 'light' : 'dark';\n  document.documentElement.setAttribute('data-theme', t);\n  try { localStorage.setItem('onuvutiTheme', t); } catch (e) {}\n}, () => {});\n\n// ---------------- ভিউ ও ব্যাক বাটন ----------------\nlet view = 'group', curGroup = 'all', shown = 30, readTimer = null;\nconst VIEWS = { load: 'vLoad', login: 'vLogin', group: 'vGroup', settings: 'vSettings' };\nfunction show(v) {\n  view = v;\n  if (v !== 'load' && window.hideAuthLoading) window.hideAuthLoading();\n  Object.values(VIEWS).forEach(id => $(id).classList.remove('active'));\n  $(VIEWS[v]).classList.add('active');\n  $('hdrSettings').style.visibility = (v === 'load' || v === 'login' || v === 'settings') ? 'hidden' : 'visible';\n  $('hdrTitle').textContent = v === 'settings' ? '⚙️ সেটিংস' : '🔔 নোটিফিকেশন';\n  window.scrollTo(0, 0);\n  render();\n}\nfunction push(v, g) {\n  curGroup = g || curGroup;\n  history.pushState({ nf: v, g: curGroup }, '', location.pathname + __loc.search);\n  show(v);\n}\nwindow.addEventListener('popstate', e => {\n  const st = e.state;\n  if (!auth.currentUser) { show('login'); return; }\n  if (st && st.nf === 'settings') show('settings');\n  else { if (st && st.g) curGroup = st.g; show('group'); }\n});\n// আগের পেজে ফেরা: ব্রাউজারের হিস্টরি থাকলে সেটাই, নইলে যে পেজ থেকে এসেছিল সেখানে (না থাকলে হোম)\nfunction leavePage() {\n  let from = ''; try { from = sessionStorage.getItem('onuNfFrom') || ''; } catch (e) {}\n  if (history.length > 1) history.back();\n  else __go(from || 'index.html');\n}\nfunction goBack() { if (view === 'settings') history.back(); else leavePage(); }\n$('hdrBack').addEventListener('click', goBack);\ndocument.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', goBack));\n$('hdrSettings').addEventListener('click', () => push('settings'));\n\n// ---------------- রেন্ডার ----------------\nfunction visible(items) {\n  const m = getMuted();\n  return items.filter(it => !((m.groups || {})[it.group] || (m.types || {})[it.type]));\n}\nfunction itemEl(it) {\n  const el = document.createElement('div');\n  el.className = 'item' + (it.unread ? ' unread' : '');\n  const av = document.createElement('div'); av.className = 'av';\n  if (it.fromPhoto) { const im = document.createElement('img'); im.src = it.fromPhoto; im.alt = ''; im.referrerPolicy = 'no-referrer'; im.onerror = () => { im.remove(); av.textContent = it.icon || '🔔'; }; av.appendChild(im); const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = it.icon || '🔔'; av.appendChild(tg); }\n  else av.textContent = it.icon || '🔔';\n  const body = document.createElement('div'); body.className = 'iBody';\n  const t = document.createElement('div'); t.className = 'iTitle'; t.textContent = it.title || '';\n  body.appendChild(t);\n  let txt = it.body || '';\n  if (it.count > 1) txt = (txt ? txt + ' · ' : '') + bn(it.count) + 'টি নতুন';\n  if (txt) { const x = document.createElement('div'); x.className = 'iText'; x.textContent = txt; body.appendChild(x); }\n  const tm = document.createElement('div'); tm.className = 'iTime'; tm.textContent = timeAgo(it.ms); body.appendChild(tm);\n  el.appendChild(av); el.appendChild(body);\n  if (it.unread) { const d = document.createElement('div'); d.className = 'dot'; el.appendChild(d); }\n  const del = document.createElement('button'); del.className = 'iDel'; del.type = 'button'; del.setAttribute('aria-label', 'মুছুন'); del.textContent = '✕';\n  del.addEventListener('click', ev => { ev.stopPropagation(); OnuNotify.remove(it); });\n  el.appendChild(del);\n  el.addEventListener('click', async () => {\n    if (it.unread) { try { await OnuNotify.markRead(it); } catch (e) {} }\n    if (it.link) { try { sessionStorage.setItem('onuNfFrom', location.href); } catch (e) {} __go(it.link); }\n  });\n  return el;\n}\nfunction fillList(box, items, emptyMsg) {\n  box.innerHTML = '';\n  if (!items.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = emptyMsg; box.appendChild(e); return; }\n  items.forEach(it => box.appendChild(itemEl(it)));\n}\n// ---- ওপরের সেকশন বাটন ----\nconst TAB_LABEL = { message: 'মেসেজ', system: 'অ্যাডমিন' };\nconst TABS = [{ k: 'all', label: 'সব' }].concat(GROUPS.map(g => ({ k: g.k, label: TAB_LABEL[g.k] || g.label })));\nfunction buildTabs() {\n  const box = $('tabs'); box.innerHTML = '';\n  TABS.forEach(t => {\n    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.dataset.k = t.k; b.textContent = t.label;\n    b.addEventListener('click', () => selectTab(t.k));\n    box.appendChild(b);\n  });\n}\nfunction markTabs(scroll) {\n  document.querySelectorAll('#tabs .tab').forEach(b => {\n    const on = b.dataset.k === curGroup;\n    b.classList.toggle('active', on);\n    if (on && scroll) { try { b.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }\n  });\n}\nfunction selectTab(k) {\n  curGroup = k; shown = 30;\n  history.replaceState({ nf: 'group', g: k }, '', location.pathname + __loc.search);\n  window.scrollTo(0, 0);\n  markTabs(true);\n  render();\n}\nfunction currentList() {\n  const items = visible(OnuNotify.state.items);\n  return curGroup === 'all' ? items : items.filter(it => it.group === curGroup);\n}\n// এই পেজে ঢুকলেই (মেসেজ ছাড়া) সব নতুন নোটিফিকেশন সাথে সাথে পড়া হয়ে যায়, তাই হোমের সবুজ বেল সাদা হয়\n// (মেসেজ-সেকশনের নতুন নোটিফিকেশন পড়া হয় মেসেজ পেজে ঢুকলে)\nfunction scheduleRead() {\n  clearTimeout(readTimer);\n  readTimer = setTimeout(() => {\n    const fresh = OnuNotify.state.items.filter(i => i.unread && i.group !== 'message');\n    if (fresh.length) OnuNotify.markAllRead(fresh);\n  }, 150);\n}\nfunction render() {\n  const st = OnuNotify.state;\n  if (!st.user) return;\n  if (view === 'group') {\n    markTabs(false);\n    const list = currentList();\n    $('grpClear').disabled = !list.length;\n    const part = list.slice(0, shown);\n    fillList($('groupItems'), part, curGroup === 'all' ? 'এখনো কোনো নোটিফিকেশন নেই।' : 'এই সেকশনে এখনো কোনো নোটিফিকেশন নেই।');\n    $('grpMore').style.display = list.length > shown ? 'block' : 'none';\n    scheduleRead();\n  } else {\n    clearTimeout(readTimer);\n    if (view === 'settings') renderSettings();\n  }\n}\n$('grpClear').addEventListener('click', () => {\n  const l = currentList();\n  if (l.length && confirm(l.length + 'টি নোটিফিকেশন মুছে ফেলবেন?')) OnuNotify.removeMany(l);\n});\n$('grpMore').addEventListener('click', () => { shown += 30; render(); });\n\n// ---------------- সেটিংস ----------------\nfunction swRow(label, checked, onChange, small) {\n  const r = document.createElement('div'); r.className = 'setRow' + (small ? ' small' : '');\n  const l = document.createElement('div'); l.className = 'lbl'; l.textContent = label;\n  const s = document.createElement('label'); s.className = 'sw';\n  const i = document.createElement('input'); i.type = 'checkbox'; i.checked = checked;\n  i.addEventListener('change', () => onChange(i.checked));\n  s.appendChild(i); s.appendChild(document.createElement('i'));\n  r.appendChild(l); r.appendChild(s); return r;\n}\nfunction renderSettings() {\n  const box = $('muteList'); box.innerHTML = '';\n  const m = getMuted(); m
