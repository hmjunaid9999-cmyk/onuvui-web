<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Onuvuti Lite</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#000;--fg:#f2f2f2;--card:#1c1c1e;--line:#333;--g:#22c55e}
:root.light{--bg:#fff;--fg:#111;--card:#f1f1f3;--line:#d8d8dc}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#liteBar{padding:6px 10px;border-top:1px solid var(--line);background:var(--bg)}
#top{display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
#ttl{font-weight:700;color:var(--g);font-size:16px;flex:1;text-align:center}
#pills{display:flex;gap:8px;overflow-x:auto}
.pill{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:15px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--fg);color:var(--bg)}.pill.has{border-color:var(--g);color:var(--g)}.pill.on.has{color:var(--bg)}
#frames{flex:1;position:relative}#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;pointer-events:none;background:var(--bg)}#frames iframe.on{visibility:visible;pointer-events:auto;z-index:1}
.full{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}.full.on{display:flex}
.full header{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
.full .body{flex:1;overflow:auto;padding:12px}
.item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;text-align:left;cursor:pointer}
.seg{display:flex;gap:6px}.seg button{padding:7px 12px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}.seg button.on{background:var(--g);color:#000;border-color:var(--g)}
.empty{opacity:.6;text-align:center;padding:30px}
</style></head><body><div id="app">

ogBigOpen || '(', s.blogBigClose || ')'],\n      med: [s.blogMedOpen || '{', s.blogMedClose || '}'],\n      small: [s.blogSmallOpen || '[', s.blogSmallClose || ']'],\n      link: [s.blogLinkOpen || '<', s.blogLinkClose || '>']\n    };\n    updateBlogSyntaxHint();\n\n    if (s.bottomButtons && s.bottomButtons.length) buttonOrder.bottom = s.bottomButtons;\n    if (s.menuButtons && s.menuButtons.length) buttonOrder.menu = s.menuButtons;\n    if (s.commentBottomButtons && s.commentBottomButtons.length) commentButtonOrder.bottom = s.commentBottomButtons;\n    if (s.commentMenuButtons && s.commentMenuButtons.length) commentButtonOrder.menu = s.commentMenuButtons;\n    if (s.posterColors && s.posterColors.length) buildPosterSwatches(s.posterColors);\n    postsPerPage = s.postsPerPage || 5;\n    readMoreLines = s.readMoreLines || 6;\n    if (allLoadedPosts.length) renderPosts();\n    siteLogo.src = s.logoUrl || 'https://hmjunaid9999-cmyk.github.io/Onuvuti/icon-192.png';\n    const composerLogoEl = document.getElementById('composerLogo');\n    if (composerLogoEl) { composerLogoEl.style.display = ''; composerLogoEl.src = siteLogo.src; }\n    siteName.textContent = s.siteName || 'Onuvuti';\n    footerSiteName.textContent = s.siteName || 'Onuvuti';\n    noticeText.textContent = s.noticeText || '';\n    composerText.placeholder = s.composerPlaceholder || 'আপনার মনে কী চলছে?';\n    posterPlaceholderText = s.posterPlaceholder || 'পোস্টারের লেখা এখানে দেখাবে';\n    renderCombined(menuGrid, s.menuEntries || buildLegacyEntries(s.menuItems, s.menuGadgets));\n    renderCombined(footerGrid, s.footerEntries || buildLegacyEntries(s.footerItems, s.footerGadgets));\n    renderCombined(sidebarGrid, s.sidebarEntries || buildLegacyEntries(s.sidebarItems, s.sidebarGadgets));\n\n    aboutUsContent.textContent = s.aboutUsText || '';\n    if (s.aboutUsText) siteMetaDescription.setAttribute('content', s.aboutUsText.slice(0, 300));\n  }\n\n  let firstSettingsHandled = false;\n  function startFeedOnc return sbClient;\n  }\n\n  // সীমা — মেসেজের মতোই এডমিন প্যানেলের settings/messages থেকে আসে\n  let AUDIO_MAX_MB = 10, PHOTO_MAX_MB = 5, VOICE_MAX_SEC = 300;\n  let limitsLoadedAt = 0;\n  function bnNum(n) { return String(n).replace(/\\d/g, d => '০১২৩৪৫৬৭৮৯'[d]); }\n  function fmtSec(t) {\n    t = Math.max(0, Math.round(t || 0));\n    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');\n  }\n  function fmtMB(b) { return (b / 1048576).toFixed(1) + ' MB'; }\n  function escAttr(str) { return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/\"/g, '&quot;').replace(/<\/g, '&lt;'); }\n  function paintMediaHints() {\n    const set = (k, v) => document.querySelectorAll('.cmHint[data-hint=\"' + k + '\"]').forEach(el => { el.textContent = v; });\n    set('photo', 'সর্বোচ্চ ' + bnNum(PHOTO_MAX_MB) + ' MB');\n    set('voice', 'সর্বোচ্চ ' + bnNum(Math.round(VOICE_MAX_SEC / 60)) + ' মিনিট');\n    set('audio', 'সর্বোচ্চ ' + bnNum(AUDIO_MAX_MB) + ' MB');\n    vrLimit.textContent = 'সর্বোচ্চ ' + fmtSec(VOICE_MAX_SEC);\n  }\n  async function loadMediaLimits(force) {\n    if (!force && limitsLoadedAt && Date.now() - limitsLoadedAt < 60000) return;\n    try {\n      const snap = await getDoc(doc(db, \"settings\", \"messages\"));\n      const d = snap.exists() ? snap.data() : {};\n      VOICE_MAX_SEC = Math.max(1, Math.min(60, Number(d.voiceMaxMin) || 5)) * 60;\n      AUDIO_MAX_MB = Math.max(1, Math.min(50, Number(d.audioMaxMB) || 10));\n      PHOTO_MAX_MB = Math.max(1, Math.min(20, Number(d.photoMaxMB) || 5));\n      limitsLoadedAt = Date.now();\n    } catch (e) { console.warn('মিডিয়া সীমা লোড এরর:', e); }\n    paintMediaHints();\n  }\n\n  // ডাউনলোড: শুরুতে \"ডাউনলোড হচ্ছে...\", শেষে \"ডাউনলোড সম্পূর্ণ হয়েছে\" — স্ক্রিনে ছোট বার্তা (টোস্ট)\n  let dlBusy = false;\n  function saveBlobAs(blob, name) {\n    const objUrl = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = objUrl; a.download = name; a.rel = 'noopener';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => { try { URL.revokeObjectURL(objUrl); } catch (e) {} }, 20000);\n  }\n  // ডাউনলোডের আগে (প্রথমবার থেকেই) নিশ্চিতকরণ: \"আপনি কি নিশ্চিত যে ডাউনলোড করতে চান?\"\n  const dlConfirmOverlay = document.getElementById('dlConfirmOverlay');\n  const dlConfirmName = document.getElementById('dlConfirmName');\n  let dlResolve = null;\n  function confirmDownload(name) {\n    return new Promise(resolve => {\n      if (dlResolve) { const prev = dlResolve; dlResolve = null; prev(false); }\n      dlResolve = resolve;\n      dlConfirmName.textContent = name || '';\n      dlConfirmOverlay.classList.add('open');\n      rearmGuard();\n    });\n  }\n  function closeDlConfirm(ok) {\n    dlConfirmOverlay.classList.remove('open');\n    const r = dlResolve; dlResolve = null;\n    if (r) r(!!ok);\n  }\n  document.getElementById('dlYesBtn').addEventListener('click', () => closeDlConfirm(true));\n  document.getElementById('dlNoBtn').addEventListener('click', () => closeDlConfirm(false));\n  dlConfirmOverlay.addEventListener('click', ev => { if (ev.target === dlConfirmOverlay) closeDlConfirm(false); });\n\n  async function downloadMedia(url, name) {\n    if (!url || dlBusy) return;\n    name = name || ('file-' + Date.now());\n    if (!(await confirmDownload(name))) return;\n    if (dlBusy) return;\n    dlBusy = true;\n    showPostToast('⬇️ ডাউনলোড হচ্ছে...', 0);\n    try {\n      const res = await fetch(url, { mode: 'cors' });\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      const blob = await res.blob();\n      saveBlobAs(blob, name);\n      showPostToast('✅ ডাউনলোড সম্পূর্ণ হয়েছে', 2500);\n    } catch (e) {\n      // সরাসরি ফেচ না হলে ব্রাউজারের নিজস্ব ডাউনলোডে ছেড়ে দেওয়া হয়\n      try {\n        const a = document.createElement('a');\n        a.href = url + (url.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(name);\n        a.download = name; a.rel = 'noopener';\n        document.body. tons{position:static;clear:both;flex-wrap:nowrap;margin:10px 0 0;padding:8px 6px;border-top:none;background:var(--ash-bg);border-radius:12px}\n.postCard .postStatus:empty{display:none}\n.postButtons button{background:var(--ash-btn)}\n.postButtons button.liked{background:var(--ash-btn)}\n/* নাম ও সময়ের মাঝে একটু বাড়তি ফাঁক */\n.postHeader .pName{line-height:1.35}\n.postHeader .pTime{margin-top:5px;line-height:1.3}\n/* বাটনের সারির ধূসর ব্যাকগ্রাউন্ড বাদ — শুধু তিনটা বাটন ধূসর থাকবে */\n.postButtons{background:transparent;padding-left:0;padding-right:0}\n/* ভয়েসের শিরোনাম লেখা না থাকলে শিরোনামের জায়গা ফাঁকা থাকবে না */\n.mpTitle.mpTitleEmpty{display:none}\nbody.commentFocus #filterTabs,body.commentFocus #subTabs{display:none!important}\n\n/* ===== কম্পোজারে ফটো / ভয়েস / অডিও অপশন (টেক্সট বক্স আর পোস্ট বাটনের মাঝে) ===== */\n#composerMedia{display:none;margin-top:10px}\n#composerMedia.show{display:block}\n#composerMediaList{display:flex;flex-direction:column;gap:8px}\n.cmRow{display:flex;align-items:center;gap:12px;width:100%;background:var(--ash-bg);color:var(--text-color);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;text-align:left;-webkit-tap-highlight-color:transparent}\n.cmRow:active{background:var(--ash-btn)}\n.cmIcon{width:36px;height:36px;border-radius:50%;background:var(--ash-btn);display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.cmIcon svg,#paIcon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.cmLabel{flex:1}\n.cmHint{font-size:11px;font-weight:normal;opacity:.75}\n#composer.editingMedia #composerTabs{display:none}\n#postAttachPreview{display:none;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;background:var(--ash-bg);border:1px solid var(--line);border-radius:14px}\n#postAttachPreview.has{display:flex}\n#paThumb{width:52px;height:52px;border-radius:10px;object-fit:cover;display:none;flex-shrink:0}\n#paIcon{width:52px;height:52px;border-radius:10px;background:#16a34a;color:#fff;display:none;align-items:center;justify-content:center;flex-shrink:0}\n#paInfo{flex:1;min-width:0}\n#paName{font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n#paSize{font-size:12px;opacity:.8;margin-top:2px}\n#paClose{background:var(--ash-btn);color:var(--text-color);border:none;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0}\n\n/* ===== পোস্টে ফটো ===== */\n.postPhotoWrap{margin:6px 0 8px;border-radius:12px;overflow:hidden;background:var(--ash-bg)}\n.postPhoto{display:block;width:100%;height:auto;max-height:75vh;object-fit:cover;margin:0;border-radius:0;cursor:pointer}\n.mpGoneBox{padding:22px 12px;text-align:center;font-size:13px}\n\n/* ===== মিউজিক প্লেয়ার (বর্গাকার — ভয়েস ও অডিও পোস্ট) ===== */\n.mp{position:relative;width:100%;max-width:340px;aspect-ratio:20/17;margin:8px auto 10px;border-radius:22px;background:linear-gradient(180deg,#0a0e19 0%,#0b1020 100%);color:#fff;display:flex;flex-direction:column;padding:14px 14px 10px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.14);-webkit-user-select:none;user-select:none}\n.mpViz{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}\n.mpGlow{position:absolute;inset:-12% -20%;background:radial-gradient(38% 55% at 20% 50%,rgba(255,70,50,.42),transparent 70%),radial-gradient(38% 55% at 80% 50%,rgba(40,150,255,.42),transparent 70%),radial-gradient(34% 45% at 50% 50%,rgba(220,60,240,.30),transparent 70%);opacity:.45;transition:opacity .5s ease;filter:blur(8px);pointer-events:none}\n.mp.playing .mpGlow{opacity:1}\n.mpBars{position:relative;display:flex;align-items:center;justify-content:space-between;gap:3px;width:100%;height:100%}\n.mpBars i{display:block;flex:1;max-width:7px;height:var(--h);border-radius:4px;background:var(--c);box-shadow:0 0 9px var(--c);transform-origin:center;animation:mpViz var(--t) ease-in-out infinite alternate;animation-delay:var(--d);animation-play-state:paused;will-change:transform}\n.mp.playing .mpBars i{animation-play-state:running}\n@keyframes mpViz{from{transform:scaleY(.2)}to{transform:scaleY(1)}}\n.mpInfo{text-align:center;margin-top:6px;min-width:0}\n.mpTitle{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.mpTitleIn{display:inline-block;white-space:nowrap}\n.mpTitle.marq{text-align:left;text-overflow:clip}\n.mpTitle.marq .mpTitleIn{padding-left:100%;animation:mpMarq var(--md,12s) linear infinite;will-change:transform}\n@keyframes mpMarq{from{transform:translateX(0)}to{transform:translateX(-100%)}}\n.mpSub{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}\n.mpSeek{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;font-variant-numeric:tabular-nums}\n.mpSeek span{min-width:32px;opacity:.9}\n.mpSeek .mpTot{text-align:right}\n.mpLine{position:relative;flex:1;height:26px;margin:0 7px;cursor:pointer;touch-action:none}\n.mpSvg{position:absolute;left:0;top:0;width:100%;height:26px;overflow:visible;pointer-events:none;display:block}\n.mpCtl svg.mpSvg{width:100%;height:26px}\n.mpCtl{display:flex;align-items:center;justify-content:space-between;margin-top:2px}\n.mpCtl button{background:none;border:none;color:#fff;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;-webkit-tap-highlight-color:transparent;font-family:inherit}\n.mpCtl button:active{background:rgba(255,255,255,.14)}\n.mpCtl svg{width:24px;height:24px}\n.mpSpeed{font-size:13px;font-weight:bold}\n.mpLoop svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.65}\n.mpLoop.on svg{opacity:1;stroke:#3fe0ff}\n.mpLoop.on{color:#3fe0ff}\n.mpCtl .mpBtn{width:58px;height:58px;border:none;background:transparent;position:relative}\n.mpCtl .mpBtn svg.mpRing{position:absolute;left:0;top:0;width:100%;height:100%}\n.mpIco{display:flex;align-items:center;justify-content:center;position:relative}\n.mpCtl .mpBtn .mpIco svg{width:26px;height:26px}\n.mp.playing .mpBtn::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(63,224,255,.7);animation:mpPulse 1.5s ease-out infinite;pointer-events:none}\n@keyframes mpPulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.3);opacity:0}}\n.mpGone{display:none;flex:1;align-items:center;justify-content:center;text-align:center;font-size:14px}\n.mp.broken > :not(.mpGone){display:none}\n.mp.broken .mpGone{display:flex}\n@media (prefers-reduced-motion:reduce){.mpBars i,.mp.playing .mpBtn::after,.mpTitle.marq .mpTitleIn{animation:none}.mpTitle.marq .mpTitleIn{padding-left:0}}\n\n/* ===== সাব-অপশন: পোস্ট (টেক্সট|পোস্টার|ব্লগ) ও অডিও (রেকর্ড|মিউজিক) ===== */\n#subTabs{display:none;align-items:center;gap:8px;margin:-4px 0 16px}\n#subBtns{display:flex;gap:8px;flex:1;min-width:0}\n#subBtns button{flex:1;background:var(--surface);color:var(--text-muted);border:none;padding:9px 4px;border-radius:14px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:inset 0 0 0 1px var(--line);-webkit-tap-highlight-color:transparent}\n#subBtns button.active{background:var(--primary-color);color:var(--bg-color)}\nbody.commentFocus #subTabs,body.aboutUsOpen #subTabs{display:none!important}\n\n/* ===== টেক্সট সিলেক্ট / কপি মেনু বন্ধ (ইনপুট বক্স বাদে) ===== */\nhtml,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\ninput,textarea,[contenteditable=\"true\"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}\nimg{-webkit-user-drag:none;-webkit-touch-callout:none}\n#postToast{z-index:950}\n\n/* ===== পোস্ট/কমেন্টের তিন-ডট মেনু খোলা থাকলে নিচের পেজ স্থির থাকবে ===== */\nhtml:has(.postMenuDropdown.open),html:has(.commentMenuDropdown.open),body:has(.postMenuDropdown.open),body:has(.commentMenuDropdown.open){overflow:hidden!important;overscroll-behavior:none}\nbody:has(.postMenuDropdown.open) #postMenuBackdrop,body:has(.commentMenuDropdown.open) #postMenuBackdrop,.postMenuDropdown,.commentMenuDropdown{touch-action:none}\n\n/* ===== ভয়েস রেকর্ড পেজ ===== */\n#voicePage{display:none;position:fixed;inset:0;z-index:260;background:var(--bg-color);color:var(--text-color);flex-direction:column}\n#voicePage.open{display:flex}\nbody.voiceOpen,body.viewerOpen{overflow:hidden}\n#vrHeader{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;border-bottom:1px solid var(--line)}\n#vrTitle{font-size:17px;font-weight:bold}\n#vrBody{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 18px;width:100%;max-width:var(--max-width);margin:0 auto}\n#vrHint{font-size:14px;text-align:center;min-height:20px;opacity:.85}\n#vrTimer{font-size:58px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}\n#vrLimit{font-size:12px;opacity:.7}\n#vrMeter{display:flex;align-items:center;justify-content:center;gap:3px;height:64px;width:100%;max-width:320px}\n#vrMeter i{display:block;width:4px;height:8%;border-radius:2px;background:var(--ash-btn);transition:height .08s linear,background .2s}\n#vrMeter.fake i{animation:vrFake .6s ease-in-out infinite alternate}\n#vrMeter.fake i:nth-child(3n){animation-delay:.1s}\n#vrMeter.fake i:nth-child(3n+1){animation-delay:.25s}\n@keyframes vrFake{from{height:12%}to{height:70%}}\n#voicePage[data-state=\"rec\"] #vrMeter i{background:#dc2626}\n#voicePage[data-state=\"fixed\"] #vrMeter,#voicePage[data-state=\"upload\"] #vrMeter{display:none}\n#vrCtlRow{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:4px}\n.vrSide{width:54px;height:54px;border-radius:50%;border:none;background:var(--ash-btn);color:var(--text-color);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 0 0 1px var(--line)}\n.vrSide svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.vrSide .icPause{display:none;fill:currentColor;stroke:none}\n.vrSide.on .icPlay{display:none}\n.vrSide.on .icPause{display:block}\n#voicePage[data-state=\"idle\"] .vrSide,#voicePage[data-state=\"rec\"] .vrSide,#voicePage[data-state=\"upload\"] .vrSide{opacity:.35;pointer-events:none}\n#vrEditPanel{display:none;position:absolute;inset:0;z-index:5;background:var(--bg-color);color:var(--text-color);flex-direction:column}\n#vrEditPanel.open{display:flex}\n#vrEdHead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;border-bottom:1px solid var(--line);font-size:17px;font-weight:bold}\n#vrEdBody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:20px 18px;width:100%;max-width:var(--max-width);margin:0 auto}\n#edCanvas{width:100%;height:90px;border-radius:12px;background:var(--ash-bg)}\n.edRow{display:flex;flex-direction:column;gap:6px;font-size:14px}\n.edRow label{display:flex;justify-content:space-between}\n.edRow input[type=range]{width:100%;accent-color:var(--text-color)}\n#edNoise{display:flex;gap:8px}\n#edNoise button{flex:1;padding:10px 4px;border:none;border-radius:10px;background:var(--ash-btn);color:var(--text-color);font-size:13px;font-family:inherit;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}\n#edNoise button.on{background:var(--text-color);color:var(--bg-color);font-weight:bold}\n#edMsg{font-size:13px;min-height:16px;text-align:center}\n#edNote{font-size:12px;opacity:.7;line-height:1.6}\n#vrEdFooter{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}\n#vrEdFooter button{flex:1;padding:13px 6px;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;background:var(--ash-btn);color:var(--text-color)}\n#    } catch (err) {\n      // এই চেক ব্যর্থ হলে (যেমন Firestore Rules-এ পারমিশন সমস্যা) যেন পুরো লগইন প্রসেস\n      // আটকে না যায় — লগইন স্বাভাবিকভাবে চলতে দেওয়া হচ্ছে (fail-open)\n      console.error('checkAccountBlocked এরর:', err);\n      return false;\n    }\n  }\n\n  // পেজ থেকে বের হয়ে আগের পেজে (যেখান থেকে এসেছি) ফেরা; আগের পেজ না থাকলে হোমে\n  function navigateBack() {\n    let sameOrigin = false;\n    try { sameOrigin = !!document.referrer && new URL(document.referrer).origin === __loc.origin; } catch (e) {}\n    if (sameOrigin || window.history.length > 3) window.history.back();\n    else __go('index.html');\n  }\n  backBtn.addEventListener('click', () => {\n    // ব্যাক-গার্ড চালু থাকলে ফোনের Back-এর মতোই চলে: আগে খোলা জিনিস (তালিকা/মেনু/মডাল) বন্ধ হবে, না থাকলে পেছনে যাবে\n    if (backGuardActive) window.history.back();\n    else navigateBack();\n  });\n\n  function escapeHtml(str) { return (str || '').replace(/<\/g, '&lt;'); }\n\n  // চিহ্নগুলো (যেমন ( অথবা ** ইত্যাদি) রেজেক্সের মধ্যে নিরাপদে বসানোর জন্য\n  function escapeRegex(str) {\n    return String(str || '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n  }\n\n  const BLOG_SIZE_DEFS = [\n    { key: 'big', cls: 'blogBig' },\n    { key: 'med', cls: 'blogMed' },\n    { key: 'small', cls: 'blogSmall' }\n  ];\n\n  function renderBlogText(raw) {\n    let s = escapeHtml(raw || '');\n    BLOG_SIZE_DEFS.forEach(({ cls, key }) => {\n      const sym = blogSymbols[key];\n      const open = sym && sym[0], close = sym && sym[1];\n      if (!open || !close) return;\n      const o = escapeRegex(escapeHtml(open)), c = escapeRegex(escapeHtml(close));\n      const re = new RegExp(o + '([\\\\s\\\\S]+?)' + c, 'g');\n      s = s.replace(re, '<span class=\"' + cls + '\">$1<\/span>');\n    });\n    const linkSym = blogSymbols.link;\n    const lo = linkSym && linkSym[0], lc = linkSym && linkSym[1];\n    if (lo && lc) {\n      const o = escapeRegex(escapeHtml(lo)), c = escapeRegex(escapeHtml(lc));\n      const re = new ria-hidden=\"true\" style=\"vertical-align:-0.14em\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"#1877f2\"/><path fill=\"#fff\" transform=\"translate(4.8 4.6) scale(.6)\" d=\"M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z\"/><\/svg>';\n  function reactIcon(r) { return r.k === 'like' ? BLUE_THUMB : r.e; }\n\n  function reactionTypeOf(d, uid) {\n    if (!uid || !(d.likedBy || []).includes(uid)) return null;\n    const r = d.reactions && d.reactions[uid];\n    return (r && REACT_MAP[r.type]) ? r.type : 'like';\n  }\n  function myReactionOf(d) { return currentUser ? reactionTypeOf(d, currentUser.uid) : null; }\n\n  async function setPostReaction(postId, d, type) {\n    const uid = currentUser.uid;\n    const upd = {};\n    if (type === null) {\n      upd.likedBy = arrayRemove(uid);\n      upd['reactions.' + uid] = deleteField();\n    } else {\n      upd.likedBy = arrayUnion(uid);\n      upd['reactions.' + uid] = { type: type, name: currentUser.displayName || 'ব্যবহারকারী', photo: currentUser.photoURL || '' };\n    }\n    await updateDoc(doc(db, \"posts\", postId), upd);\n    try { window.OnuNotify && window.OnuNotify.postReact(postId, type); } catch (_) {}\n    d.reactions = Object.assign({}, d.reactions || {});\n    if (type === null) {\n      d.likedBy = (d.likedBy || []).filter(u => u !== uid);\n      delete d.reactions[uid];\n    } else {\n      if (!(d.likedBy || []).includes(uid)) d.likedBy = [...(d.likedBy || []), uid];\n      d.reactions[uid] = { type: type, name: currentUser.displayName || 'ব্যবহারকারী', photo: currentUser.photoURL || '' };\n    }\n  }\n\n  function renderLikeBtn(b, d, animate) {\n    const t = myReactionOf(d);\n    const n = (d.likedBy || []).length;\n    if (t) {\n      const r = REACT_MAP[t];\n      b.className = 'likeBtn liked';\n      b.style.color = '#1877f2';\n      b.style.background = '';\n      b.style.fontWeight = 'bold';\n      const icon = (t === 'like') ? '<svg class=\"lkSvg\" viewBox=\"0 0 24 24\" width=\"1.15em\" height=\"1.15em\" fill=\"currentColor\" aria-hidden=\"true\" style=\"vertical-align:-0.2em\"><path d=\"M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z\"/><\/svg>' : r.e;\n      b.innerHTML = `<span class=\"lkEmoji\">${icon}<\/span> ${r.l} (<span class=\"likeCount\">${n}<\/span>)`;\n    } else {\n      b.className = 'likeBtn';\n      b.style.color = '';\n      b.style.background = '';\n      b.style.fontWeight = '';\n      b.innerHTML = `<span class=\"lkEmoji\"><svg class=\"lkSvg\" viewBox=\"0 0 24 24\" width=\"1.15em\" height=\"1.15em\" fill=\"currentColor\" aria-hidden=\"true\" style=\"vertical-align:-0.2em\"><path d=\"M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z\"/><\/svg><\/span> লাইক (<span class=\"likeCount\">${n}<\/span>)`;\n    }\n    if (animate && t) {\n      const em = b.querySelector('.lkEmoji');\n      if (em) { em.classList.add('lkPop'); setTimeout(() => em.classList.remove('lkPop'), 350); }\n    }\n  }\n\n  // ট্যাপ = লাইক/আনলাইক, লং-প্রেস (≈০.৪ সেকেন্ড) = রিঅ্যাকশন পিকার\n  function attachReactionPress(b, onTap, onLong) {\n    let timer = null, fired = false, sx = 0, sy = 0;\n    const cancel = () => { clearTimeout(timer); timer = null; };\n    b.addEventListener('pointerdown', (e) => {\n      if (e.pointerType === 'mouse' && e.button !== 0) return;\n      fired = false; sx = e.clientX; sy = e.clientY;\n      cancel();\n      timer = setTimeout(() => { timer = null; fired = true; onLong(); }, 420);\n    });\n    b.addEventListener('pointermove', (e) => {\n      if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel();\n    });\n    b.addEventListener('pointerup', cancel);\n    b.addEventListener('pointercancel', cancel);\n    b.addEventListener('pointerleave', cancel);\n    b.addEventListener('contextmenu', (e) => e.preventDefault());\n    b.addEventListener('click', (e) => {\n      if (fired) { fired = false; e.preventDefault(); return; }\n      onTap();\n    });\n  }\n\n  let reactPickerEl = null, reactPickerBackdrop = null, reactPickerOpenedAt = 0;\n  function closeReactionPicker() {\n    if (reactPickerEl) { reactPickerEl.remove(); reactPickerEl = null; }\n    if (reactPickerBackdrop) { reactPickerBackdrop.remove(); reactPickerBackdrop = null; }\n  }\n  function openReactionPicker(anchor, current, onPick) {\n    closeReactionPicker();\n    reactPickerOpenedAt = Date.now();\n    const bd = document.createElement('div');\n    bd.className = 'reactPickerBackdrop';\n    bd.addEventListener('click', () => { if (Date.now() - reactPickerOpenedAt > 250) closeReactionPicker(); });\n    bd.addEventListener('contextmenu', (e) => e.preventDefault());\n    const el = document.createElement('div');\n    el.className = 'reactPicker';\n    REACTIONS.forEach(r => {\n      const bt = document.createElement('button');\n      bt.type = 'button';\n      bt.className = 'reactPickBtn' + (current === r.k ? ' sel' : '');\n      bt.innerHTML = reactIcon(r);\n      bt.title = r.l;\n      bt.addEventListener('click', (ev) => {\n        ev.stopPropagation();\n        if (Date.now() - reactPickerOpenedAt < 250) return;\n        closeReactionPicker();\n        onPick(r.k);\n      });\n      el.appendChild(bt);\n    });\n    document.body.appendChild(bd);\n    document.body.appendChild(el);\n    reactPickerBackdrop = bd; reactPickerEl = el;\n    const rect = anchor.getBoundingClientRect();\n    const w = el.offsetWidth, h = el.offsetHeight;\n    let left = rect.left + rect.width / 2 - w / 2;\n    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));\n    let top = rect.top - h - 10;\n    if (top < 8) top = rect.bottom + 10;\n    el.style.left = left + 'px';\n    el.style.top = top + 'px';\n  }\n\n  // কারা কোন রিঅ্যাকশন দিয়েছে তার তালিকা (বটম শিট)\n  let reactSheetEl = null;\n  function closeReactionList() {\n    if (reactSheetEl) { reactSheetEl.remove(); reactSheetEl = null; }\n  }\n  function openReactionList(d) {\n    closeReactionList();\n    closeReactionPicker();\n    const ids = [...(d.likedBy || [])].reverse();\n    const entries = ids.map(uid => {\n      const r = d.reactions && d.reactions[uid];\n      return { uid: uid, type: reactionTypeOf(d, uid), name: (r && r.name) || '', photo: (r && r.photo) || '' };\n    });\n    const ov = document.createElement('div');\n    ov.className = 'reactSheetOverlay';\n    const sheet = document.createElement('div');\n    sheet.className = 'reactSheet';\n    const head = document.createElement('div');\n    head.className = 'reactSheetHead';\n    const title = document.createElement('div');\n    title.className = 'reactSheetTitle';\n    title.textContent = 'প্রতিক্রিয়া';\n    const cl = document.createElement('button');\n    cl.className = 'reactSheetClose';\n    cl.textContent = '✕';\n    cl.addEventListener('click', closeReactionList);\n    head.appendChild(title); head.appendChild(cl);\n    const tabs = document.createElement('div');\n    tabs.className = 'reactTabs';\n    const list = document.createElement('div');\n    list.className = 'reactList';\n    sheet.appendChild(head); sheet.appendChild(tabs); sheet.appendChild(list);\n    ov.appendChild(sheet);\n    ov.addEventListener('click', (e) => { if (e.target === ov) closeReactionList(); });\n    document.body.appendChild(ov);\n    reactSheetEl = ov;\n\n    let activeTab = 'all';\n    function renderList() {\n      tabs.innerHTML = '';\n      const counts = {};\n      entries.forEach(en => { counts[en.type] = (counts[en.type] || 0) + 1; });\n      const mkTab = (key, label) => {\n        const t = document.createElement('button');\n        t.className = 'reactTab' + (activeTab === key ? ' active' : '');\n        t.innerHTML = label;\n        t.addEventListener('click', () => { activeTab = key; renderList(); });\n        tabs.appendChild(t);\n      };\n      mkTab('all', 'সব ' + entries.length);\n      REACTIONS.forEach(r => { if (counts[r.k]) mkTab(r.k, reactIcon(r) + ' ' + counts[r.k]); });\n      list.innerHTML = '';\n      const shown = entries.filter(en => activeTab === 'all' || en.type === activeTab);\n      if (!shown.length) {\n        const em = document.createElement('div');\n        em.className = 'reactEmpty';\n        em.textContent = 'এখনো কেউ রিঅ্যাক্ট করেনি।';\n        list.appendChild(em);\n        return;\n      }\n      shown.forEach(en => {\n        const row = document.createElement('a');\n        row.className = 'reactRow';\n        row.href = 'profile.html?uid=' + encodeURIComponent(en.uid);\n        const av = document.createElement('div');\n        av.className = 'rrAvatar';\n        if (en.photo) {\n          const im = document.createElement('img');\n          im.src = en.photo; im.loading = 'lazy';\n          im.addEventListener('error', () => { im.remove(); av.textContent = (en.name || '?').charAt(0); });\n          av.appendChild(im);\n        } else {\n          av.textContent = (en.name || '?').charAt(0);\n        }\n        const nm = document.createElement('div');\n        nm.className = 'rrName';\n        nm.textContent = en.name || 'ব্যবহারকারী';\n        const em = document.createElement('div');\n        em.className = 'rrEmoji';\n        em.innerHTML = reactIcon(REACT_MAP[en.type]);\n        row.appendChild(av); row.appendChild(nm); row.appendChild(em);\n        list.appendChild(row);\n      });\n    }\n    renderList();\n\n    // পুরনো লাইক (নাম/ছবি সংরক্ষিত নেই) — publicProfiles থেকে পূরণ করার চেষ্টা\n    const missing = entries.filter(en => !en.name);\n    if (missing.length) {\n      Promise.all(missing.map(async (en) => {\n        try {\n          const s = await getDoc(doc(db, \"publicProfiles\", en.uid));\n          if (s.exists()) { const p = s.data(); en.name = p.name || ''; en.photo = p.photoURL || ''; }\n        } catch (e) {}\n      })).then(() => { if (reactSheetEl === ov) renderList(); });\n    }\n  }\n  function isReactionUiOpen() { return !!(reactPickerEl || reactSheetEl); }\n  function closeReactionUi() { closeReactionPicker(); closeReactionList(); }\n\n  // স্ক্রল করলে বা Esc চাপলে ভেসে থাকা পিকার বন্ধ হয়ে যাবে (পিকার বাটনের অবস্থানে আটকানো থাকে)\n  window.addEventListener('scroll', () => { if (reactPickerEl) closeReactionPicker(); }, { passive: true });\n  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isReactionUiOpen()) closeReactionUi(); });\n\n  function buildPostCard(postId, d) {\n    const isOwner = currentUser && d.authorUid === currentUser.uid;\n    const liked = currentUser && (d.likedBy || []).includes(currentUser.uid);\n    const postUrl = __loc.href.split('#')[0].replace('profile.html', 'index.html') + '#post-' + postId;\n\n    const card = document.createElement('div');\n    card.className = 'postCard';\n    card.id = 'post-' + postId;\n\n    let mediaHtml = '';\n    if (d.type === 'poster') {\n      mediaHtml = `<div class=\"postPoster\" style=\"background:${d.posterColor || '#4285F4'}\">${escapeHtml(d.text)}<\/div>`;\n    }\n    mediaHtml += postMediaHtml(d);\n    const postTextHtml = d.type === 'blog' ? renderBlogText(d.text) : escapeHtml(d.text);\n\n    card.innerHTML = `\n      <div class=\"postHeader\">\n        <a class=\"postAuthorLink\"${d.authorUid ? ' href=\"profile.html?uid=' + encodeURIComponent(d.authorUid) + '\"' : ''}>\n          <img class=\"avatar\" src=\"${d.authorPhoto || ''}\" loading=\"lazy\" decoding=\"async\">\n        <\/a>\n        <div>\n          <a class=\"postAuthorLink pName\"${d.authorUid ? ' href=\"profile.html?uid=' + encodeURIComponent(d.authorUid) + '\"' : ''}>${escapeHtml(d.authorName)}<\/a>\n          <div class=\"p \n      if (!nowSubscribed) { try { window.OnuNotify && window.OnuNotify.subscribed(currentTargetUid); } catch (_) {} }\n      if (currentProfileData) {\n        const subs = currentProfileData.subscribers || [];\n        currentProfileData.subscribers = nowSubscribed\n          ? subs.filter(u => u !== currentUser.uid)\n          : [...subs, currentUser.uid];\n        statSubscribers.textContent = formatCount(currentProfileData.subscribers.length);\n      }\n      updateSubscribeBtnUI();\n      await loadUserPosts(currentTargetUid, currentIsOwnProfile || currentIsSubscribed);\n    } catch (e) { alert('এরর: ' + e.message); }\n    subscribeBtn.disabled = false;\n  });\n\n  // প্রোফাইল লোড করার কাজ — লগইন করা ব্যবহারকারী (user) বা অতিথি (user = null) দুজনের জন্যই।\n  // প্রতিটা ধাপ আলাদাভাবে সুরক্ষিত: একটা ধাপ ব্যর্থ হলেও প্রোফাইল খোলা আটকাবে না।\n  async function openProfileFor(user) {\n    const targetUid = viewUid || (user ? user.uid : null);\n    if (!targetUid) return;\n    const isOwn = !!user && targetUid === user.uid;\n    // অন্য একাউন্ট থেকে Back করে ফিরলে সাবস্ক্রাইবার তালিকা আবার খোলার চিহ্ন (একবারই কাজ করে)\n    let restoreSubs = false;\n    try {\n      if (isOwn && history.state && history.state.profileTab === 'subs') {\n        restoreSubs = true;\n        const st = { ...history.state }; delete st.profileTab;\n        history.replaceState(st, '');\n      }\n    } catch (e) {}\n    currentTargetUid = targetUid;\n    currentIsOwnProfile = isOwn;\n    document.body.classList.toggle('ownProfile', isOwn);\n    try { watchStatus(targetUid); } catch (e) { console.error('watchStatus এরর:', e); }\n\n    let profileData = null;\n    if (isOwn) {\n      profileData = myProfile;\n    } else {\n      try {\n        const snap = await getDoc(doc(db, \"publicProfiles\", targetUid));\n        profileData = snap.exists() ? snap.data() : null;\n      } catch (e) {\n        console.error('পাবলিক প্রোফাইল পড়তে এরর:', e);\n      }\n    }\n\n    if (!profileData) {\n      try {\n        const fq = query(collection(db, \"posts\"), where(\"authorUid\", \"==\", targetUid), limit(1));\n        const fsnap = await getDocs(fq);\n        if (!fsnap.empty) {\n          const first = fsnap.docs[0].data();\n          profileData = { name: first.authorName, photoURL: first.authorPhoto, coverColor: '#4285F4', bio: '' };\n        }\n      } catch (e) { console.error('পোস্ট থেকে প্রোফাইল তথ্য আনতে এরর:', e); }\n      if (!profileData) profileData = { name: 'ব্যবহারকারী', photoURL: '', coverColor: '#4285F4', bio: '' };\n    }\n    profileData.subscribers = profileData.subscribers || [];\n    currentProfileData = profileData;\n    currentIsSubscribed = isOwn ? true : (!!user && profileData.subscribers.includes(user.uid));\n\n    renderProfile(profileData, isOwn);\n    hideAuthLoading();\n    if (restoreSubs) setOwnTab('subs');\n\n    await loadUserPosts(targetUid, isOwn || currentIsSubscribed);\n  }\n\n  // ================= ক্যাটাগরি ফিল্টার + সার্চ =================\n  const searchBar = document.getElementById('searchBar');\n  const filterTabs = document.getElementById('filterTabs');\n  let activeFilter = 'all';\n  // ফিল্টার: সবগুলো | পোস্ট (টেক্সট|পোস্টার|ব্লগ) | ফটো | অডিও (রেকর্ড|মিউজিক)\n  const KIND_GROUP = { text: 'post', poster: 'post', blog: 'post', photo: 'photo', record: 'audio', music: 'audio' };\n  const SUB_DEFS = {\n    post:  [['text', 'টেক্সট'], ['poster', 'পোস্টার'], ['blog', 'ব্লগ']],\n    audio: [['music', 'মিউজিক'], ['record', 'রেকর্ড']]\n  };\n  const subFilter = { post: 'text', audio: 'music' };\n  function postKind(d) {\n    if (d.type === 'photo') return 'photo';\n    if (d.type === 'voice') return 'record';     // সরাসরি রেকর্ড করা ভয়েস\n    if (d.type === 'audio') return 'music';      // ফোন থেকে আপলোড করা অডিও\n    if (d.type === 'poster') return 'poster';\n    if (d.type === 'blog') return 'blog';\n    return 'text';\n  }\n  function kindMatches(k) {\n    if (activeFilter === 'all') return true;\n    if (KIND_GROUP[k] !== activeFilter) return false;\n    return !SUB_DEFS[activeFilter] || k === subFilter[activeFilter];\n  }\n  const subTabsEl = document.getElementById('subTabs');\n  const subBtnsEl = document.getElementById('subBtns');\n  function buildSubTabs() {\n    const defs = SUB_DEFS[activeFilter];\n    if (!defs) { subTabsEl.style.display = 'none'; subBtnsEl.innerHTML = ''; return; }\n    subTabsEl.style.display = 'flex';\n    subBtnsEl.innerHTML = '';\n    defs.forEach(([k, label]) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.textContent = label;\n      b.dataset.sub = k;\n      if (subFilter[activeFilter] === k) b.classList.add('active');\n      b.addEventListener('click', () => {\n        subFilter[activeFilter] = k;\n        subBtnsEl.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));\n        renderMyPosts();\n      });\n      subBtnsEl.appendChild(b);\n    });\n  }\n  function setFilter(f) {\n    const wasAll = activeFilter === 'all';\n    activeFilter = f;\n    document.querySelectorAll('#filterTabs button').forEach(b => b.classList.toggle('active', b.getAttribute('data-filter') === f));\n    buildSubTabs();\n    if (wasAll && f !== 'all' && backGuardActive) rearmGuard();     // ফোনের ব্যাক চাপলে \"সবগুলো\"-তে ফিরবে\n    renderMyPosts();\n  }\n  document.getElementById('subBackBtn').addEventListener('click', () => setFilter('all'));\n\n\n  function renderMyPosts() {\n    myPostsList.innerHTML = '';\n    emptyPosts.style.display = 'none';\n    if (!myPosts.length) { emptyPosts.style.display = 'block'; return; }\n    const term = searchBar.value.trim().toLowerCase();\n    const shown = myPosts\n      .filter(p => kindMatches(postKind(p.data)))\n      .filter(p => !term || (p.data.text || '').toLowerCase().includes(term));\n    shown.forEach((p, i) => {\n      myPostsList.appendChild(buildPostCard(p.id, p.data));\n      if ((i + 1) % AD_EVERY_N_POSTS === 0) myPostsList.appendChild(buildFeedAd(Math.floor(i / AD_EVERY_N_POSTS)));\n    });\n    if (!shown.length) {\n      const m = document.createElement('div');\n      m.id = 'emptyFilterMsg';\n      m.textContent = term ? 'কোনো পোস্ট পাওয়া যায়নি।' : 'এই ক্যাটাগরিতে কোনো পোস্ট নেই।';\n      myPostsList.appendChild(m);\n    }\n  }\n  filterTabs.querySelectorAll('button').forEach(btn => {\n    btn.addEventListener('click', () => setFilter(btn.getAttribute('data-filter')));\n  });\n  searchBar.addEventListener('input', renderMyPosts);\n  searchBar.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchBar.blur(); });\n\n  function openSearch() {\n    if (document.body.classList.contains('searchOpen')) return;\n    document.body.classList.add('searchOpen');\n    if (backGuardActive) rearmGuard();\n    window.scrollTo(0, 0);\n    searchBar.focus();\n  }\n  function closeSearch() {\n    if (!document.body.classList.contains('searchOpen')) return;\n    document.body.classList.remove('searchOpen');\n    searchBar.blur();\n    if (searchBar.value) { searchBar.value = ''; renderMyPosts(); }\n  }\n  document.getElementById('headerSearchBtn').addEventListener('click', openSearch);\n  document.getElementById('searchBackBtn').addEventListener('click', () => {\n    if (backGuardActive) window.history.back(); else closeSearch();\n  });\n\n  // ================= নতুন পোস্ট (ইনডেক্সের পোস্ট-বক্সের মতোই) =================\n  const composerModalOverlay = document.getElementById('composerModalOverlay');\n  const composerModalCloseBtn = document.getElementById('composerModalCloseBtn');\n  const composerText = document.getElementById('composerText');\n  const blogSyntaxHint = document.getElementById('blogSyntaxHint');\n  const posterColorsEl = document.getElementById('posterColors');\n  const posterPreview = document.getElementById('posterPreview');\n  const submitPostBtn = document.getElementById('submitPostBtn');\n  const composerStatus = document.getElementById('composerStatus');\n  const postToast = document.getE  '';\n  }\n  function updateBlogSyntaxHint() {\n    const b = blogSymbols.big, m = blogSymbols.med, sm = blogSymbols.small, lk = blogSymbols.link;\n    blogSyntaxHint.innerHTML =\n      'বড় লেখার জন্য ' + escapeHtml(b[0]) + 'এভাবে লিখুন' + escapeHtml(b[1]) +\n      ' · মাঝারির জন্য ' + escapeHtml(m[0]) + 'এভাবে লিখুন' + escapeHtml(m[1]) +\n      ' · স্বাভাবিকের জন্য ' + escapeHtml(sm[0]) + 'এভাবে লিখুন' + escapeHtml(sm[1]) + '<br>' +\n      'অন্য পোস্টের লিংক যুক্ত করতে ' + escapeHtml(lk[0]) + 'লিংক' + escapeHtml(lk[1]) + ' এভাবে বসান';\n  }\n  updateBlogSyntaxHint();\n\n  function buildPosterSwatches(colors) {\n    posterColorsEl.innerHTML = '';\n    const list = (colors && colors.length) ? colors : DEFAULT_POSTER_COLORS;\n    list.forEach((color, i) => {\n      const sw = document.createElement('div');\n      sw.className = 'posterSwatch' + (i === 0 ? ' selected' : '');\n      sw.style.background = color;\n      sw.dataset.color = color;\n      sw.addEventListener('click', () => {\n        selectedPosterColor = color;\n        posterColorsEl.querySelectorAll('.posterSwatch').forEach(x => x.classList.remove('selected'));\n        sw.classList.add('selected');\n        updatePosterPreview();\n      });\n      posterColorsEl.appendChild(sw);\n    });\n    selectedPosterColor = list[0];\n  }\n  buildPosterSwatches(DEFAULT_POSTER_COLORS);\n\n  document.querySelectorAll('#composerTabs button[data-mode]').forEach(btn => {\n    btn.addEventListener('click', () => {\n      composerMode = btn.getAttribute('data-mode');\n      document.querySelectorAll('#composerTabs button[data-mode]').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n      posterColorsEl.style.display = composerMode === 'poster' ? 'flex' : 'none';\n      posterPreview.style.display = composerMode === 'poster' ? 'flex' : 'none';\n      blogSyntaxHint.style.display = composerMode === 'blog' ? 'block' : 'none';\n      applyComposerHeightForMode();\n      if (composerMode === 'p om:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer;line-height:1;padding:0}\n.mcap{margin-top:6px;white-space:pre-wrap;word-break:break-word}\n.hasImg .mcap{padding:0 8px 6px}\n#imgViewer{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center}\n#imgViewer.open{display:flex}\n#imgViewer img{max-width:100%;max-height:100%;object-fit:contain}\n#ivClose,#ivDl{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer}\n#ivClose{right:12px}\n#ivDl{right:64px}\n#voiceBtn,.barBtn{background:var(--surface);color:var(--text-color);border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}\n#voiceBtn svg,.barBtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n#voiceRec{display:none;flex:1;align-items:center;gap:12px;min-height:40px}\n#messageBar.recording #voiceRec{display:flex}\n#messageBar.recording #messageInput,#messageBar.recording #sendBtn,#messageBar.recording #voiceBtn{display:none}\n.recDot{width:10px;height:10px;border-radius:50%;background:var(--text-color);animation:recBlink 1s infinite;flex-shrink:0}\n@keyframes recBlink{50%{opacity:.25}}\n#recTime{flex:1;font-size:14px;color:var(--text-color)}\n#recCancel,#recSend{background:var(--surface);color:var(--text-color);border:none;width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0}\n.vp{display:flex;align-items:center;gap:6px;width:164px}\n.vpBtn{width:32px;height:32px;border-radius:50%;border:none;background:#22c55e;cursor:pointer;flex-shrink:0;padding:0;display:flex;align-items:center;justify-content:center}\n.msgRow.mine .vp{flex-direction:row-reverse}\n.vpBtn{color:#fff}\n.msgBubble.hasVp{padding:7px 10px}\n.msgMeta.noTime{display:none}\n.msgRow:has(.msgReactions){margin-bottom:10px}\n.msgRow.mine .vpBtn{background:#fff;color:#16a34a}\n.vpBar{flex:1;min-width:0;accent-color:currentColor;height:4px}\n.vpTime{font-size:11px;min-width:28px;text-align:right}\n#ctxBackdrop{position:fixed;inset:0;z-index:900;display:none;background:rgba(0,0,0,.62);align-items:flex-end;justify-content:center}\n#ctxMenu{position:relative;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 0 calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.55);animation:ctxSlideUp .18s ease-out}\n#ctxMenu::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}\n@keyframes ctxSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}\n#ctxMenu .ctxReactions{display:flex;justify-content:space-around;align-items:center;padding:10px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:4px}\n#ctxMenu .ctxReactions button{background:none;border:none;font-size:34px;cursor:pointer;padding:6px;line-height:1;border-radius:50%}\n#ctxMenu .ctxReactions button:active{background:var(--surface-active);transform:scale(1.15)}\n#ctxMenu .ctxItem{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;color:var(--text-color);text-align:left;padding:17px 22px;font-size:18px;font-family:inherit;cursor:pointer;border-top:1px solid var(--line)}\n#ctxMenu .ctxItem:first-child,#ctxMenu .ctxReactions + .ctxItem{border-top:none}\n#ctxMenu .ctxItem:active{background:var(--surface-active)}\n#ctxMenu .ctxItem.danger{color:var(--text-color)}\n\n#callScreen,#incomingCall{color:#ffffff}.ctlBtn{background:rgba(255,255,255,0.2)}.ctlBtn.off,.ctlBtn.on{background:#ffffff;color:#000000}.ctlBtn.end{background:#000000;border:2px solid #ffffff}.ctlBtn.accept{background:#ffffff;color:#000000}\n\n/* ---------- ধূসর মেসেজ বক্স + স্টিকার ---------- */\n:root{--gray-box:#4a4a4a}\nhtml[data-theme=\"light\"]{--gray-box:#d0d0d0}\n#textBtn{background:var(--gray-box)}\n#messageBar #messageInput{background:var(--gray-box)}\n#messageBar{padding:10px 8px}\n#mediaRow{gap:6px}\n#mediaRow #voiceBtn,#mediaRow #audioFileBtn,#mediaRow #photoBtn{width:36px;height:36px}\n#textBtn{padding:0 10px}\n#mediaRow #stickerBtn{width:34px;height:34px;border-radius:50%;background:var(--gray-box)}\n#stickerPanel{display:none;flex-shrink:0;border-top:1px solid var(--line);background:var(--card-color);padding:10px;max-height:42vh;overflow-y:auto;gap:8px;flex-wrap:wrap}\n#stickerPanel.open{display:flex}\n.stkItem{background:none;color:var(--text-color);border:none;border-radius:18px;padding:8px 12px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}\n.stkE{font-size:38px;line-height:1.1}\n.stkT{font-size:13px;font-weight:bold;line-height:1.2}\n.stkItem:active{background:var(--surface-active)}\n.msgBubble.stickerMsg{background:none!important;border:none!important;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px;border-radius:24px;white-space:normal}\n.msgBubble.stickerMsg .stkE{font-size:56px;line-height:1.1}\n.msgBubble.stickerMsg .stkT{font-size:14px}\n\n/* ---------- লাইক বাটনে লং-প্রেসে ৬টা রিয়াকশন ---------- */\n#sendBtn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\n#reactPop{display:none;position:fixed;z-index:1200;background:var(--card-color);border:1px solid var(--line);border-radius:32px;padding:6px 10px;gap:4px;box-shadow:0 4px 18px rgba(0,0,0,.5)}\n#reactPop.open{display:flex}\n#reactPop button{background:none;border:none;font-size:34px;line-height:1;padding:4px 6px;cursor:pointer;border-radius:50%}\n#reactPop button:active{background:var(--surface-active)}\n\n/* ---------- পুল-টু-রিফ্রেশ (উপর থেকে নিচে টা
