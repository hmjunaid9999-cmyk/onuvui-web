<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onuvuti App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary-color: #4285F4;
    --bg-color: #0d1117;
    --card-color: #161b22;
    --text-color: #ffffff;
    --max-width: 640px;
    --composer-height: 100px;
    --poster-height: 180px;
    --post-buttons-justify: space-evenly;
  }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); min-height: 100vh; }

  #loginScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  #loginScreen img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; }
  #loginScreen h1 { font-size: 22px; margin-bottom: 6px; }
  #loginScreen p { color: #9ca3af; font-size: 14px; margin-bottom: 28px; }
  #googleLoginBtn {
    display: flex; align-items: center; gap: 10px;
    background: var(--primary-color); color: #fff; border: none;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  #googleLoginBtn:disabled { opacity: 0.6; }
  #loginStatus { margin-top: 16px; font-size: 13px; color: #f87171; min-height: 18px; }

  #appScreen { display: none; }

  #siteHeader {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; background: var(--card-color); border-bottom: 1px solid #262c36;
  }
  #siteHeader img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  #siteHeader h1 { font-size: 19px; font-weight: bold; }
  #sidebarToggleBtn {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 8px;
  }
  #logoutBtn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: #262c36; color: #f87171; border: none; padding: 6px 14px; border-radius: 14px; font-size: 12px; cursor: pointer;
  }

  #noticeBar {
    background: #1c2128; overflow: hidden; white-space: nowrap; padding: 8px 0;
    border-bottom: 1px solid #262c36;
  }
  #noticeBar span {
    display: inline-block; padding-left: 100%;
    animation: scrollNotice 18s linear infinite;
    font-size: 13px; color: #facc15;
  }
  @keyframes scrollNotice { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

  #menuGrid {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
    background: var(--card-color); border-bottom: 1px solid #262c36;
  }
  #menuGrid a { background: var(--primary-color); color: #fff; text-decoration: none; font-size: 12px; padding: 7px 12px; border-radius: 14px; }

  main { padding: 16px; max-width: var(--max-width); margin: 0 auto; }

  /* ---- পোস্ট কম্পোজার ---- */
  #composer { background: var(--card-color); border: 1px solid #262c36; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  #composerTabs { display: flex; gap: 6px; margin-bottom: 10px; }
  #composerTabs button {
    background: #21262d; color: #9ca3af; border: none; padding: 6px 12px; border-radius: 12px; font-size: 12px; cursor: pointer;
  }
  #composerTabs button.active { background: var(--primary-color); color: #fff; }
  #composerText {
    width: 100%; background: #0d1117; border: 1px solid #30363d; color: #fff;
    padding: 10px; border-radius: 10px; font-size: 14px; min-height: var(--composer-height); resize: vertical; font-family: inherit;
  }
  #posterColors { display: none; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .posterSwatch { width: 32px; height: 32px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .posterSwatch.selected { border-color: #fff; }
  #posterPreview {
    display: none; margin-top: 10px; border-radius: 12px; padding: 50px 16px;
    text-align: center; font-size: 18px; font-weight: bold; color: #fff; min-height: var(--poster-height);
    align-items: center; justify-content: center;
  }
  #submitPostBtn {
    margin-top: 10px; width: 100%; background: var(--primary-color); color: #fff; border: none;
    padding: 10px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  #submitPostBtn:disabled { opacity: 0.6; }

  /* ---- সার্চ বার ---- */
  #searchBar {
    width: 100%; background: var(--card-color); border: 1px solid #262c36; color: #fff;
    padding: 10px 14px; border-radius: 20px; font-size: 14px; margin-bottom: 16px;
  }

  /* ---- পোস্ট ফিড ---- */
  .postCard { background: var(--card-color); border: 1px solid #262c36; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .postHeader { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; position: relative; }
  .postHeader img.avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; }
  .postHeader .pName { font-size: 13px; font-weight: bold; }
  .postHeader .pTime { font-size: 11px; color: #6b7280; }
  .postMenuWrap { margin-left: auto; position: relative; }
  .postMenuBtn { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .postMenuDropdown {
    display: none; position: absolute; right: 0; top: 30px; background: #21262d; border: 1px solid #30363d;
    border-radius: 10px; min-width: 140px; z-index: 10; overflow: hidden;
  }
  .postMenuDropdown.open { display: block; }
  .postMenuDropdown button {
    display: block; width: 100%; text-align: left; background: none; border: none; color: #fff;
    padding: 10px 12px; font-size: 12px; cursor: pointer;
  }
  .postMenuDropdown button:hover { background: #30363d; }
  .postText { font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 8px; }
  .postPhoto { max-width: 100%; border-radius: 10px; margin-bottom: 8px; }
  .postPoster {
    border-radius: 10px; padding: 50px 16px; text-align: center; font-size: 17px;
    font-weight: bold; color: #fff; margin-bottom: 8px; min-height: var(--poster-height);
    display: flex; align-items: center; justify-content: center; white-space: pre-wrap;
  }
  .postButtons { display: flex; justify-content: var(--post-buttons-justify); gap: 6px; border-top: 1px solid #262c36; padding-top: 8px; }
  .postButtons button {
    background: #21262d; color: #c9d1d9; border: none; padding: 6px 10px; border-radius: 10px; font-size: 11px; cursor: pointer;
  }
  .postButtons button.liked { color: #f87171; }
  .postStatus { font-size: 11px; color: #4ade80; margin-top: 6px; min-height: 14px; }

  /* ---- কমেন্ট সেকশন ---- */
  .commentsWrap { display: none; margin-top: 10px; border-top: 1px solid #262c36; padding-top: 10px; }
  .commentForm { display: flex; gap: 8px; margin-bottom: 10px; }
  .commentForm textarea {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px 10px;
    border-radius: 10px; font-size: 13px; resize: vertical; min-height: 36px; font-family: inherit;
  }
  .commentForm button { background: var(--primary-color); color: #fff; border: none; padding: 0 14px; border-radius: 10px; font-size: 12px; }
  .commentRow { margin-bottom: 10px; }
  .commentMain { display: flex; gap: 8px; }
  .commentMain img { width: 28px; height: 28px; border-radius: 50%; background: #333; flex-shrink: 0; }
  .commentBody { background: #0d1117; border-radius: 12px; padding: 8px 10px; }
  .commentBody .cName { font-size: 12px; font-weight: bold; }
  .commentBody .cText { font-size: 13px; color: #ddd; white-space: pre-wrap; }
  .commentMeta { font-size: 10px; color: #6b7280; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
  .commentMeta button { background: none; border: none; color: #4285F4; cursor: pointer; font-size: 10px; padding: 0; }
  /* ---- রিপ্লাই বক্স: কমেন্টের অ্যাভাটারের ঠিক নিচেই শুরু হবে (একদম বরাবর), ডান দিকে সরবে না ---- */
  .replyBox { margin-top: 8px; background: #12161d; border: 1px solid #262c36; border-radius: 10px; padding: 8px 6px 8px 0; }
  .replyBox .commentRow { margin-bottom: 8px; }
  .replyBox .commentRow:last-child { margin-bottom: 0; }
  .replyForm { display: flex; gap: 6px; margin-top: 8px; }
  .replyForm textarea {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 6px 8px;
    border-radius: 8px; font-size: 12px; resize: vertical; min-height: 32px; font-family: inherit;
  }
  .replyForm button { background: var(--primary-color); color: #fff; border: none; border-radius: 8px; padding: 0 10px; font-size: 11px; }

  #loadMoreBtn {
    display: block; width: 100%; background: var(--card-color); color: #fff; border: 1px solid #262c36;
    padding: 10px; border-radius: 12px; font-size: 13px; margin-top: 10px; cursor: pointer;
  }
  #loadMoreBtn:disabled { opacity: 0.5; }

  #footerSection { padding: 12px 16px; margin-top: 8px; border-top: 1px solid #262c36; text-align: center; }
  #footerSiteName { font-size: 16px; font-weight: bold; margin-bottom: 12px; opacity: 0.9; }
  #footerGrid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #footerGrid a { background: #262c36; color: #fff; text-decoration: none; font-size: 12px; padding: 7px 12px; border-radius: 14px; }

  #exitToast {
    display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #21262d; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 300;
  }

  #sidebarOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; }
  #sidebarOverlay.open { display: block; }
  #sidebarDrawer {
    position: fixed; top: 0; left: -260px; width: 260px; height: 100%;
    background: var(--card-color); z-index: 101; transition: left 0.25s ease; padding: 18px 14px; overflow-y: auto;
  }
  #sidebarDrawer.open { left: 0; }
  #sidebarDrawer .drawerHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #sidebarCloseBtn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  #sidebarGrid { display: flex; flex-direction: column; gap: 8px; }
  #sidebarGrid a { display: block; background: #0d1117; color: #fff; text-decoration: none; font-size: 13px; padding: 10px 12px; border-radius: 10px; border: 1px solid #262c36; }
</style>
</head>
<body>

  <div id="loginScreen">
    <img src="https://hmjunaid9999-cmyk.github.io/Onuvuti/icon-192.png" alt="Onuvuti">
    <h1>Onuvuti App</h1>
    <p>চালিয়ে যেতে Google দিয়ে লগইন করুন</p>
    <button id="googleLoginBtn">🔵 Google দিয়ে লগইন করুন</button>
    <div id="loginStatus"></div>
  </div>

  <div id="appScreen">

    <div id="sidebarOverlay"></div>
    <div id="sidebarDrawer">
      <div class="drawerHeader"><strong>মেনু</strong><button id="sidebarCloseBtn">✕</button></div>
      <div id="sidebarGrid"></div>
    </div>

    <div id="siteHeader">
      <button id="sidebarToggleBtn">☰</button>
      <img id="siteLogo" src="" alt="">
      <h1 id="siteName">Onuvuti</h1>
      <button id="logoutBtn">লগ আউট</button>
    </div>

    <div id="noticeBar"><span id="noticeText"></span></div>
    <div id="menuGrid"></div>

    <main>
      <!-- ---- পোস্ট কম্পোজার ---- -->
      <div id="composer">
        <div id="composerTabs">
          <button class="active" data-mode="text">📝 টেক্সট</button>
          <button data-mode="poster">🎨 পোস্টার</button>
        </div>
        <textarea id="composerText" placeholder="আপনার মনে কী চলছে?"></textarea>

        <div id="posterColors"></div>
        <div id="posterPreview"></div>

        <button id="submitPostBtn">পোস্ট করুন</button>
        <div class="postStatus" id="composerStatus"></div>
      </div>

      <!-- ---- সার্চ ---- -->
      <input type="text" id="searchBar" placeholder="🔍 পোস্ট খুঁজুন...">

      <!-- ---- পোস্ট ফিড ---- -->
      <div id="postsList"></div>
      <button id="loadMoreBtn" style="display:none;">আরও পোস্ট দেখুন</button>
    </main>

    <div id="footerSection">
      <div id="footerSiteName"></div>
      <div id="footerGrid"></div>
    </div>
  </div>

  <div id="exitToast">আবার Back চাপুন বের হওয়ার জন্য</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
  import {
    getFirestore, doc, onSnapshot, collection, addDoc, updateDoc, deleteDoc,
    query, orderBy, limit, startAfter, getDocs, getDoc, setDoc,
    serverTimestamp, arrayUnion, arrayRemove
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:d87ae40431210088df8b25",
    measurementId: "G-WJ8N8XLPSZ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let postsPerPage = 5;
  let lastVisibleDoc = null;
  let allLoadedPosts = [];
  let composerMode = 'text';
  let selectedPosterColor = '#4285F4';
  let posterPlaceholderText = 'পোস্টারের লেখা এখানে দেখাবে';
  let buttonOrder = { bottom: ['like', 'comment', 'copyText'], menu: ['copyLink', 'share', 'edit', 'delete'] };
  const DEFAULT_POSTER_COLORS = ['#4285F4', '#EA4335', '#34A853', '#FBBC05', '#8B5CF6', '#EC4899', '#111827'];
  let openCommentSections = [];
  let openReplyBoxes = [];

  // ---- কমেন্ট বক্স খোলা থাকলে বাকি পোস্ট ও "আরও দেখুন" বাটন লুকানো (ফোকাস মোড) ----
  let loadMoreBtnPrevDisplay = '';
  let focusedCard = null;
  function enterCommentFocus(activeCard) {
    focusedCard = activeCard;
    postsList.querySelectorAll('.postCard').forEach(c => {
      if (c !== activeCard) c.style.display = 'none';
    });
    loadMoreBtnPrevDisplay = loadMoreBtn.style.display;
    loadMoreBtn.style.display = 'none';
  }
  function exitCommentFocus() {
    postsList.querySelectorAll('.postCard').forEach(c => { c.style.display = ''; });
    loadMoreBtn.style.display = loadMoreBtnPrevDisplay;
    // ---- অন্যান্য পোস্ট আবার দেখানোর ফলে লেআউট বদলে যায়, তাই যে পোস্টটা পড়ছিল সেটাই আবার সামনে আনা হচ্ছে
    //      (আগে এখানে স্ক্রল পজিশন ধরে রাখা হতো না, ফলে একদম টপে/এলোমেলো জায়গায় চলে যেত) ----
    if (focusedCard) {
      focusedCard.scrollIntoView({ block: 'start' });
      focusedCard = null;
    }
  }



  // ---- এলিমেন্ট রেফারেন্স ----
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginBtn = document.getElementById('googleLoginBtn');
  const loginStatus = document.getElementById('loginStatus');
  const logoutBtn = document.getElementById('logoutBtn');
  const siteLogo = document.getElementById('siteLogo');
  const siteName = document.getElementById('siteName');
  const noticeText = document.getElementById('noticeText');
  const menuGrid = document.getElementById('menuGrid');
  const footerGrid = document.getElementById('footerGrid');
  const footerSiteName = document.getElementById('footerSiteName');
  const sidebarGrid = document.getElementById('sidebarGrid');
  const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
  const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
  const sidebarDrawer = document.getElementById('sidebarDrawer');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  const composerText = document.getElementById('composerText');
  const posterColorsEl = document.getElementById('posterColors');
  const posterPreview = document.getElementById('posterPreview');
  const submitPostBtn = document.getElementById('submitPostBtn');
  const composerStatus = document.getElementById('composerStatus');
  const searchBar = document.getElementById('searchBar');
  const postsList = document.getElementById('postsList');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  // ---- লগইন/লগআউট ----
  loginBtn.addEventListener('click', async () => {
    loginBtn.disabled = true;
    loginStatus.textContent = 'লগইন হচ্ছে...';
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      console.error(e);
      loginStatus.textContent = 'এরর: ' + (e && e.message ? e.message : String(e));
      loginBtn.disabled = false;
    }
  });
  logoutBtn.addEventListener('click', async () => { await signOut(auth); });

  // ---- সাইডবার ----
  function openSidebar() { sidebarDrawer.classList.add('open'); sidebarOverlay.classList.add('open'); }
  function closeSidebar() { sidebarDrawer.classList.remove('open'); sidebarOverlay.classList.remove('open'); }
  sidebarToggleBtn.addEventListener('click', openSidebar);
  sidebarCloseBtn.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  // ---- থিম সেটিংস প্রয়োগ ----
  function renderLinkButtons(container, items) {
    container.innerHTML = '';
    (items || []).forEach(item => {
      if (!item || !item.label) return;
      const a = document.createElement('a');
      a.textContent = item.label;
      a.href = item.url || '#';
      container.appendChild(a);
    });
  }

  function applySettings(s) {
    if (!s) return;
    const root = document.documentElement.style;
    if (s.primaryColor) root.setProperty('--primary-color', s.primaryColor);
    if (s.bgColor) root.setProperty('--bg-color', s.bgColor);
    if (s.cardColor) root.setProperty('--card-color', s.cardColor);
    if (s.textColor) root.setProperty('--text-color', s.textColor);
    if (s.maxWidth) root.setProperty('--max-width', s.maxWidth + 'px');
    if (s.composerHeight) root.setProperty('--composer-height', s.composerHeight + 'px');
    if (s.posterHeight) root.setProperty('--poster-height', s.posterHeight + 'px');
    if (s.postButtonsJustify) root.setProperty('--post-buttons-justify', s.postButtonsJustify);

    if (s.bottomButtons && s.bottomButtons.length) buttonOrder.bottom = s.bottomButtons;
    if (s.menuButtons && s.menuButtons.length) buttonOrder.menu = s.menuButtons;
    if (s.posterColors && s.posterColors.length) buildPosterSwatches(s.posterColors);
    if (allLoadedPosts.length) renderPosts();
    siteLogo.src = s.logoUrl || 'https://hmjunaid9999-cmyk.github.io/Onuvuti/icon-192.png';
    siteName.textContent = s.siteName || 'Onuvuti';
    footerSiteName.textContent = s.siteName || 'Onuvuti';
    noticeText.textContent = s.noticeText || '';
    composerText.placeholder = s.composerPlaceholder || 'আপনার মনে কী চলছে?';
    posterPlaceholderText = s.posterPlaceholder || 'পোস্টারের লেখা এখানে দেখাবে';
    renderLinkButtons(menuGrid, s.menuItems);
    renderLinkButtons(footerGrid, s.footerItems);
    renderLinkButtons(sidebarGrid, s.sidebarItems);
    postsPerPage = s.postsPerPage || 5;
  }

  function listenSettings() {
    onSnapshot(doc(db, "settings", "site"), (snap) => {
      if (snap.exists()) applySettings(snap.data());
    });
  }

  // ---- কম্পোজার: মোড পরিবর্তন ----
  function buildPosterSwatches(colors) {
    posterColorsEl.innerHTML = '';
    (colors && colors.length ? colors : DEFAULT_POSTER_COLORS).forEach((color, i) => {
      const sw = document.createElement('div');
      sw.className = 'posterSwatch' + (i === 0 ? ' selected' : '');
      sw.style.background = color;
      sw.addEventListener('click', () => {
        selectedPosterColor = color;
        document.querySelectorAll('.posterSwatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
        updatePosterPreview();
      });
      posterColorsEl.appendChild(sw);
    });
    selectedPosterColor = (colors && colors.length ? colors : DEFAULT_POSTER_COLORS)[0];
  }
  buildPosterSwatches(DEFAULT_POSTER_COLORS);

  document.querySelectorAll('#composerTabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      composerMode = btn.getAttribute('data-mode');
      document.querySelectorAll('#composerTabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      posterColorsEl.style.display = composerMode === 'poster' ? 'flex' : 'none';
      posterPreview.style.display = composerMode === 'poster' ? 'flex' : 'none';
      if (composerMode === 'poster') updatePosterPreview();
    });
  });

  composerText.addEventListener('input', () => {
    if (composerMode === 'poster') updatePosterPreview();
  });

  function updatePosterPreview() {
    posterPreview.style.background = selectedPosterColor;
    posterPreview.textContent = composerText.value || posterPlaceholderText;
  }

  // ---- পোস্ট সাবমিট ----
  submitPostBtn.addEventListener('click', async () => {
    if (!currentUser) { composerStatus.textContent = 'লগইন করুন'; return; }
    const text = composerText.value.trim();

    if (composerMode === 'text' && !text) { composerStatus.textContent = 'কিছু লিখুন'; return; }
    if (composerMode === 'poster' && !text) { composerStatus.textContent = 'পোস্টারের জন্য লেখা দিন'; return; }

    submitPostBtn.disabled = true;
    composerStatus.textContent = 'পোস্ট হচ্ছে...';

    try {
      const postData = {
        authorUid: currentUser.uid,
        authorName: currentUser.displayName || 'User',
        authorEmail: currentUser.email || '',
        authorPhoto: currentUser.photoURL || '',
        type: composerMode,
        text: text,
        posterColor: composerMode === 'poster' ? selectedPosterColor : null,
        likedBy: [],
        commentCount: 0,
        createdAt: serverTimestamp()
      };

      await addDoc(collection(db, "posts"), postData);

      composerText.value = '';
      composerStatus.textContent = '✅ পোস্ট হয়েছে!';
      setTimeout(() => { composerStatus.textContent = ''; }, 2000);
      resetFeed();
    } catch (e) {
      console.error(e);
      composerStatus.textContent = 'এরর: ' + e.message;
    }
    submitPostBtn.disabled = false;
  });

  // ---- সময় দেখানো ----
  function timeAgo(ts) {
    if (!ts || !ts.toDate) return '';
    const diffMs = Date.now() - ts.toDate().getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'এই মাত্র';
    if (mins < 60) return mins + ' মিনিট আগে';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + ' ঘণ্টা আগে';
    return Math.floor(hrs / 24) + ' দিন আগে';
  }

  function escapeHtml(str) {
    return (str || '').replace(/</g, '&lt;');
  }

  // ---- পোস্ট ফিড লোড (পেজিনেশন সহ) ----
  async function loadPosts(isFirstLoad) {
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'লোড হচ্ছে...';

    let q;
    if (isFirstLoad || !lastVisibleDoc) {
      q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(postsPerPage));
    } else {
      q = query(collection(db, "posts"), orderBy("createdAt", "desc"), startAfter(lastVisibleDoc), limit(postsPerPage));
    }

    const snap = await getDocs(q);
    if (snap.empty) {
      loadMoreBtn.style.display = 'none';
      loadMoreBtn.disabled = false;
      return;
    }
    lastVisibleDoc = snap.docs[snap.docs.length - 1];

    snap.forEach(docSnap => {
      allLoadedPosts.push({ id: docSnap.id, data: docSnap.data() });
    });

    renderPosts();
    loadMoreBtn.style.display = snap.docs.length < postsPerPage ? 'none' : 'block';
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = 'আরও পোস্ট দেখুন';
  }

  function resetFeed() {
    allLoadedPosts = [];
    lastVisibleDoc = null;
    postsList.innerHTML = '';
    loadPosts(true);
  }

  // ---- শেয়ার করা লিংক (#post-<id>) থেকে সরাসরি সেই পোস্টে নিয়ে যাওয়া ----
  async function openSharedPostIfAny() {
    const m = location.hash.match(/^#post-(.+)$/);
    if (!m) return;
    const postId = decodeURIComponent(m[1]);
    try {
      const snap = await getDoc(doc(db, "posts", postId));
      if (!snap.exists()) return;
      if (!allLoadedPosts.some(p => p.id === postId)) {
        allLoadedPosts.unshift({ id: postId, data: snap.data() });
        renderPosts();
      }
      setTimeout(() => {
        const el = document.getElementById('post-' + postId);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.style.outline = '2px solid var(--primary-color)';
        setTimeout(() => { el.style.outline = ''; }, 2000);
      }, 200);
    } catch (e) {
      console.error(e);
    }
  }

  loadMoreBtn.addEventListener('click', () => loadPosts(false));

  searchBar.addEventListener('input', renderPosts);

  function renderPosts() {
    const searchTerm = searchBar.value.trim().toLowerCase();
    postsList.innerHTML = '';

    allLoadedPosts
      .filter(p => !searchTerm || (p.data.text || '').toLowerCase().includes(searchTerm))
      .forEach(p => postsList.appendChild(buildPostCard(p.id, p.data)));
  }

  function buildPostCard(postId, d) {
    const isOwner = currentUser && d.authorUid === currentUser.uid;
    const liked = currentUser && (d.likedBy || []).includes(currentUser.uid);
    const postUrl = location.href.split('#')[0] + '#post-' + postId;

    const card = document.createElement('div');
    card.className = 'postCard';
    card.id = 'post-' + postId;

    let mediaHtml = '';
    if (d.type === 'poster') {
      mediaHtml = `<div class="postPoster" style="background:${d.posterColor || '#4285F4'}">${escapeHtml(d.text)}</div>`;
    }

    card.innerHTML = `
      <div class="postHeader">
        <img class="avatar" src="${d.authorPhoto || ''}">
        <div>
          <div class="pName">${escapeHtml(d.authorName)}</div>
          <div class="pTime">${timeAgo(d.createdAt)}</div>
        </div>
        <div class="postMenuWrap">
          <button class="postMenuBtn">⋮</button>
          <div class="postMenuDropdown"></div>
        </div>
      </div>
      ${d.type !== 'poster' && d.text ? `<div class="postText">${escapeHtml(d.text)}</div>` : ''}
      ${mediaHtml}
      <div class="postButtons"></div>
      <div class="postStatus"></div>
      <div class="commentsWrap">
        <div class="commentForm">
          <textarea class="commentInput" rows="1" placeholder="কমেন্ট লিখুন..."></textarea>
          <button class="commentSubmitBtn">পোস্ট</button>
        </div>
        <div class="commentsListEl"></div>
      </div>
    `;

    const statusEl = card.querySelector('.postStatus');
    function showStatus(msg) { statusEl.textContent = msg; setTimeout(() => statusEl.textContent = '', 2000); }

    const bottomContainer = card.querySelector('.postButtons');
    const menuContainer = card.querySelector('.postMenuDropdown');
    const menuBtn0 = card.querySelector('.postMenuBtn');

    // ---- প্রতিটা বাটনের সংজ্ঞা (কোথায় বসবে সেটা settings থেকে ঠিক হবে) ----
    const buttonDefs = {
      like: () => {
        const b = document.createElement('button');
        b.className = 'likeBtn' + (liked ? ' liked' : '');
        b.innerHTML = `${liked ? '❤️' : '🤍'} লাইক (<span class="likeCount">${(d.likedBy || []).length}</span>)`;
        b.addEventListener('click', async () => {
          if (!currentUser) return;
          const postRef = doc(db, "posts", postId);
          const nowLiked = (d.likedBy || []).includes(currentUser.uid);
          await updateDoc(postRef, { likedBy: nowLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
          if (nowLiked) d.likedBy = (d.likedBy || []).filter(u => u !== currentUser.uid);
          else d.likedBy = [...(d.likedBy || []), currentUser.uid];
          // ---- শুধু এই বাটনটাই আপডেট, পুরো ফিড পুনর্নির্মাণ না করে (যাতে খোলা কমেন্ট বক্স অক্ষত থাকে) ----
          const nowLikedState = (d.likedBy || []).includes(currentUser.uid);
          b.className = 'likeBtn' + (nowLikedState ? ' liked' : '');
          b.innerHTML = `${nowLikedState ? '❤️' : '🤍'} লাইক (<span class="likeCount">${(d.likedBy || []).length}</span>)`;
        });
        return b;
      },
      comment: () => {
        const b = document.createElement('button');
        b.className = 'commentToggleBtn';
        b.innerHTML = `💬 কমেন্ট (<span class="commentCountEl">${d.commentCount || 0}</span>)`;
        let commentsLoaded = false;
        b.addEventListener('click', () => {
          const show = commentsWrap.style.display !== 'block';
          commentsWrap.style.display = show ? 'block' : 'none';
          if (show) {
            if (!commentsLoaded) { loadComments(postId, card); commentsLoaded = true; }
            if (!openCommentSections.includes(commentsWrap)) openCommentSections.push(commentsWrap);
            enterCommentFocus(card);
            rearmGuard();
          } else {
            openCommentSections = openCommentSections.filter(w => w !== commentsWrap);
            openReplyBoxes = openReplyBoxes.filter(b => !commentsWrap.contains(b));
            exitCommentFocus();
          }
        });
        return b;
      },
      copyText: () => {
        const b = document.createElement('button');
        b.className = 'copyTextBtn';
        b.textContent = '📋 টেক্সট কপি';
        b.addEventListener('click', async () => {
          menuContainer.classList.remove('open');
          try { await navigator.clipboard.writeText(d.text || ''); showStatus('কপি হয়েছে ✓'); }
          catch (e) { showStatus('কপি ব্যর্থ হয়েছে'); }
        });
        return b;
      },
      copyLink: () => {
        const b = document.createElement('button');
        b.className = 'copyLinkBtn';
        b.textContent = '🔗 লিংক কপি';
        b.addEventListener('click', async () => {
          menuContainer.classList.remove('open');
          try { await navigator.clipboard.writeText(postUrl); showStatus('লিংক কপি হয়েছে ✓'); }
          catch (e) { showStatus('কপি ব্যর্থ হয়েছে'); }
        });
        return b;
      },
      share: () => {
        const b = document.createElement('button');
        b.className = 'shareBtn';
        b.textContent = '📤 শেয়ার';
        b.addEventListener('click', async () => {
          menuContainer.classList.remove('open');
          if (navigator.share) { try { await navigator.share({ text: d.text || '', url: postUrl }); } catch (e) {} }
          else { try { await navigator.clipboard.writeText(postUrl); showStatus('লিংক কপি হয়েছে ✓'); } catch (e) {} }
        });
        return b;
      },
      edit: () => {
        if (!isOwner) return null;
        const b = document.createElement('button');
        b.className = 'editBtn';
        b.textContent = '✏️ এডিট';
        b.addEventListener('click', () => {
          menuContainer.classList.remove('open');
          const newText = prompt('পোস্ট এডিট করুন:', d.text || '');
          if (newText === null) return;
          updateDoc(doc(db, "posts", postId), { text: newText }).then(() => {
            d.text = newText;
            // ---- শুধু এই কার্ডের টেক্সট আপডেট, পুরো ফিড পুনর্নির্মাণ না করে ----
            const textEl = card.querySelector('.postText, .postTextContent');
            if (textEl) textEl.textContent = newText;
            const posterEl = card.querySelector('.postPoster');
            if (posterEl) posterEl.textContent = newText;
          }).catch(e => alert('এরর: ' + e.message));
        });
        return b;
      },
      delete: () => {
        if (!isOwner) return null;
        const b = document.createElement('button');
        b.className = 'deleteBtn';
        b.textContent = '🗑️ ডিলিট';
        b.addEventListener('click', async () => {
          menuContainer.classList.remove('open');
          if (!confirm('এই পোস্টটি ডিলিট করতে চান?')) return;
          try {
            await deleteDoc(doc(db, "posts", postId));
            allLoadedPosts = allLoadedPosts.filter(p => p.id !== postId);
            const wrap = card.querySelector('.commentsWrap');
            openCommentSections = openCommentSections.filter(w => w !== wrap);
            openReplyBoxes = openReplyBoxes.filter(b => !wrap.contains(b));
            card.remove();
          } catch (e) { alert('এরর: ' + e.message); }
        });
        return b;
      }
    };

    function placeButtons(order, container) {
      (order || []).forEach(key => {
        const factory = buttonDefs[key];
        if (!factory) return;
        const el = factory();
        if (el) container.appendChild(el);
      });
    }

    placeButtons(buttonOrder.bottom, bottomContainer);
    placeButtons(buttonOrder.menu, menuContainer);

    // থ্রি-ডট মেনু খোলা/বন্ধ
    menuBtn0.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.postMenuDropdown.open').forEach(el => { if (el !== menuContainer) el.classList.remove('open'); });
      menuContainer.classList.toggle('open');
    });
    document.addEventListener('click', () => menuContainer.classList.remove('open'));
    menuContainer.addEventListener('click', (e) => e.stopPropagation());

    // কমেন্ট বক্স রেফারেন্স (comment বাটনের ফাংশনে ব্যবহৃত হবে)
    const commentsWrap = card.querySelector('.commentsWrap');

    // কমেন্ট সাবমিট
    card.querySelector('.commentSubmitBtn').addEventListener('click', () => {
      const input = card.querySelector('.commentInput');
      postComment(postId, input.value, null, card);
      input.value = '';
    });

    return card;
  }

  // ---- কমেন্ট লোড ও রেন্ডার (ফ্ল্যাট: প্রথম পেজে শুধু কমেন্ট, রিপ্লাই আলাদা বক্সে, ডান দিকে ইনডেন্ট নেই) ----
  function loadComments(postId, card) {
    const listEl = card.querySelector('.commentsListEl');
    const q = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
    onSnapshot(q, (snap) => {
      const all = [];
      const byId = {};
      snap.forEach(c => { const obj = { id: c.id, data: c.data() }; all.push(obj); byId[c.id] = obj; });

      // ---- পুরনো ডেটাতে রিপ্লাই-এর-রিপ্লাই চেইন থাকলেও (কোনো ডেটা বাদ যাচ্ছে না), সবসময়
      //      মূল (টপ-লেভেল) কমেন্টের বক্সেই ফ্ল্যাটভাবে একসাথে দেখানো হবে ----
      function findTopLevelId(obj) {
        let cur = obj;
        const seen = new Set();
        while (cur && cur.data.replyToId && !seen.has(cur.id)) {
          seen.add(cur.id);
          const parent = byId[cur.data.replyToId];
          if (!parent) break;
          cur = parent;
        }
        return cur ? cur.id : obj.id;
      }

      const topLevel = all.filter(c => !c.data.replyToId).slice().reverse(); // নতুন কমেন্ট আগে
      const repliesByTop = {};
      all.filter(c => c.data.replyToId).forEach(c => {
        const topId = findTopLevelId(c);
        (repliesByTop[topId] = repliesByTop[topId] || []).push(c); // পুরাতন থেকে নতুন, ধারাবাহিকভাবে নিচে নামবে
      });

      listEl.innerHTML = '';
      topLevel.forEach(c => {
        listEl.appendChild(buildCommentRow(postId, c.id, c.data, true, card, repliesByTop[c.id] || []));
      });

      const cCountEl = card.querySelector('.commentCountEl');
      if (cCountEl) cCountEl.textContent = all.length;
      updateDoc(doc(db, "posts", postId), { commentCount: all.length }).catch(() => {});
    });
  }

  async function postComment(postId, text, replyToId, card) {
    if (!currentUser) return;
    const t = (text || '').trim();
    if (!t) return;
    const payload = {
      uid: currentUser.uid,
      name: currentUser.displayName || 'User',
      email: currentUser.email || '',
      photoURL: currentUser.photoURL || '',
      text: t,
      likedBy: [],
      createdAt: serverTimestamp()
    };
    if (replyToId) payload.replyToId = replyToId;
    try { await addDoc(collection(db, "posts", postId, "comments"), payload); }
    catch (e) { alert('কমেন্ট এরর: ' + e.message); }
  }

  // isTopLevel = true হলে এটা মূল কমেন্ট (রিপ্লাই বক্স টগল করা যাবে); false হলে এটা সেই বক্সের
  // ভেতরের একটা রিপ্লাই সারি — কোনো অবস্থাতেই আরও ডান দিকে যাবে না, নিজের কোনো রিপ্লাই-বক্স থাকবে না।
  function buildCommentRow(postId, commentId, d, isTopLevel, card, replies) {
    const isOwner = currentUser && d.uid === currentUser.uid;
    const liked = currentUser && (d.likedBy || []).includes(currentUser.uid);
    const replyList = replies || [];
    const row = document.createElement('div');
    row.className = 'commentRow';

    row.innerHTML = `
      <div class="commentMain">
        <img src="${d.photoURL || ''}">
        <div style="flex:1; min-width:0;">
          <div class="commentBody">
            <div class="cName">${escapeHtml(d.name)}</div>
            <div class="cText">${escapeHtml(d.text)}</div>
          </div>
          <div class="commentMeta">
            <span>${timeAgo(d.createdAt)}</span>
            <button class="cLikeBtn">${liked ? '❤️' : '🤍'} <span class="cLikeCount">${(d.likedBy || []).length}</span></button>
            <button class="cCopyBtn">কপি</button>
            ${isTopLevel ? `<button class="cReplyToggleBtn">উত্তর দিন${replyList.length ? ' (' + replyList.length + ')' : ''}</button>` : ''}
            ${isOwner ? '<button class="cEditBtn">এডিট</button>' : ''}
            ${isOwner ? '<button class="cDeleteBtn">ডিলিট</button>' : ''}
          </div>
        </div>
      </div>
      ${isTopLevel ? `
        <div class="replyBox" style="display:none;">
          <div class="replyBoxList"></div>
          <div class="replyForm">
            <textarea class="replyInput" rows="1" placeholder="উত্তর লিখুন..."></textarea>
            <button class="replySubmitBtn">পাঠান</button>
          </div>
        </div>
      ` : ''}
    `;

    row.querySelector('.cLikeBtn').addEventListener('click', async () => {
      if (!currentUser) return;
      const ref2 = doc(db, "posts", postId, "comments", commentId);
      const nowLiked = (d.likedBy || []).includes(currentUser.uid);
      await updateDoc(ref2, { likedBy: nowLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
    });

    row.querySelector('.cCopyBtn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(d.text || ''); } catch (e) {}
    });

    const editBtn = row.querySelector('.cEditBtn');
    if (editBtn) {
      editBtn.addEventListener('click', () => {
        const newText = prompt('কমেন্ট এডিট করুন:', d.text || '');
        if (newText === null) return;
        updateDoc(doc(db, "posts", postId, "comments", commentId), { text: newText }).catch(e => alert('এরর: ' + e.message));
      });
    }

    const deleteBtn = row.querySelector('.cDeleteBtn');
    if (deleteBtn) {
      deleteBtn.addEventListener('click', async () => {
        if (!confirm('কমেন্টটি ডিলিট করতে চান?')) return;
        try { await deleteDoc(doc(db, "posts", postId, "comments", commentId)); }
        catch (e) { alert('এরর: ' + e.message); }
      });
    }

    if (isTopLevel) {
      const replyBox = row.querySelector('.replyBox');
      const replyBoxList = row.querySelector('.replyBoxList');
      replyList.forEach(r => {
        // রিপ্লাই বক্সের ভেতরের প্রতিটা সারি ফ্ল্যাট (isTopLevel=false) — আর ডানে যাবে না
        replyBoxList.appendChild(buildCommentRow(postId, r.id, r.data, false, card, []));
      });

      const toggleBtn = row.querySelector('.cReplyToggleBtn');
      toggleBtn.addEventListener('click', () => {
        const show = replyBox.style.display === 'none';
        replyBox.style.display = show ? 'block' : 'none';
        if (show) {
          if (!openReplyBoxes.includes(replyBox)) openReplyBoxes.push(replyBox);
          rearmGuard();
        } else {
          openReplyBoxes = openReplyBoxes.filter(b => b !== replyBox);
        }
      });

      row.querySelector('.replySubmitBtn').addEventListener('click', () => {
        const input = row.querySelector('.replyInput');
        // সবসময় মূল (টপ-লেভেল) কমেন্টের সাথেই যুক্ত হবে — যাতে সব রিপ্লাই এক বক্সেই ফ্ল্যাট থাকে
        postComment(postId, input.value, commentId, card);
        input.value = '';
      });
    }

    return row;
  }

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      listenSettings();
      resetFeed();
      openSharedPostIfAny();
      initBackGuard();
    } else {
      appScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      loginBtn.disabled = false;
      loginStatus.textContent = '';
    }
  });

  // ---- Back বাটন গার্ড: মেনু/কমেন্ট খোলা থাকলে বন্ধ করে, নাহলে দুইবার Back চাইলে বের হবে ----
  // ব্রাউজারের নিজস্ব স্ক্রল-রিস্টোরেশন বন্ধ রাখা হচ্ছে, নাহলে প্রথমবার ব্যাক চাপলে ব্রাউজার
  // নিজে থেকেই পুরনো (শুরুর) স্ক্রল পজিশনে ফিরিয়ে নিয়ে যায় — আমাদের নিজের scrollIntoView-ই এখন একমাত্র নিয়ন্ত্রক
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }

  let backGuardActive = false;
  let backPressCount = 0;
  let backPressTimer = null;
  const exitToast = document.getElementById('exitToast');

  function rearmGuard() {
    history.pushState({ guard: true }, '', location.href);
  }

  function initBackGuard() {
    if (backGuardActive) return;
    backGuardActive = true;
    rearmGuard();
    window.addEventListener('popstate', handleBack);
  }

  function handleBack() {
    if (sidebarDrawer.classList.contains('open')) {
      closeSidebar();
      rearmGuard();
      return;
    }
    const openMenu = document.querySelector('.postMenuDropdown.open');
    if (openMenu) {
      openMenu.classList.remove('open');
      rearmGuard();
      return;
    }
    if (openReplyBoxes.length) {
      const box = openReplyBoxes.pop();
      box.style.display = 'none';
      rearmGuard();
      return;
    }
    if (openCommentSections.length) {
      const wrap = openCommentSections.pop();
      wrap.style.display = 'none';
      openReplyBoxes = openReplyBoxes.filter(b => !wrap.contains(b));
      exitCommentFocus();
      rearmGuard();
      return;
    }

    if (backPressCount === 0) {
      backPressCount = 1;
      exitToast.style.display = 'block';
      rearmGuard();
      backPressTimer = setTimeout(() => {
        backPressCount = 0;
        exitToast.style.display = 'none';
      }, 2000);
    } else {
      clearTimeout(backPressTimer);
      exitToast.style.display = 'none';
    }
  }
</script>
</body>
</html>
