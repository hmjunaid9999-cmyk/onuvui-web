<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onuvuti App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary-color: #4285F4;
    --bg-color: #0d1117;
    --card-color: #161b22;
    --text-color: #ffffff;
    --max-width: 640px;
  }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); min-height: 100vh; }

  #loginScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  #loginScreen img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; }
  #loginScreen h1 { font-size: 22px; margin-bottom: 6px; }
  #loginScreen p { color: #9ca3af; font-size: 14px; margin-bottom: 28px; }
  #googleLoginBtn {
    display: flex; align-items: center; gap: 10px;
    background: var(--primary-color); color: #fff; border: none;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  #googleLoginBtn:disabled { opacity: 0.6; }
  #loginStatus { margin-top: 16px; font-size: 13px; color: #f87171; min-height: 18px; }

  #appScreen { display: none; }

  /* ---- হেডার: বাম দিকে ☰, মাঝখানে লোগো + সাইট নাম, ডানে লগ-আউট ---- */
  #siteHeader {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; background: var(--card-color); border-bottom: 1px solid #262c36;
  }
  #siteHeader img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  #siteHeader h1 { font-size: 19px; font-weight: bold; }
  #sidebarToggleBtn {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 8px;
  }
  #logoutBtn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: #262c36; color: #f87171; border: none; padding: 6px 14px; border-radius: 14px; font-size: 12px; cursor: pointer;
  }

  /* ---- স্ক্রলিং নোটিশ ---- */
  #noticeBar {
    background: #1c2128; overflow: hidden; white-space: nowrap; padding: 8px 0;
    border-bottom: 1px solid #262c36;
  }
  #noticeBar span {
    display: inline-block; padding-left: 100%;
    animation: scrollNotice 18s linear infinite;
    font-size: 13px; color: #facc15;
  }
  @keyframes scrollNotice {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  /* ---- মেনু বার (গ্রিড বাটন) ---- */
  #menuGrid {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
    background: var(--card-color); border-bottom: 1px solid #262c36;
  }
  #menuGrid a {
    background: var(--primary-color); color: #fff; text-decoration: none;
    font-size: 12px; padding: 7px 12px; border-radius: 14px;
  }

  main { padding: 20px 16px; max-width: var(--max-width); margin: 0 auto; }

  /* ---- ফুটার: সাইট নাম + গ্রিড বাটন ---- */
  #footerSection { padding: 20px 16px; margin-top: 20px; border-top: 1px solid #262c36; text-align: center; }
  #footerSiteName { font-size: 16px; font-weight: bold; margin-bottom: 12px; opacity: 0.9; }
  #footerGrid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #footerGrid a {
    background: #262c36; color: #fff; text-decoration: none;
    font-size: 12px; padding: 7px 12px; border-radius: 14px;
  }

  /* ---- বাম সাইডবার ড্রয়ার ---- */
  #sidebarOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
  }
  #sidebarOverlay.open { display: block; }
  #sidebarDrawer {
    position: fixed; top: 0; left: -260px; width: 260px; height: 100%;
    background: var(--card-color); z-index: 101; transition: left 0.25s ease;
    padding: 18px 14px; overflow-y: auto;
  }
  #sidebarDrawer.open { left: 0; }
  #sidebarDrawer .drawerHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #sidebarCloseBtn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  #sidebarGrid { display: flex; flex-direction: column; gap: 8px; }
  #sidebarGrid a {
    display: block; background: #0d1117; color: #fff; text-decoration: none;
    font-size: 13px; padding: 10px 12px; border-radius: 10px; border: 1px solid #262c36;
  }
</style>
</head>
<body>

  <div id="loginScreen">
    <img src="https://hmjunaid9999-cmyk.github.io/Onuvuti/icon-192.png" alt="Onuvuti">
    <h1>Onuvuti App</h1>
    <p>চালিয়ে যেতে Google দিয়ে লগইন করুন</p>
    <button id="googleLoginBtn">🔵 Google দিয়ে লগইন করুন</button>
    <div id="loginStatus"></div>
  </div>

  <div id="appScreen">

    <div id="sidebarOverlay"></div>
    <div id="sidebarDrawer">
      <div class="drawerHeader">
        <strong>মেনু</strong>
        <button id="sidebarCloseBtn">✕</button>
      </div>
      <div id="sidebarGrid"></div>
    </div>

    <div id="siteHeader">
      <button id="sidebarToggleBtn">☰</button>
      <img id="siteLogo" src="" alt="">
      <h1 id="siteName">Onuvuti</h1>
      <button id="logoutBtn">লগ আউট</button>
    </div>

    <div id="noticeBar"><span id="noticeText"></span></div>
    <div id="menuGrid"></div>

    <main>
      <h2>স্বাগতম! 👋</h2>
      <p style="color:#9ca3af; margin-top:8px;">এখানে ধীরে ধীরে আসল কনটেন্ট যোগ করা হবে।</p>
    </main>

    <div id="footerSection">
      <div id="footerSiteName"></div>
      <div id="footerGrid"></div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
  import {
    getFirestore, doc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:d87ae40431210088df8b25",
    measurementId: "G-WJ8N8XLPSZ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginBtn = document.getElementById('googleLoginBtn');
  const loginStatus = document.getElementById('loginStatus');
  const logoutBtn = document.getElementById('logoutBtn');
  const siteLogo = document.getElementById('siteLogo');
  const siteName = document.getElementById('siteName');
  const noticeText = document.getElementById('noticeText');
  const menuGrid = document.getElementById('menuGrid');
  const footerGrid = document.getElementById('footerGrid');
  const footerSiteName = document.getElementById('footerSiteName');
  const sidebarGrid = document.getElementById('sidebarGrid');
  const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
  const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
  const sidebarDrawer = document.getElementById('sidebarDrawer');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  loginBtn.addEventListener('click', async () => {
    loginBtn.disabled = true;
    loginStatus.textContent = 'লগইন হচ্ছে...';
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      console.error(e);
      loginStatus.textContent = 'এরর: ' + (e && e.message ? e.message : String(e));
      loginBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async () => { await signOut(auth); });

  function openSidebar() { sidebarDrawer.classList.add('open'); sidebarOverlay.classList.add('open'); }
  function closeSidebar() { sidebarDrawer.classList.remove('open'); sidebarOverlay.classList.remove('open'); }
  sidebarToggleBtn.addEventListener('click', openSidebar);
  sidebarCloseBtn.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  function renderButtons(container, items) {
    container.innerHTML = '';
    (items || []).forEach(item => {
      if (!item || !item.label) return;
      const a = document.createElement('a');
      a.textContent = item.label;
      a.href = item.url || '#';
      container.appendChild(a);
    });
  }

  function applySettings(s) {
    if (!s) return;
    const root = document.documentElement.style;
    if (s.primaryColor) root.setProperty('--primary-color', s.primaryColor);
    if (s.bgColor) root.setProperty('--bg-color', s.bgColor);
    if (s.cardColor) root.setProperty('--card-color', s.cardColor);
    if (s.textColor) root.setProperty('--text-color', s.textColor);
    if (s.maxWidth) root.setProperty('--max-width', s.maxWidth + 'px');

    siteLogo.src = s.logoUrl || 'https://hmjunaid9999-cmyk.github.io/Onuvuti/icon-192.png';
    siteName.textContent = s.siteName || 'Onuvuti';
    footerSiteName.textContent = s.siteName || 'Onuvuti';
    noticeText.textContent = s.noticeText || '';

    renderButtons(menuGrid, s.menuItems);
    renderButtons(footerGrid, s.footerItems);
    renderButtons(sidebarGrid, s.sidebarItems);
  }

  function listenSettings() {
    onSnapshot(doc(db, "settings", "site"), (snap) => {
      if (snap.exists()) applySettings(snap.data());
    });
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      listenSettings();
    } else {
      appScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      loginBtn.disabled = false;
      loginStatus.textContent = '';
    }
  });
</script>
</body>
</html>
