<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onuvuti App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4285F4;
    --bg: #0d1117;
    --card: #161b22;
    --text: #ffffff;
    --max-w: 640px;
  }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  
  #loginScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  #loginScreen img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; }
  #loginScreen h1 { font-size: 22px; margin-bottom: 6px; }
  #loginScreen p { color: #9ca3af; font-size: 14px; margin-bottom: 28px; }
  #googleLoginBtn {
    display: flex; align-items: center; gap: 10px;
    background: var(--primary); color: #fff; border: none;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  #loginStatus { margin-top: 16px; font-size: 13px; color: #f87171; }
  
  #appScreen { display: none; }
  
  #siteHeader {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; background: var(--card); border-bottom: 1px solid #262c36;
  }
  #siteHeader img { width: 38px; height: 38px; border-radius: 10px; }
  #siteHeader h1 { font-size: 19px; font-weight: bold; }
  #sidebarToggleBtn, #logoutBtn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #fff; cursor: pointer;
  }
  #sidebarToggleBtn { left: 14px; font-size: 22px; padding: 4px 8px; }
  #logoutBtn { right: 14px; background: #262c36; color: #f87171; padding: 6px 14px; border-radius: 14px; font-size: 12px; }
  
  #noticeBar {
    background: #1c2128; overflow: hidden; white-space: nowrap; padding: 8px 0;
    border-bottom: 1px solid #262c36;
  }
  #noticeBar span {
    display: inline-block; padding-left: 100%;
    animation: scrollNotice 18s linear infinite;
    font-size: 13px; color: #facc15;
  }
  @keyframes scrollNotice { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  
  #menuGrid {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
    background: var(--card); border-bottom: 1px solid #262c36;
  }
  #menuGrid a { background: var(--primary); color: #fff; text-decoration: none; font-size: 12px; padding: 7px 12px; border-radius: 14px; }
  
  main { padding: 16px; max-width: var(--max-w); margin: 0 auto; }
  
  #composer { background: var(--card); border: 1px solid #262c36; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  #composerTabs { display: flex; gap: 6px; margin-bottom: 10px; }
  #composerTabs button {
    background: #21262d; color: #9ca3af; border: none; padding: 6px 12px; border-radius: 12px; font-size: 12px; cursor: pointer;
  }
  #composerTabs button.active { background: var(--primary); color: #fff; }
  #composerText {
    width: 100%; background: #0d1117; border: 1px solid #30363d; color: #fff;
    padding: 10px; border-radius: 10px; font-size: 14px; min-height: 80px; resize: vertical;
  }
  #posterColors { display: none; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .posterSwatch { width: 32px; height: 32px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .posterSwatch.selected { border-color: #fff; }
  #posterPreview {
    display: none; margin-top: 10px; border-radius: 12px; padding: 40px 16px;
    text-align: center; font-size: 18px; font-weight: bold; color: #fff; min-height: 150px;
    align-items: center; justify-content: center;
  }
  #submitPostBtn {
    margin-top: 10px; width: 100%; background: var(--primary); color: #fff; border: none;
    padding: 10px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  #submitPostBtn:disabled { opacity: 0.6; }
  
  #searchBar {
    width: 100%; background: var(--card); border: 1px solid #262c36; color: #fff;
    padding: 10px 14px; border-radius: 20px; font-size: 14px; margin-bottom: 16px;
  }
  
  .postCard { background: var(--card); border: 1px solid #262c36; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .postHeader { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; position: relative; }
  .postHeader img.avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; }
  .postHeader .pName { font-size: 13px; font-weight: bold; }
  .postHeader .pTime { font-size: 11px; color: #6b7280; }
  .postMenuWrap { margin-left: auto; position: relative; }
  .postMenuBtn { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .postMenuDropdown {
    display: none; position: absolute; right: 0; top: 30px; background: #21262d; border: 1px solid #30363d;
    border-radius: 10px; min-width: 140px; z-index: 10; overflow: hidden;
  }
  .postMenuDropdown.open { display: block; }
  .postMenuDropdown button {
    display: block; width: 100%; text-align: left; background: none; border: none; color: #fff;
    padding: 10px 12px; font-size: 12px; cursor: pointer;
  }
  .postMenuDropdown button:hover { background: #30363d; }
  .postText { font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 8px; }
  .postPoster {
    border-radius: 10px; padding: 50px 16px; text-align: center; font-size: 17px;
    font-weight: bold; color: #fff; margin-bottom: 8px; min-height: 150px;
    display: flex; align-items: center; justify-content: center; white-space: pre-wrap;
  }
  .postButtons { display: flex; gap: 6px; border-top: 1px solid #262c36; padding-top: 8px; flex-wrap: wrap; }
  .postButtons button {
    background: #21262d; color: #c9d1d9; border: none; padding: 6px 10px; border-radius: 10px; font-size: 11px; cursor: pointer;
  }
  .postButtons button.liked { color: #f87171; }
  .postStatus { font-size: 11px; color: #4ade80; margin-top: 6px; min-height: 14px; }
  
  .commentsWrap { display: none; margin-top: 10px; border-top: 1px solid #262c36; padding-top: 10px; }
  .commentForm { display: flex; gap: 8px; margin-bottom: 10px; }
  .commentForm textarea {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px 10px;
    border-radius: 10px; font-size: 13px; resize: vertical; min-height: 36px;
  }
  .commentForm button { background: var(--primary); color: #fff; border: none; padding: 0 14px; border-radius: 10px; font-size: 12px; cursor: pointer; }
  .commentRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .commentRow img { width: 28px; height: 28px; border-radius: 50%; background: #333; flex-shrink: 0; }
  .commentBody { background: #0d1117; border-radius: 12px; padding: 8px 10px; flex: 1; }
  .commentBody .cName { font-size: 12px; font-weight: bold; }
  .commentBody .cText { font-size: 13px; color: #ddd; white-space: pre-wrap; }
  .commentMeta { font-size: 10px; color: #6b7280; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
  .commentMeta button { background: none; border: none; color: #4285F4; cursor: pointer; font-size: 10px; padding: 0; }
  .repliesList { margin-left: 36px; }
  
  #loadMoreBtn {
    display: block; width: 100%; background: var(--card); color: #fff; border: 1px solid #262c36;
    padding: 10px; border-radius: 12px; font-size: 13px; margin-top: 10px; cursor: pointer;
  }
  #loadMoreBtn:disabled { opacity: 0.5; }
  
  #footerSection { padding: 12px 16px; margin-top: 8px; border-top: 1px solid #262c36; text-align: center; }
  #footerSiteName { font-size: 16px; font-weight: bold; margin-bottom: 12px; opacity: 0.9; }
  #footerGrid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #footerGrid a { background: #262c36; color: #fff; text-decoration: none; font-size: 12px; padding: 7px 12px; border-radius: 14px; }
  
  #sidebarOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; }
  #sidebarOverlay.open { display: block; }
  #sidebarDrawer {
    position: fixed; top: 0; left: -260px; width: 260px; height: 100%;
    background: var(--card); z-index: 101; transition: left 0.25s ease; padding: 18px 14px; overflow-y: auto;
  }
  #sidebarDrawer.open { left: 0; }
  #sidebarDrawer .drawerHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #sidebarCloseBtn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  #sidebarGrid { display: flex; flex-direction: column; gap: 8px; }
  #sidebarGrid a { display: block; background: #0d1117; color: #fff; text-decoration: none; font-size: 13px; padding: 10px 12px; border-radius: 10px; border: 1px solid #262c36; }
  
  #exitToast {
    display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #21262d; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 300;
  }
  
  @media (max-width: 480px) {
    .postButtons { gap: 4px; }
    .postButtons button { font-size: 10px; padding: 4px 8px; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <img src="https://hmjunaid9999-cmyk.github.io/Onuvuti/icon-192.png" alt="Onuvuti">
  <h1>Onuvuti App</h1>
  <p>চালিয়ে যেতে Google দিয়ে লগইন করুন</p>
  <button id="googleLoginBtn">🔵 Google দিয়ে লগইন করুন</button>
  <div id="loginStatus"></div>
</div>

<div id="appScreen">
  <div id="sidebarOverlay"></div>
  <div id="sidebarDrawer">
    <div class="drawerHeader"><strong>মেনু</strong><button id="sidebarCloseBtn">✕</button></div>
    <div id="sidebarGrid"></div>
  </div>

  <div id="siteHeader">
    <button id="sidebarToggleBtn">☰</button>
    <img id="siteLogo" src="" alt="">
    <h1 id="siteName">Onuvuti</h1>
    <button id="logoutBtn">লগ আউট</button>
  </div>

  <div id="noticeBar"><span id="noticeText"></span></div>
  <div id="menuGrid"></div>

  <main>
    <div id="composer">
      <div id="composerTabs">
        <button class="active" data-mode="text">📝 টেক্সট</button>
        <button data-mode="poster">🎨 পোস্টার</button>
      </div>
      <textarea id="composerText" placeholder="আপনার মনে কী চলছে?"></textarea>
      <div id="posterColors"></div>
      <div id="posterPreview"></div>
      <button id="submitPostBtn">পোস্ট করুন</button>
      <div class="postStatus" id="composerStatus"></div>
    </div>

    <input type="text" id="searchBar" placeholder="🔍 পোস্ট খুঁজুন...">
    <div id="postsList"></div>
    <button id="loadMoreBtn" style="display:none;">আরও পোস্ট দেখুন</button>
  </main>

  <div id="footerSection">
    <div id="footerSiteName"></div>
    <div id="footerGrid"></div>
  </div>
</div>

<div id="exitToast">আবার Back চাপুন বের হওয়ার জন্য</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import {
  getFirestore, doc, onSnapshot, collection, addDoc, updateDoc, deleteDoc,
  query, orderBy, limit, startAfter, getDocs, serverTimestamp,
  arrayUnion, arrayRemove, writeBatch
} from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
  authDomain: "onuvuti-5c9e3.firebaseapp.com",
  projectId: "onuvuti-5c9e3",
  storageBucket: "onuvuti-5c9e3.firebasestorage.app",
  messagingSenderId: "846713879232",
  appId: "1:846713879232:web:d87ae40431210088df8b25",
  measurementId: "G-WJ8N8XLPSZ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let allPosts = [];
let lastVisible = null;
let postsPerPage = 5;
let composerMode = 'text';
let selectedColor = '#4285F4';
let commentListeners = {};
let focusedCards = [];
let loadMoreBtnPrevDisplay = '';
let backHandlerAttached = false;
let backPressCount = 0;
let backPressTimer = null;
const DEFAULT_COLORS = ['#4285F4', '#EA4335', '#34A853', '#FBBC05', '#8B5CF6', '#EC4899', '#111827'];

const $ = id => document.getElementById(id);
const loginScreen = $('loginScreen');
const appScreen = $('appScreen');
const loginBtn = $('googleLoginBtn');
const loginStatus = $('loginStatus');
const logoutBtn = $('logoutBtn');
const postsList = $('postsList');
const loadMoreBtn = $('loadMoreBtn');
const searchBar = $('searchBar');
const composerText = $('composerText');
const submitBtn = $('submitPostBtn');
const composerStatus = $('composerStatus');
const posterColors = $('posterColors');
const posterPreview = $('posterPreview');
const sidebarDrawer = $('sidebarDrawer');
const sidebarOverlay = $('sidebarOverlay');
const exitToast = $('exitToast');

// ========== SETTINGS ==========
function buildSwatches(colors = DEFAULT_COLORS) {
  posterColors.innerHTML = '';
  colors.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'posterSwatch' + (i === 0 ? ' selected' : '');
    el.style.background = c;
    el.onclick = () => {
      selectedColor = c;
      document.querySelectorAll('.posterSwatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      updatePreview();
    };
    posterColors.appendChild(el);
  });
  selectedColor = colors[0] || '#4285F4';
}
buildSwatches();

function updatePreview() {
  posterPreview.style.background = selectedColor;
  posterPreview.textContent = composerText.value || 'পোস্টারের লেখা এখানে দেখাবে';
}

function renderLinks(container, items = []) {
  container.innerHTML = '';
  items.forEach(item => {
    const a = document.createElement('a');
    a.textContent = item.label || '';
    a.href = item.url || '#';
    container.appendChild(a);
  });
}

function applySettings(s) {
  if (!s) return;
  const root = document.documentElement.style;
  if (s.primaryColor) root.setProperty('--primary', s.primaryColor);
  if (s.bgColor) root.setProperty('--bg', s.bgColor);
  if (s.cardColor) root.setProperty('--card', s.cardColor);
  if (s.textColor) root.setProperty('--text', s.textColor);
  if (s.maxWidth) root.setProperty('--max-w', s.maxWidth + 'px');
  if (s.posterColors) buildSwatches(s.posterColors);
  if (s.logoUrl) $('siteLogo').src = s.logoUrl;
  if (s.siteName) { $('siteName').textContent = s.siteName; $('footerSiteName').textContent = s.siteName; }
  if (s.noticeText) $('noticeText').textContent = s.noticeText;
  if (s.composerPlaceholder) composerText.placeholder = s.composerPlaceholder;
  renderLinks($('menuGrid'), s.menuItems);
  renderLinks($('footerGrid'), s.footerItems);
  renderLinks($('sidebarGrid'), s.sidebarItems);
  if (s.postsPerPage) postsPerPage = s.postsPerPage;
}

function listenSettings() {
  onSnapshot(doc(db, "settings", "site"), snap => {
    if (snap.exists()) applySettings(snap.data());
  });
}

// ========== AUTH ==========
loginBtn.onclick = async () => {
  loginBtn.disabled = true;
  loginStatus.textContent = 'লগইন হচ্ছে...';
  try { await signInWithPopup(auth, provider); }
  catch (e) { loginStatus.textContent = 'এরর: ' + e.message; loginBtn.disabled = false; }
};
logoutBtn.onclick = () => signOut(auth);

// ========== SIDEBAR ==========
const toggleSidebar = () => {
  sidebarDrawer.classList.toggle('open');
  sidebarOverlay.classList.toggle('open');
};
$('sidebarToggleBtn').onclick = toggleSidebar;
$('sidebarCloseBtn').onclick = toggleSidebar;
sidebarOverlay.onclick = toggleSidebar;

// ========== COMPOSER ==========
document.querySelectorAll('#composerTabs button').forEach(btn => {
  btn.onclick = () => {
    composerMode = btn.dataset.mode;
    document.querySelectorAll('#composerTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    posterColors.style.display = composerMode === 'poster' ? 'flex' : 'none';
    posterPreview.style.display = composerMode === 'poster' ? 'flex' : 'none';
    if (composerMode === 'poster') updatePreview();
  };
});
composerText.oninput = () => { if (composerMode === 'poster') updatePreview(); };

submitBtn.onclick = async () => {
  if (!currentUser) { composerStatus.textContent = 'লগইন করুন'; return; }
  const text = composerText.value.trim();
  if (!text) { composerStatus.textContent = 'কিছু লিখুন'; return; }
  submitBtn.disabled = true;
  composerStatus.textContent = 'পোস্ট হচ্ছে...';
  try {
    await addDoc(collection(db, "posts"), {
      authorUid: currentUser.uid,
      authorName: currentUser.displayName || 'User',
      authorEmail: currentUser.email || '',
      authorPhoto: currentUser.photoURL || '',
      type: composerMode,
      text: text,
      posterColor: composerMode === 'poster' ? selectedColor : null,
      likedBy: [],
      commentCount: 0,
      createdAt: serverTimestamp()
    });
    composerText.value = '';
    composerStatus.textContent = '✅ পোস্ট হয়েছে!';
    setTimeout(() => composerStatus.textContent = '', 2000);
    resetFeed();
  } catch (e) { composerStatus.textContent = 'এরর: ' + e.message; }
  submitBtn.disabled = false;
};

// ========== TIME ==========
function timeAgo(ts) {
  if (!ts?.toDate) return '';
  const diff = Date.now() - ts.toDate().getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'এই মাত্র';
  if (m < 60) return m + ' মিনিট আগে';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' ঘণ্টা আগে';
  return Math.floor(h / 24) + ' দিন আগে';
}

function esc(str) { return (str || '').replace(/</g, '&lt;'); }

// ========== COMMENT SYSTEM ==========
async function deletePostWithComments(postId) {
  const snap = await getDocs(collection(db, "posts", postId, "comments"));
  const batch = writeBatch(db);
  snap.forEach(d => batch.delete(d.ref));
  batch.delete(doc(db, "posts", postId));
  await batch.commit();
}

function renderComment(postId, commentId, data, depth = 0, card) {
  const isOwner = currentUser && data.uid === currentUser.uid;
  const liked = currentUser && (data.likedBy || []).includes(currentUser.uid);
  const indent = Math.min(depth, 4) * 24;
  
  const row = document.createElement('div');
  row.className = 'commentRow';
  row.style.marginLeft = indent + 'px';
  
  row.innerHTML = `
    <img src="${data.photoURL || ''}">
    <div style="flex:1;">
      <div class="commentBody">
        <div class="cName">${esc(data.name)}</div>
        <div class="cText">${esc(data.text)}</div>
      </div>
      <div class="commentMeta">
        <span>${timeAgo(data.createdAt)}</span>
        <button class="cLikeBtn">${liked ? '❤️' : '🤍'} <span class="cLikeCount">${(data.likedBy || []).length}</span></button>
        <button class="cCopyBtn">কপি</button>
        <button class="cReplyBtn">উত্তর দিন</button>
        ${isOwner ? `<button class="cEditBtn">এডিট</button><button class="cDeleteBtn">ডিলিট</button>` : ''}
      </div>
      <div class="replyForm" style="display:none; gap:6px; margin-top:6px;">
        <textarea class="replyInput" rows="1" placeholder="উত্তর লিখুন..." style="flex:1; background:#0d1117; border:1px solid #30363d; color:#fff; border-radius:8px; padding:6px 8px; font-size:12px;"></textarea>
        <button class="replySubmitBtn" style="background:#4285F4; color:#fff; border:none; border-radius:8px; padding:0 10px; font-size:11px; cursor:pointer;">পাঠান</button>
      </div>
      <div class="repliesList"></div>
    </div>
  `;
  
  row.querySelector('.cLikeBtn').onclick = async () => {
    if (!currentUser) return;
    const ref = doc(db, "posts", postId, "comments", commentId);
    const nowLiked = (data.likedBy || []).includes(currentUser.uid);
    await updateDoc(ref, { likedBy: nowLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
  };
  
  row.querySelector('.cCopyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(`${data.name}: ${data.text}`); } catch(e) {}
  };
  
  const replyForm = row.querySelector('.replyForm');
  row.querySelector('.cReplyBtn').onclick = () => {
    replyForm.style.display = replyForm.style.display === 'none' ? 'flex' : 'none';
  };
  row.querySelector('.replySubmitBtn').onclick = async () => {
    const input = row.querySelector('.replyInput');
    const text = input.value.trim();
    if (!text || !currentUser) return;
    await addDoc(collection(db, "posts", postId, "comments"), {
      uid: currentUser.uid,
      name: currentUser.displayName || 'User',
      email: currentUser.email || '',
      photoURL: currentUser.photoURL || '',
      text: text,
      replyToId: commentId,
      likedBy: [],
      createdAt: serverTimestamp()
    });
    input.value = '';
    replyForm.style.display = 'none';
  };
  
  const editBtn = row.querySelector('.cEditBtn');
  if (editBtn) {
    editBtn.onclick = () => {
      const newText = prompt('কমেন্ট এডিট করুন:', data.text || '');
      if (newText !== null) updateDoc(doc(db, "posts", postId, "comments", commentId), { text: newText });
    };
  }
  
  const delBtn = row.querySelector('.cDeleteBtn');
  if (delBtn) {
    delBtn.onclick = async () => {
      if (!confirm('কমেন্ট ডিলিট?')) return;
      await deleteDoc(doc(db, "posts", postId, "comments", commentId));
    };
  }
  
  return row;
}

function loadComments(postId, card) {
  if (commentListeners[postId]) {
    commentListeners[postId]();
    delete commentListeners[postId];
  }
  
  const listEl = card.querySelector('.commentsListEl');
  const q = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "desc"));
  
  commentListeners[postId] = onSnapshot(q, (snap) => {
    const all = [];
    snap.forEach(c => all.push({ id: c.id, data: c.data() }));
    
    const topLevel = all.filter(c => !c.data.replyToId);
    const childrenMap = {};
    all.filter(c => c.data.replyToId).forEach(c => {
      if (!childrenMap[c.data.replyToId]) childrenMap[c.data.replyToId] = [];
      childrenMap[c.data.replyToId].push(c);
    });
    
    function renderTree(comments, depth = 0) {
      const fragment = document.createDocumentFragment();
      comments.forEach(c => {
        const row = renderComment(postId, c.id, c.data, depth, card);
        const replies = childrenMap[c.id] || [];
        if (replies.length) {
          row.querySelector('.repliesList').appendChild(renderTree(replies, depth + 1));
        }
        fragment.appendChild(row);
      });
      return fragment;
    }
    
    listEl.innerHTML = '';
    listEl.appendChild(renderTree(topLevel));
    
    const countEl = card.querySelector('.commentCountEl');
    if (countEl) countEl.textContent = all.length;
  });
}

// ========== FOCUS MANAGEMENT ==========
function enterFocus(card) {
  if (focusedCards.length === 0) {
    postsList.querySelectorAll('.postCard').forEach(c => {
      if (c !== card) c.style.display = 'none';
    });
    loadMoreBtnPrevDisplay = loadMoreBtn.style.display;
    loadMoreBtn.style.display = 'none';
  }
  focusedCards.push(card);
}

function exitFocus(card) {
  focusedCards = focusedCards.filter(c => c !== card);
  if (focusedCards.length === 0) {
    postsList.querySelectorAll('.postCard').forEach(c => c.style.display = '');
    loadMoreBtn.style.display = loadMoreBtnPrevDisplay;
  }
}

// ========== POST RENDER ==========
function buildPost(postId, data) {
  const isOwner = currentUser && data.authorUid === currentUser.uid;
  const liked = currentUser && (data.likedBy || []).includes(currentUser.uid);
  const postUrl = location.href.split('#')[0] + '#post-' + postId;
  
  const card = document.createElement('div');
  card.className = 'postCard';
  card.id = 'post-' + postId;
  
  let media = '';
  if (data.type === 'poster') {
    media = `<div class="postPoster" style="background:${data.posterColor || '#4285F4'}">${esc(data.text)}</div>`;
  }
  
  card.innerHTML = `
    <div class="postHeader">
      <img class="avatar" src="${data.authorPhoto || ''}">
      <div>
        <div class="pName">${esc(data.authorName)}</div>
        <div class="pTime">${timeAgo(data.createdAt)}</div>
      </div>
      <div class="postMenuWrap">
        <button class="postMenuBtn">⋮</button>
        <div class="postMenuDropdown"></div>
      </div>
    </div>
    ${data.type !== 'poster' && data.text ? `<div class="postText">${esc(data.text)}</div>` : ''}
    ${media}
    <div class="postButtons"></div>
    <div class="postStatus"></div>
    <div class="commentsWrap">
      <div class="commentForm">
        <textarea class="commentInput" rows="1" placeholder="কমেন্ট লিখুন..."></textarea>
        <button class="commentSubmitBtn">পোস্ট</button>
      </div>
      <div class="commentsListEl"></div>
    </div>
  `;
  
  const status = card.querySelector('.postStatus');
  const showStatus = msg => { status.textContent = msg; setTimeout(() => status.textContent = '', 2000); };
  
  const bottom = card.querySelector('.postButtons');
  const menu = card.querySelector('.postMenuDropdown');
  const menuBtn = card.querySelector('.postMenuBtn');
  
  const likeBtn = document.createElement('button');
  likeBtn.className = liked ? 'liked' : '';
  likeBtn.innerHTML = `${liked ? '❤️' : '🤍'} লাইক (<span class="likeCount">${(data.likedBy || []).length}</span>)`;
  likeBtn.onclick = async () => {
    if (!currentUser) return;
    const ref = doc(db, "posts", postId);
    const nowLiked = (data.likedBy || []).includes(currentUser.uid);
    await updateDoc(ref, { likedBy: nowLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
  };
  bottom.appendChild(likeBtn);
  
  const commentBtn = document.createElement('button');
  commentBtn.className = 'commentToggleBtn';
  commentBtn.innerHTML = `💬 কমেন্ট (<span class="commentCountEl">${data.commentCount || 0}</span>)`;
  let commentsLoaded = false;
  const commentsWrap = card.querySelector('.commentsWrap');
  commentBtn.onclick = () => {
    const show = commentsWrap.style.display !== 'block';
    commentsWrap.style.display = show ? 'block' : 'none';
    if (show) {
      if (!commentsLoaded) { loadComments(postId, card); commentsLoaded = true; }
      enterFocus(card);
    } else {
      if (commentListeners[postId]) { commentListeners[postId](); delete commentListeners[postId]; }
      exitFocus(card);
    }
  };
  bottom.appendChild(commentBtn);
  
  const copyBtn = document.createElement('button');
  copyBtn.textContent = '📋 কপি';
  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(data.text || ''); showStatus('কপি হয়েছে ✓'); }
    catch(e) { showStatus('কপি ব্যর্থ'); }
  };
  bottom.appendChild(copyBtn);
  
  // Menu
  const copyLinkBtn = document.createElement('button');
  copyLinkBtn.textContent = '🔗 লিংক কপি';
  copyLinkBtn.onclick = async () => {
    menu.classList.remove('open');
    try { await navigator.clipboard.writeText(postUrl); showStatus('লিংক কপি ✓'); }
    catch(e) { showStatus('কপি ব্যর্থ'); }
  };
  menu.appendChild(copyLinkBtn);
  
  if (isOwner) {
    const editBtn = document.createElement('button');
    editBtn.textContent = '✏️ এডিট';
    editBtn.onclick = () => {
      menu.classList.remove('open');
      const newText = prompt('পোস্ট এডিট করুন:', data.text || '');
      if (newText !== null) updateDoc(doc(db, "posts", postId), { text: newText });
    };
    menu.appendChild(editBtn);
    
    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️ ডিলিট';
    delBtn.onclick = async () => {
      menu.classList.remove('open');
      if (!confirm('পোস্ট ডিলিট?')) return;
      await deletePostWithComments(postId);
      allPosts = allPosts.filter(p => p.id !== postId);
      renderPosts();
    };
    menu.appendChild(delBtn);
  }
  
  menuBtn.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.postMenuDropdown.open').forEach(el => {
      if (el !== menu) el.classList.remove('open');
    });
    menu.classList.toggle('open');
  };
  document.addEventListener('click', () => menu.classList.remove('open'));
  
  // Comment submit
  card.querySelector('.commentSubmitBtn').onclick = () => {
    const input = card.querySelector('.commentInput');
    const text = input.value.trim();
    if (!text || !currentUser) return;
    addDoc(collection(db, "posts", postId, "comments"), {
      uid: currentUser.uid,
      name: currentUser.displayName || 'User',
      email: currentUser.email || '',
      photoURL: currentUser.photoURL || '',
      text: text,
      replyToId: null,
      likedBy: [],
      createdAt: serverTimestamp()
    });
    input.value = '';
  };
  
  return card;
}

// ========== FEED ==========
function renderPosts() {
  const searchTerm = searchBar.value.trim().toLowerCase();
  postsList.innerHTML = '';
  const filtered = allPosts.filter(p => 
    !searchTerm || (p.data.text || '').toLowerCase().includes(searchTerm)
  );
  filtered.forEach(p => postsList.appendChild(buildPost(p.id, p.data)));
}

async function loadPosts(isFirstLoad) {
  loadMoreBtn.disabled = true;
  loadMoreBtn.textContent = 'লোড হচ্ছে...';
  
  let q;
  if (isFirstLoad || !lastVisible) {
    q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(postsPerPage));
  } else {
    q = query(collection(db, "posts"), orderBy("createdAt", "desc"), startAfter(lastVisible), limit(postsPerPage));
  }
  
  const snap = await getDocs(q);
  if (snap.empty) {
    loadMoreBtn.style.display = 'none';
    loadMoreBtn.disabled = false;
    return;
  }
  lastVisible = snap.docs[snap.docs.length - 1];
  snap.forEach(d => allPosts.push({ id: d.id, data: d.data() }));
  renderPosts();
  loadMoreBtn.style.display = snap.docs.length < postsPerPage ? 'none' : 'block';
  loadMoreBtn.disabled = false;
  loadMoreBtn.textContent = 'আরও পোস্ট দেখুন';
}

function resetFeed() {
  allPosts = [];
  lastVisible = null;
  postsList.innerHTML = '';
  loadPosts(true);
}

loadMoreBtn.onclick = () => loadPosts(false);
searchBar.oninput = renderPosts;

// ========== BACK BUTTON GUARD ==========
function rearmGuard() {
  history.pushState({ guard: true }, '', location.href);
}

function handleBack() {
  if (sidebarDrawer.classList.contains('open')) {
    toggleSidebar();
    rearmGuard();
    return;
  }
  const openMenu = document.querySelector('.postMenuDropdown.open');
  if (openMenu) {
    openMenu.classList.remove('open');
    rearmGuard();
    return;
  }
  if (focusedCards.length > 0) {
    const card = focusedCards[focusedCards.length - 1];
    const wrap = card.querySelector('.commentsWrap');
    if (wrap) {
      wrap.style.display = 'none';
      if (commentListeners[card.id.replace('post-', '')]) {
        commentListeners[card.id.replace('post-', '')]();
        delete commentListeners[card.id.replace('post-', '')];
      }
      exitFocus(card);
    }
    rearmGuard();
    return;
  }
  
  if (backPressCount === 0) {
    backPressCount = 1;
    exitToast.style.display = 'block';
    rearmGuard();
    backPressTimer = setTimeout(() => {
      backPressCount = 0;
      exitToast.style.display = 'none';
    }, 2000);
  } else {
    clearTimeout(backPressTimer);
    exitToast.style.display = 'none';
    backPressCount = 0;
    // Allow exit
  }
}

function initBackGuard() {
  if (backHandlerAttached) return;
  backHandlerAttached = true;
  window.addEventListener('popstate', handleBack);
  rearmGuard();
}

// ========== AUTH STATE ==========
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    loginScreen.style.display = 'none';
    appScreen.style.display = 'block';
    listenSettings();
    resetFeed();
    initBackGuard();
  } else {
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
    loginBtn.disabled = false;
    loginStatus.textContent = '';
    // Cleanup comment listeners
    Object.keys(commentListeners).forEach(key => {
      commentListeners[key]();
      delete commentListeners[key];
    });
  }
});
</script>
