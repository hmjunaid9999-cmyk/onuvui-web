<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onuvuti App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #fff;
    min-height: 100vh;
  }
  /* ---------- লগইন স্ক্রিন ---------- */
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  #loginScreen img {
    width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px;
  }
  #loginScreen h1 { font-size: 22px; margin-bottom: 6px; }
  #loginScreen p { color: #9ca3af; font-size: 14px; margin-bottom: 28px; }
  #googleLoginBtn {
    display: flex; align-items: center; gap: 10px;
    background: #4285F4; color: #fff; border: none;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: bold;
    cursor: pointer;
  }
  #googleLoginBtn:disabled { opacity: 0.6; }
  #loginStatus { margin-top: 16px; font-size: 13px; color: #f87171; min-height: 18px; }

  /* ---------- মূল অ্যাপ ---------- */
  #appScreen { display: none; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: #161b22; border-bottom: 1px solid #262c36;
  }
  header .userInfo { display: flex; align-items: center; gap: 10px; }
  header img.avatar { width: 34px; height: 34px; border-radius: 50%; background: #333; }
  header .userName { font-size: 14px; font-weight: bold; }
  #logoutBtn {
    background: #262c36; color: #f87171; border: none;
    padding: 8px 16px; border-radius: 16px; font-size: 13px; cursor: pointer;
  }
  main { padding: 24px 18px; }
  main h2 { font-size: 18px; margin-bottom: 10px; }
  main p { color: #9ca3af; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

  <!-- লগইন স্ক্রিন: প্রথমে এটাই দেখাবে -->
  <div id="loginScreen">
    <img src="https://hmjunaid9999-cmyk.github.io/Onuvuti/icon-192.png" alt="Onuvuti">
    <h1>Onuvuti App</h1>
    <p>চালিয়ে যেতে Google দিয়ে লগইন করুন</p>
    <button id="googleLoginBtn">🔵 Google দিয়ে লগইন করুন</button>
    <div id="loginStatus"></div>
  </div>

  <!-- মূল অ্যাপ স্ক্রিন: লগইনের পরেই দেখাবে -->
  <div id="appScreen">
    <header>
      <div class="userInfo">
        <img class="avatar" id="userAvatar" src="" alt="">
        <span class="userName" id="userName"></span>
      </div>
      <button id="logoutBtn">লগ আউট</button>
    </header>
    <main>
      <h2>স্বাগতম! 👋</h2>
      <p>এখানে ধীরে ধীরে আসল কনটেন্ট, ফিচার যোগ করা হবে।</p>
    </main>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:d87ae40431210088df8b25",
    measurementId: "G-WJ8N8XLPSZ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginBtn = document.getElementById('googleLoginBtn');
  const loginStatus = document.getElementById('loginStatus');
  const logoutBtn = document.getElementById('logoutBtn');
  const userAvatar = document.getElementById('userAvatar');
  const userName = document.getElementById('userName');

  loginBtn.addEventListener('click', async () => {
    loginBtn.disabled = true;
    loginStatus.textContent = 'লগইন হচ্ছে...';
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.error(e);
      loginStatus.textContent = 'এরর: ' + (e && e.message ? e.message : String(e));
      loginBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      userAvatar.src = user.photoURL || '';
      userName.textContent = user.displayName || 'User';
    } else {
      appScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      loginBtn.disabled = false;
      loginStatus.textContent = '';
    }
  });
</script>
</body>
</html>
