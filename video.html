<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ভিডিও</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#fff;font-family:Arial,sans-serif}#app{max-width:980px;margin:auto;padding-bottom:80px}header{position:sticky;top:0;z-index:20;text-align:center;padding:14px;background:#161b22;border-bottom:1px solid #30363d;font-weight:700}main{padding:15px}.panel{display:none}.panel.active{display:block}.search{display:flex;gap:8px;background:#161b22;border:1px solid #30363d;border-radius:24px;padding:9px 13px;margin-bottom:15px}.search input{width:100%;background:none;border:0;outline:0;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden;cursor:pointer}.thumb{aspect-ratio:16/9;background:#000;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:10px}.title{font-size:14px;font-weight:700;line-height:1.35}.muted{font-size:11px;color:#999;margin-top:6px}.empty,.loading,.error{padding:20px;text-align:center;color:#999;background:#161b22;border:1px solid #30363d;border-radius:10px}.video{position:relative;background:#000;aspect-ratio:16/9;border-radius:10px;overflow:hidden}.video iframe{position:absolute;width:100%;height:100%;border:0}.info{padding-top:12px}.info h2{font-size:18px;margin:0 0 7px}.caption{color:#ccc;white-space:pre-wrap;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-block:1px solid #30363d;padding:10px 0;margin-top:10px}.actions button{background:none;border:0;color:#aaa;cursor:pointer;font-size:13px;padding:5px}.actions button:hover{color:#fff}.comments{display:none;margin-top:12px}.comments textarea{width:100%;background:#111;color:#fff;border:1px solid #333;padding:8px}.box,.balance{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:12px}.balance strong{display:block;font-size:25px;margin-top:5px}label{font-size:12px;color:#aaa}input,textarea,select{width:100%;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:7px;padding:9px;margin:6px 0 10px}.primary{width:100%;padding:10px;background:#4285f4;color:#fff;border:0;border-radius:7px;cursor:pointer;font-weight:700}.danger{padding:7px 11px;background:#35171c;color:#ff9da8;border:1px solid #632b34;border-radius:6px;cursor:pointer}.notice{font-size:12px;color:#aaa;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tabs button{padding:10px;background:#161b22;color:#aaa;border:1px solid #30363d;border-radius:7px;cursor:pointer}.tabs button.active{color:#fff;background:#222;border-color:#555}.list{display:flex;flex-direction:column;gap:10px}.item{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px}.item-row{display:flex;gap:10px;align-items:center}.item-thumb{width:120px;height:68px;flex:0 0 120px;border-radius:7px;overflow:hidden;background:#000}.item-thumb img{width:100%;height:100%;object-fit:cover}.item-info{min-width:0;flex:1}.item-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:flex;gap:12px;flex-wrap:wrap;color:#aaa;font-size:11px;margin-top:6px}.item-actions{margin-top:9px;display:flex;justify-content:flex-end}nav{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #30363d;z-index:30}nav div{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}nav button{background:none;border:0;color:#aaa;padding:8px;font-size:12px;cursor:pointer}nav button b{display:block;font-size:18px;margin-bottom:2px}nav button.active{color:#fff}.top-back{margin-bottom:10px}.top-back button{background:#222;color:#fff;border:1px solid #444;border-radius:7px;padding:7px 12px;cursor:pointer}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"><header>🎬 ভিডিও</header><main>
<section id="home" class="panel active"><div class="search">🔎<input id="search" placeholder="ভিডিও খুঁজুন..." oninput="render()"></div><div id="grid" class="grid"><div class="loading">লোড হচ্ছে...</div></div></section>
<section id="player" class="panel"><div class="top-back"><button onclick="goBackFromPlayer()">← ভিডিও তালিকায় ফিরে যান</button></div><div class="video"><iframe id="frame" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe><div id="adOverlay" style="display:none;position:absolute;inset:0;background:#000;z-index:5"><iframe id="adFrame" style="width:100%;height:100%;border:0" allow="autoplay;encrypted-media"></iframe><div style="position:absolute;bottom:10px;right:10px;display:flex;align-items:center;gap:8px"><span id="adCountdown" style="background:#000000b3;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px"></span><button id="adSkipBtn" style="display:none;background:#fff;color:#000;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer">স্কিপ ➡</button></div><div style="position:absolute;top:10px;left:10px;background:#000000b3;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px">বিজ্ঞাপন</div></div></div><div class="info"><h2 id="title"></h2><p id="caption" class="caption"></p><div class="actions"><button id="like">🤍 <span id="likes">0</span></button><button id="comment">💬 <span id="commentsCount">0</span></button><button id="share">🔗 শেয়ার</button><button id="copy">📋 কপি লিংক</button><span>👁 <span id="views">0</span></span></div><div id="commentBox" class="comments"><textarea id="commentText" rows="2" placeholder="একটি কমেন্ট লিখুন..."></textarea><button class="primary" onclick="postComment()">পোস্ট করুন</button><div id="commentList"></div></div></div></section>
<section id="ad" class="panel"><div class="balance">🪙 <span id="unitLabel1">Coin</span> Balance<strong id="adPoints">0 Coin</strong></div><div class="box"><h3>📢 বিজ্ঞাপন যোগ করুন</h3><label>বিজ্ঞাপনের Title</label><input id="adTitle"><label>YouTube/Facebook Embed URL</label><input id="adUrl" placeholder="https://www.youtube.com/embed/"><label>বিজ্ঞাপনের খরচ</label><input id="adBudget" type="number" readonly><p id="adCostNote" class="notice"></p><button class="primary" onclick="submitAd()">বিজ্ঞাপন জমা দিন</button><div id="adStatus" class="notice"></div></div><div class="box"><h3>💳 Payment Request</h3><p class="notice">বর্তমানে ম্যানুয়াল Payment System। Admin-এর কাছে Coin কেনার Request পাঠানো যাবে।</p><label>কত Coin চান</label><input id="requestCoins" type="number" min="1"><label>পেমেন্টের তথ্য / Transaction ID</label><input id="paymentNote" placeholder="Transaction ID বা পেমেন্টের বিবরণ"><button class="primary" onclick="submitPaymentRequest()">Payment Request পাঠান</button><div id="paymentStatus" class="notice"></div></div></section>
<section id="my" class="panel"><div class="balance">🪙 <span id="unitLabel2">Coin</span> Balance<strong id="myPoints">0 Coin</strong></div><div class="tabs"><button id="myVideoTab" class="active" onclick="showMyTab('videos')">🎬 আমার ভিডিও</button><button id="myAdTab" onclick="showMyTab('ads')">📢 আমার বিজ্ঞাপন</button></div><div id="myVideos" class="list"></div><div id="myAds" class="list" style="display:none"></div></section>
<section id="add" class="panel"><div class="balance">🪙 <span id="unitLabel3">Coin</span> Balance<strong id="addPoints">0 Coin</strong></div><div class="box"><h3>➕ ভিডিও যোগ করুন</h3><label>ভিডিওর Title</label><input id="newTitle"><label>YouTube/Facebook Embed URL</label><input id="newUrl" placeholder="https://www.youtube.com/embed/"><label>ভিডিওর খরচ</label><input id="videoBudget" type="number" readonly><p id="videoCostNote" class="notice"></p><button class="primary" onclick="submitVideo()">ভিডিও যুক্ত করুন</button><div id="videoStatus" class="notice"></div></div></section>
</main><nav><div><button onclick="panel('ad',this)"><b>📢</b>বিজ্ঞাপন</button><button class="active" onclick="panel('my',this)"><b>🎬</b>মাই ভিডিও</button><button onclick="panel('add',this)"><b>➕</b>অ্যাড ভিডিও</button></div></nav></div>
<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";import{getFirestore,collection,query,orderBy,getDocs,doc,getDoc,setDoc,increment,deleteDoc,addDoc,serverTimestamp,onSnapshot,limit,runTransaction}from"https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",authDomain:"onuvuti-5c9e3.firebaseapp.com",projectId:"onuvuti-5c9e3",storageBucket:"onuvuti-5c9e3.firebasestorage.app",messagingSenderId:"846713879232",appId:"1:846713879232:web:d87ae40431210088df8b25",measurementId:"G-WJ8N8XLPSZ"};const app=getApps().length?getApps()[0]:initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let user=null,vid=null,data=null,liked=false,arr=[],statsUnsub=null,commentsUnsub=null,myVideos=[],myAds=[];let settings={unitName:"Coin",videoCost:10,adCost:5,adRewardCoins:1};const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function unit(){return settings.unitName||"Coin"}function money(n){return Number(n||0)+" "+unit()}
onAuthStateChanged(auth,async u=>{user=u;await loadSettings();await balance();await loadMine()});
async function loadSettings(){try{let s=await getDoc(doc(db,"settings","video"));if(s.exists()){let d=s.data();settings.unitName=d.unitName||d.pointName||settings.unitName;settings.videoCost=Number(d.videoCost??d.videoPointCost??settings.videoCost);settings.adCost=Number(d.adCost??d.adPointCost??settings.adCost);settings.adRewardCoins=Number(d.adRewardCoins??settings.adRewardCoins)}}catch(e){}[1,2,3].forEach(n=>$("unitLabel"+n).textContent=unit());$("adBudget").value=settings.adCost;$("videoBudget").value=settings.videoCost;$("adCostNote").textContent="প্রতি বিজ্ঞাপন জমা দেওয়ার সময় "+settings.adCost+" "+unit()+" কাটা হবে।";$("videoCostNote").textContent="প্রতি ভিডিও যোগ করার খরচ "+settings.videoCost+" "+unit()+"।"}
async function load(){try{let s=await getDocs(query(collection(db,"videos"),orderBy("createdAt","desc"),limit(60)));arr=s.docs.map(x=>({id:x.id,d:x.data()}));render()}catch(e){$("grid").innerHTML='<div class="error">ভিডিও লোড করা যাচ্ছে না: '+esc(e.message)+'</div>'}}
function videoId(url){let m=String(url||"").match(/(?:embed\/|youtu\.be\/|watch\?v=|v=)([A-Za-z0-9_-]{6,})/);return m?m[1]:null}function thumbFor(d){if(d.thumbnail)return d.thumbnail;let y=videoId(d.videoUrl);return y?`https://img.youtube.com/vi/${y}/hqdefault.jpg`:""}
window.render=()=>{let t=$("search").value.toLowerCase().trim();$("grid").innerHTML="";let a=arr.filter(x=>(x.d.title||"").toLowerCase().includes(t));if(!a.length){$("grid").innerHTML='<div class="empty">কোনো ভিডিও নেই।</div>';return}a.forEach(x=>{let d=x.d,c=document.createElement("div");c.className="card";let im=thumbFor(d);c.innerHTML=`<div class="thumb">${im?`<img src="${esc(im)}" alt="">`:""}</div><div class="body"><div class="title">${esc(d.title||"Untitled")}</div><div class="muted">${esc(d.channelName||"Onuvuti")} · 👁 ${Number(d.viewCount||0)}</div></div>`;c.onclick=()=>openVideo(x.id);$("grid").append(c)})};
async function openVideo(id){try{let s=await getDoc(doc(db,"videos",id));if(!s.exists())return;vid=id;data=s.data();$("home").classList.remove("active");$("player").classList.add("active");$("frame").src=data.videoUrl||"";$("title").textContent=data.title||"";$("caption").textContent=data.caption||"";hideAd();scheduleAd();await setDoc(doc(db,"videos",id,"stats","counts"),{viewCount:increment(1)},{merge:true});subscribeStats();subscribeComments();likeState();history.pushState({video:id},"",location.pathname+"?v="+encodeURIComponent(id))}catch(e){console.error(e)}}

// ---- ৩ মিনিট পর মিড-রোল বিজ্ঞাপন: ১০ সেকেন্ড বাধ্যতামূলক দেখানোর পর স্কিপ বাটন আসবে ----
let adTimer=null,adCountdownIv=null,adsPool=null;
async function loadAdsPool(){if(adsPool)return adsPool;try{let s=await getDocs(query(collection(db,"advertisements"),orderBy("createdAt","desc"),limit(50)));adsPool=s.docs.map(x=>({id:x.id,d:x.data()})).filter(x=>x.d.status==="active")}catch(e){adsPool=[]}return adsPool}
function scheduleAd(){clearTimeout(adTimer);adTimer=setTimeout(showAd,180000)}
async function showAd(){let pool=await loadAdsPool();if(!pool||!pool.length)return;let ad=pool[Math.floor(Math.random()*pool.length)];$("adFrame").src=ad.d.videoUrl||"";$("adOverlay").style.display="block";$("adSkipBtn").style.display="none";try{await setDoc(doc(db,"advertisements",ad.id),{viewCount:increment(1)},{merge:true})}catch(e){}let t=10;$("adCountdown").textContent=t+" সেকেন্ড পর স্কিপ করা যাবে";clearInterval(adCountdownIv);adCountdownIv=setInterval(()=>{t--;if(t<=0){clearInterval(adCountdownIv);$("adCountdown").textContent="";$("adSkipBtn").style.display="inline-block";rewardAdView()}else{$("adCountdown").textContent=t+" সেকেন্ড পর স্কিপ করা যাবে"}},1000)}
async function rewardAdView(){if(!user||!settings.adRewardCoins)return;try{await setDoc(doc(db,"users",user.uid),{points:increment(settings.adRewardCoins)},{merge:true});await balance();$("adCountdown").textContent="+"+settings.adRewardCoins+" "+unit()+" পেয়েছেন 🎉"}catch(e){}}
function hideAd(){clearTimeout(adTimer);clearInterval(adCountdownIv);$("adOverlay").style.display="none";$("adFrame").src=""}
$("adSkipBtn").onclick=()=>{clearInterval(adCountdownIv);$("adOverlay").style.display="none";$("adFrame").src=""};
function subscribeStats(){if(statsUnsub)statsUnsub();statsUnsub=onSnapshot(doc(db,"videos",vid,"stats","counts"),s=>{let d=s.exists()?s.data():{};$("views").textContent=d.viewCount||0;$("likes").textContent=d.likeCount||0;$("commentsCount").textContent=d.commentCount||0})}async function likeState(){if(!user){liked=false;return}try{liked=(await getDoc(doc(db,"videos",vid,"likes",user.uid))).exists();$("like").firstChild.textContent=liked?"❤️ ":"🤍 "}catch(e){}}
$("like").onclick=async()=>{if(!user)return alert("লাইক দিতে লগইন করুন।");let l=doc(db,"videos",vid,"likes",user.uid),s=doc(db,"videos",vid,"stats","counts");try{if(liked){await deleteDoc(l);await setDoc(s,{likeCount:increment(-1)},{merge:true})}else{await setDoc(l,{likedAt:serverTimestamp()});await setDoc(s,{likeCount:increment(1)},{merge:true})}likeState()}catch(e){alert("লাইক দেওয়া যায়নি: "+e.message)}};
function subscribeComments(){if(commentsUnsub)commentsUnsub();commentsUnsub=onSnapshot(query(collection(db,"videos",vid,"comments"),orderBy("createdAt","desc"),limit(50)),s=>{$("commentsCount").textContent=s.size;$("commentList").innerHTML=s.docs.map(x=>{let d=x.data();return`<p class="box"><b>${esc(d.name||"User")}</b><br>${esc(d.text||"")}</p>`}).join("")})}window.postComment=async()=>{if(!user)return alert("কমেন্ট করতে লগইন করুন।");let t=$("commentText").value.trim();if(!t||!vid)return;try{await addDoc(collection(db,"videos",vid,"comments"),{text:t,uid:user.uid,name:user.displayName||"User",photoURL:user.photoURL||"",createdAt:serverTimestamp()});$("commentText").value=""}catch(e){alert("কমেন্ট করা যায়নি: "+e.message)}};
$("comment").onclick=()=>$("commentBox").style.display=$("commentBox").style.display==="block"?"none":"block";function permalink(){return location.origin+location.pathname+"?v="+encodeURIComponent(vid||"")};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(permalink());alert("লিংক কপি হয়েছে ✓")}catch(e){alert("লিংক কপি করা যায়নি।")}};$("share").onclick=async()=>{let u=permalink();try{if(navigator.share)await navigator.share({title:data?.title||"Video",url:u});else{await navigator.clipboard.writeText(u);alert("লিংক কপি হয়েছে ✓")}}catch(e){}};
window.panel=(id,b)=>{document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="my")loadMine();balance()};window.goBackFromPlayer=()=>{hideAd();return history.length>1?history.back():( $("player").classList.remove("active"),$("home").classList.add("active"),$("frame").src="")};window.addEventListener("popstate",()=>{let p=new URLSearchParams(location.search).get("v");if(p)openVideo(p);else{hideAd();$("frame").src="";$("player").classList.remove("active");$("home").classList.add("active")}});
async function balance(){let n=0;if(user)try{let s=await getDoc(doc(db,"users",user.uid));if(s.exists())n=Number(s.data().points??s.data().coins??s.data().balance??0)}catch(e){}["adPoints","myPoints","addPoints"].forEach(x=>$(x).textContent=money(n))}
async function loadMine(){if(!user){$("myVideos").innerHTML='<div class="empty">নিজের ভিডিও দেখতে লগইন করুন।</div>';$('myAds').innerHTML='<div class="empty">নিজের বিজ্ঞাপন দেখতে লগইন করুন।</div>';return}try{let[vs,as]=await Promise.all([getDocs(query(collection(db,"videos"),orderBy("createdAt","desc"),limit(100))),getDocs(query(collection(db,"advertisements"),orderBy("createdAt","desc"),limit(100)))]);myVideos=vs.docs.map(x=>({id:x.id,d:x.data()})).filter(x=>x.d.ownerUid===user.uid);myAds=as.docs.map(x=>({id:x.id,d:x.data()})).filter(x=>x.d.ownerUid===user.uid);renderMine()}catch(e){$("myVideos").innerHTML='<div class="error">My Video লোড করা যায়নি: '+esc(e.message)+'</div>';$("myAds").innerHTML='<div class="error">My Advertisement লোড করা যায়নি: '+esc(e.message)+'</div>'}}
function renderMine(){$("myVideos").innerHTML=myVideos.length?myVideos.map(x=>{let d=x.d,im=thumbFor(d);return`<div class="item"><div class="item-row"><div class="item-thumb">${im?`<img src="${esc(im)}">`:""}</div><div class="item-info"><div class="item-title">${esc(d.title||"Untitled")}</div><div class="stats"><span>👁 ${Number(d.viewCount||0)}</span><span>❤️ ${Number(d.likeCount||0)}</span><span>💬 ${Number(d.commentCount||0)}</span><span>🪙 ${Number(d.pointsSpent||0)}</span></div></div></div><div class="item-actions"><button class="danger" onclick="deleteMyVideo('${x.id}')">ডিলিট</button></div></div>`}).join(""):'<div class="empty">আপনার কোনো ভিডিও নেই।</div>';$('myAds').innerHTML=myAds.length?myAds.map(x=>{let d=x.d,im=thumbFor(d);return`<div class="item"><div class="item-row"><div class="item-thumb">${im?`<img src="${esc(im)}">`:""}</div><div class="item-info"><div class="item-title">${esc(d.title||"Untitled")}</div><div class="stats"><span>👁 ${Number(d.viewCount||0)}</span><span>🪙 ${Number(d.pointsSpent||settings.adCost)}</span></div></div></div><div class="item-actions"><button class="danger" onclick="deleteMyAd('${x.id}')">ডিলিট</button></div></div>`}).join(""):'<div class="empty">আপনার কোনো বিজ্ঞাপন নেই।</div>'}
window.showMyTab=t=>{$("myVideoTab").classList.toggle("active",t==="videos");$("myAdTab").classList.toggle("active",t==="ads");$("myVideos").style.display=t==="videos"?"flex":"none";$("myAds").style.display=t==="ads"?"flex":"none"};window.deleteMyVideo=async id=>{if(!user||!confirm("এই ভিডিওটি ডিলিট করতে চান?"))return;try{await deleteDoc(doc(db,"videos",id));await loadMine();await load()}catch(e){alert("ডিলিট করা যায়নি: "+e.message)}};window.deleteMyAd=async id=>{if(!user||!confirm("এই বিজ্ঞাপনটি ডিলিট করতে চান?"))return;try{await deleteDoc(doc(db,"advertisements",id));await loadMine()}catch(e){alert("ডিলিট করা যায়নি: "+e.message)}};
function validUrl(u){return/^https?:\/\//i.test(String(u||"").trim())}window.submitVideo=async()=>{if(!user)return alert("ভিডিও যুক্ত করতে লগইন করুন।");let title=$("newTitle").value.trim(),url=$("newUrl").value.trim(),cost=settings.videoCost;if(!title||!validUrl(url))return alert("Title এবং সঠিক Embed URL দিন।");try{await runTransaction(db,async tx=>{let uref=doc(db,"users",user.uid),us=await tx.get(uref);if(!us.exists())throw Error("User profile পাওয়া যায়নি।");let bal=Number(us.data().points??us.data().coins??us.data().balance??0);if(bal<cost)throw Error("পর্যাপ্ত "+unit()+" নেই।");let vref=doc(collection(db,"videos"));tx.set(vref,{title,caption:"",videoUrl:url,ownerUid:user.uid,createdAt:serverTimestamp(),pointsSpent:cost,status:"active"});tx.update(uref,{points:bal-cost})});$("newTitle").value="";$("newUrl").value="";$("videoStatus").textContent="ভিডিও সফলভাবে যুক্ত হয়েছে ✓";await balance();await load();await loadMine()}catch(e){$("videoStatus").textContent=e.message}};
window.submitAd=async()=>{if(!user)return alert("বিজ্ঞাপন দিতে লগইন করুন।");let title=$("adTitle").value.trim(),url=$("adUrl").value.trim(),cost=settings.adCost;if(!title||!validUrl(url))return alert("Title এবং সঠিক Embed URL দিন।");try{await runTransaction(db,async tx=>{let uref=doc(db,"users",user.uid),us=await tx.get(uref);if(!us.exists())throw Error("User profile পাওয়া যায়নি।");let bal=Number(us.data().points??us.data().coins??us.data().balance??0);if(bal<cost)throw Error("পর্যাপ্ত "+unit()+" নেই।");let aref=doc(collection(db,"advertisements"));tx.set(aref,{title,videoUrl:url,ownerUid:user.uid,createdAt:serverTimestamp(),pointsSpent:cost,status:"active",viewCount:0,clickCount:0});tx.update(uref,{points:bal-cost})});$("adTitle").value="";$("adUrl").value="";$("adStatus").textContent="বিজ্ঞাপন সফলভাবে যুক্ত হয়েছে ✓";await balance();await loadMine()}catch(e){$("adStatus").textContent=e.message}};
window.submitPaymentRequest=async()=>{if(!user)return alert("Payment Request করতে লগইন করুন।");let coins=Number($("requestCoins").value),note=$("paymentNote").value.trim();if(!coins||coins<1)return alert("কত Coin চান তা লিখুন।");try{await addDoc(collection(db,"paymentRequests"),{uid:user.uid,coins,note,status:"pending",createdAt:serverTimestamp()});$("requestCoins").value="";$("paymentNote").value="";$("paymentStatus").textContent="Payment Request পাঠানো হয়েছে ✓"}catch(e){$("paymentStatus").textContent="Request পাঠানো যায়নি: "+e.message}};
load();let initial=new URLSearchParams(location.search).get("v");if(initial)setTimeout(()=>openVideo(initial),400);
</script></body></html>
