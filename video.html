<div id="video-playlist-container" style="max-width:600px; margin:auto; font-family:Roboto, Arial, sans-serif; background:#0f0f0f; color:#fff; padding:10px; border-radius:8px;">
<div style="display:flex; align-items:center; margin-bottom:15px; background:#222; border-radius:20px; padding:5px 15px; border:1px solid #333;">
<svg style="width:18px; height:18px; fill:#aaa; margin-right:10px;" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
<input type="text" id="video-search" placeholder="Search videos..." onkeyup="searchVideos()" style="width:100%; background:transparent; border:none; outline:none; color:#fff; font-size:15px;">
</div>
<div id="video-box" style="position:relative; background:#000; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:12px;">
<iframe id="active-video" src="" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>
<div id="ad-overlay" style="display:none; position:absolute; top:0; left:0; width:100%; padding:8px 12px; background:rgba(0,0,0,0.55); color:#fff; flex-direction:row; justify-content:space-between; align-items:center; z-index:9999; box-sizing:border-box;">
<div style="display:flex; align-items:center; gap:10px;">
  <span style="font-size:12px; background:#333; padding:2px 8px; border-radius:3px;">Ad</span>
  <p id="ad-timer-text" style="font-size:13px; color:#ddd; margin:0;">Ad ends in <span id="cd-time">10</span>s</p>
</div>
<button id="skip-btn" style="display:none; padding:6px 14px; background:#fff; color:#000; border:0; cursor:pointer; font-size:13px; font-weight:bold; border-radius:2px;" onclick="closeAd()">Skip Ad</button>
</div>
</div>

<div id="video-info" style="display:none; margin-top:12px;">
  <h2 id="vi-title" style="font-size:16px; margin:0 0 6px 0; font-weight:600;"></h2>
  <p id="vi-caption" style="font-size:13px; color:#ccc; margin:0 0 10px 0; white-space:pre-wrap;"></p>
  <div style="display:flex; align-items:center; gap:16px; padding:8px 0; border-top:1px solid #222; border-bottom:1px solid #222; font-size:13px; color:#aaa;">
    <span id="vi-views">👁 0</span>
    <button id="vi-like-btn" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:4px;">🤍 <span id="vi-like-count">0</span></button>
    <button id="vi-comment-toggle" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:13px;">💬 <span id="vi-comment-count">0</span></button>
    <button id="vi-share-btn" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:13px;">🔗 Share</button>
    <button id="vi-copy-btn" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:13px;">📋 Copy link</button>
  </div>
  <p id="vi-status" style="font-size:12px; color:#4CAF50; margin:6px 0 0 0; min-height:16px;"></p>

  <div id="vi-comments-section" style="display:none; margin-top:14px;">
    <div id="vi-comment-form" style="display:none; margin-bottom:12px;">
      <textarea id="vi-comment-input" rows="2" placeholder="একটি কমেন্ট লিখুন..." style="width:100%; box-sizing:border-box; padding:8px; border-radius:6px; border:1px solid #333; background:#1a1a1a; color:#fff; resize:vertical; font-size:13px;"></textarea>
      <button id="vi-comment-submit" style="margin-top:6px; background:#4285F4; color:#fff; border:none; padding:7px 16px; border-radius:5px; cursor:pointer; font-size:13px; font-weight:bold;">পোস্ট করুন</button>
    </div>
    <p id="vi-comment-login-note" style="display:none; font-size:12px; color:#888;">কমেন্ট করতে লগইন করুন।</p>
    <div id="vi-comments-list" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>
</div>

<div style="margin-top:20px;">
<h3 style="font-size:16px; margin-bottom:12px; font-weight:500; color:#fff;">Up next</h3>
<ul id="playlist-links" style="list-style:none; padding:0; margin:0;">
<li style="color:#888; font-size:13px;">লোড হচ্ছে...</li>
</ul>
</div>
</div>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
  import {
    getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, setDoc,
    addDoc, deleteDoc, serverTimestamp, increment, onSnapshot
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:d87ae40431210088df8b25",
    measurementId: "G-WJ8N8XLPSZ"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let globalAds = [];
  let adDelayMs = 180000;
  let skipDelaySec = 10;

  let adTimeout, countdownTimer;
  let mainVideoUrl = "";
  let adIndex = 0;
  let videoStartTime = 0;
  let adShownForThisVideo = false;
  let adStartTime = 0;
  let adDurationSoFar = 0;

  let currentUser = null;
  let currentVideoId = null;
  let currentVideoLiked = false;
  let commentsUnsub = null;
  let statsUnsub = null;

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    updateCommentFormVisibility();
    if (currentVideoId) refreshLikeState();
  });

  function extractYouTubeId(url) {
    const m = url.match(/embed\/([a-zA-Z0-9_-]+)/);
    return m ? m[1] : null;
  }

  async function loadPlaylist() {
    const listEl = document.getElementById('playlist-links');
    try {
      const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      if (snap.empty) {
        listEl.innerHTML = '<li style="color:#888; font-size:13px;">\u098f\u0996\u09a8\u09cb \u0995\u09cb\u09a8\u09cb \u09ad\u09bf\u09a1\u09bf\u0993 \u09af\u09cb\u0997 \u0995\u09b0\u09be \u09b9\u09af\u09bc\u09a8\u09bf\u0964</li>';
        return;
      }
      listEl.innerHTML = '';
      let firstId = null;
      snap.forEach((docSnap) => {
        if (!firstId) firstId = docSnap.id;
        const data = docSnap.data();
        const id = docSnap.id;
        const videoUrl = data.videoUrl || '';
        const title = data.title || 'Untitled';
        const channelName = data.channelName || 'Channel Name';
        const ytId = extractYouTubeId(videoUrl);
        const thumbnail = data.thumbnail || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');

        const li = document.createElement('li');
        li.style.marginBottom = '12px';
        li.setAttribute('data-title', title);
        li.innerHTML = `
          <div style="display:flex; cursor:pointer; gap:12px; align-items:center;" data-id="${id}">
            <div style="width:120px; height:68px; background:#222; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden;">
              <img src="${thumbnail}" style="width:100%; height:100%; object-fit:cover;" alt="Thumbnail">
            </div>
            <div style="flex-grow:1; overflow:hidden;">
              <h4 style="font-size:14px; margin:0 0 4px 0; color:#f1f1f1; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${title}</h4>
              <span style="font-size:12px; color:#aaa;">${channelName}</span>
            </div>
          </div>`;
        li.querySelector('[data-id]').addEventListener('click', function () {
          playVideoById(this.getAttribute('data-id'));
        });
        listEl.appendChild(li);
      });

      const params = new URLSearchParams(location.search);
      const vParam = params.get('v');
      if (vParam) {
        playVideoById(vParam);
      } else if (firstId) {
        playVideoById(firstId);
      }
    } catch (e) {
      console.error("\u09aa\u09cd\u09b2\u09c7\u09b2\u09bf\u09b8\u09cd\u099f \u09b2\u09cb\u09a1 \u098f\u09b0\u09b0:", e);
      listEl.innerHTML = '<li style="color:#d9534f; font-size:13px;">\u09ad\u09bf\u09a1\u09bf\u0993 \u09b2\u09cb\u09a1 \u0995\u09b0\u09a4\u09c7 \u09b8\u09ae\u09b8\u09cd\u09af\u09be: ' + (e && e.message ? e.message : String(e)) + '</li>';
    }
  }

  async function loadAdSettings() {
    try {
      const ref = doc(db, "settings", "ads");
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const data = snap.data();
        if (Array.isArray(data.adUrls) && data.adUrls.length > 0) globalAds = data.adUrls;
        if (typeof data.adDelaySeconds === 'number') adDelayMs = data.adDelaySeconds * 1000;
        if (typeof data.skipDelaySeconds === 'number') skipDelaySec = data.skipDelaySeconds;
      }
    } catch (e) {
      console.error("\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09aa\u09a8 \u09b8\u09c7\u099f\u09bf\u0982\u09b8 \u09b2\u09cb\u09a1 \u098f\u09b0\u09b0:", e);
    }
  }

  async function playVideoById(id) {
    try {
      const snap = await getDoc(doc(db, "videos", id));
      if (!snap.exists()) return;
      const data = snap.data();
      currentVideoId = id;
      playVideo(data.videoUrl || '');

      document.getElementById('video-info').style.display = 'block';
      document.getElementById('vi-title').textContent = data.title || '';
      document.getElementById('vi-caption').textContent = data.caption || '';
      document.getElementById('vi-status').textContent = '';

      await bumpViewCount(id);
      subscribeStats(id);
      refreshLikeState();
      subscribeComments(id);
      updateCommentFormVisibility();
    } catch (e) {
      console.error("\u09ad\u09bf\u09a1\u09bf\u0993 \u09b2\u09cb\u09a1 \u098f\u09b0\u09b0:", e);
    }
  }

  function playVideo(url) {
    mainVideoUrl = url;
    videoStartTime = Date.now();
    adShownForThisVideo = false;
    adDurationSoFar = 0;

    document.getElementById('active-video').src = url;
    document.getElementById('ad-overlay').style.display = 'none';

    clearTimeout(adTimeout);
    clearInterval(countdownTimer);
    adTimeout = setTimeout(function () {
      if (!adShownForThisVideo) triggerAd();
    }, adDelayMs);
  }

  async function bumpViewCount(id) {
    try {
      await setDoc(doc(db, "videos", id, "stats", "counts"), {
        viewCount: increment(1)
      }, { merge: true });
    } catch (e) {
      console.error("\u09ad\u09bf\u0989 \u0995\u09be\u0989\u09a8\u09cd\u099f \u098f\u09b0\u09b0:", e);
    }
  }

  function subscribeStats(id) {
    if (statsUnsub) statsUnsub();
    statsUnsub = onSnapshot(doc(db, "videos", id, "stats", "counts"), (snap) => {
      const d = snap.exists() ? snap.data() : {};
      document.getElementById('vi-views').textContent = '\ud83d\udc41 ' + (d.viewCount || 0);
      document.getElementById('vi-like-count').textContent = d.likeCount || 0;
    });
  }

  async function refreshLikeState() {
    const likeBtn = document.getElementById('vi-like-btn');
    if (!currentUser || !currentVideoId) {
      currentVideoLiked = false;
      likeBtn.firstChild.textContent = '\ud83e\udd0d ';
      return;
    }
    try {
      const likeSnap = await getDoc(doc(db, "videos", currentVideoId, "likes", currentUser.uid));
      currentVideoLiked = likeSnap.exists();
      likeBtn.firstChild.textContent = (currentVideoLiked ? '\u2764\ufe0f ' : '\ud83e\udd0d ');
    } catch (e) {
      console.error("\u09b2\u09be\u0987\u0995 \u09b8\u09cd\u099f\u09cd\u09af\u09be\u099f\u09be\u09b8 \u098f\u09b0\u09b0:", e);
    }
  }

  document.getElementById('vi-like-btn').addEventListener('click', async () => {
    if (!currentUser) {
      document.getElementById('vi-status').textContent = '\u09b2\u09be\u0987\u0995 \u09a6\u09bf\u09a4\u09c7 \u09b2\u0997\u0987\u09a8 \u0995\u09b0\u09c1\u09a8\u0964';
      return;
    }
    if (!currentVideoId) return;
    const likeRef = doc(db, "videos", currentVideoId, "likes", currentUser.uid);
    const statsRef = doc(db, "videos", currentVideoId, "stats", "counts");
    try {
      if (currentVideoLiked) {
        await deleteDoc(likeRef);
        await setDoc(statsRef, { likeCount: increment(-1) }, { merge: true });
      } else {
        await setDoc(likeRef, { likedAt: serverTimestamp() });
        await setDoc(statsRef, { likeCount: increment(1) }, { merge: true });
      }
      refreshLikeState();
    } catch (e) {
      console.error("\u09b2\u09be\u0987\u0995 \u098f\u09b0\u09b0:", e);
    }
  });

  function currentVideoPermalink() {
    const url = new URL(location.href);
    url.searchParams.set('v', currentVideoId || '');
    return url.toString();
  }

  document.getElementById('vi-share-btn').addEventListener('click', async () => {
    const link = currentVideoPermalink();
    const title = document.getElementById('vi-title').textContent;
    if (navigator.share) {
      try { await navigator.share({ title, url: link }); } catch (e) {}
    } else {
      await navigator.clipboard.writeText(link);
      document.getElementById('vi-status').textContent = '\u09b2\u09bf\u0982\u0995 \u0995\u09aa\u09bf \u09b9\u09af\u09bc\u09c7\u099b\u09c7 \u2713';
    }
  });

  document.getElementById('vi-copy-btn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(currentVideoPermalink());
      document.getElementById('vi-status').textContent = '\u09b2\u09bf\u0982\u0995 \u0995\u09aa\u09bf \u09b9\u09af\u09bc\u09c7\u099b\u09c7 \u2713';
    } catch (e) {
      document.getElementById('vi-status').textContent = '\u0995\u09aa\u09bf \u0995\u09b0\u09a4\u09c7 \u09b8\u09ae\u09b8\u09cd\u09af\u09be \u09b9\u09af\u09bc\u09c7\u099b\u09c7\u0964';
    }
  });

  document.getElementById('vi-comment-toggle').addEventListener('click', () => {
    const sec = document.getElementById('vi-comments-section');
    sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
  });

  function updateCommentFormVisibility() {
    const formEl = document.getElementById('vi-comment-form');
    const noteEl = document.getElementById('vi-comment-login-note');
    if (currentUser) {
      formEl.style.display = 'block';
      noteEl.style.display = 'none';
    } else {
      formEl.style.display = 'none';
      noteEl.style.display = 'block';
    }
  }

  function subscribeComments(id) {
    if (commentsUnsub) commentsUnsub();
    const q = query(collection(db, "videos", id, "comments"), orderBy("createdAt", "desc"), limit(50));
    commentsUnsub = onSnapshot(q, (snap) => {
      document.getElementById('vi-comment-count').textContent = snap.size;
      const listEl = document.getElementById('vi-comments-list');
      listEl.innerHTML = '';
      snap.forEach((c) => {
        const d = c.data();
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; gap:10px;';
        row.innerHTML = `
          <img src="${d.photoURL || ''}" style="width:32px; height:32px; border-radius:50%; flex-shrink:0; background:#333;" alt="">
          <div>
            <div style="font-size:13px; font-weight:bold;">${d.name || 'User'}</div>
            <div style="font-size:13px; color:#ddd;">${(d.text || '').replace(/</g, '&lt;')}</div>
          </div>`;
        listEl.appendChild(row);
      });
    });
  }

  document.getElementById('vi-comment-submit').addEventListener('click', async () => {
    if (!currentUser || !currentVideoId) return;
    const input = document.getElementById('vi-comment-input');
    const text = input.value.trim();
    if (!text) return;
    try {
      await addDoc(collection(db, "videos", currentVideoId, "comments"), {
        text,
        uid: currentUser.uid,
        name: currentUser.displayName || '',
        photoURL: currentUser.photoURL || '',
        createdAt: serverTimestamp()
      });
      input.value = '';
    } catch (e) {
      console.error("\u0995\u09ae\u09c7\u09a8\u09cd\u099f \u098f\u09b0\u09b0:", e);
    }
  });

  function triggerAd() {
    if (!globalAds || globalAds.length === 0) return;
    adShownForThisVideo = true;
    adStartTime = Date.now();
    document.getElementById('active-video').src = globalAds[adIndex] + "?autoplay=1";
    adIndex = (adIndex + 1) % globalAds.length;

    let adOverlay = document.getElementById('ad-overlay');
    let skipBtn = document.getElementById('skip-btn');
    let timerText = document.getElementById('ad-timer-text');
    adOverlay.style.display = 'flex';
    skipBtn.style.display = 'none';

    let timeLeft = skipDelaySec;
    document.getElementById('cd-time').textContent = timeLeft;
    timerText.innerHTML = 'Ad ends in <span id="cd-time">' + timeLeft + '</span> seconds...';

    clearInterval(countdownTimer);
    countdownTimer = setInterval(function () {
      timeLeft--;
      let timeSpan = document.getElementById('cd-time');
      if (timeSpan) timeSpan.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(countdownTimer);
        timerText.textContent = "Ad finished!";
        skipBtn.style.display = 'block';
      }
    }, 1000);
  }

  window.closeAd = function () {
    document.getElementById('ad-overlay').style.display = 'none';
    let adDurationSeconds = Math.floor((Date.now() - adStartTime) / 1000);
    adDurationSoFar += adDurationSeconds;
    let totalElapsed = Math.floor((Date.now() - videoStartTime) / 1000);
    let videoCurrentTime = totalElapsed - adDurationSoFar;
    let separator = mainVideoUrl.includes('?') ? '&' : '?';
    let resumeUrl = mainVideoUrl + separator + "start=" + videoCurrentTime + "&autoplay=1";
    document.getElementById('active-video').src = resumeUrl;
    document.getElementById('ad-timer-text').innerHTML = 'Ad ends in <span id="cd-time">' + skipDelaySec + '</span> seconds...';
  };

  window.searchVideos = function () {
    let input = document.getElementById('video-search').value.toLowerCase();
    let list = document.getElementById('playlist-links');
    let items = list.getElementsByTagName('li');
    for (let i = 0; i < items.length; i++) {
      let title = (items[i].getAttribute('data-title') || '').toLowerCase();
      items[i].style.display = title.includes(input) ? "" : "none";
    }
  };

  loadAdSettings();
  loadPlaylist();
</script>
