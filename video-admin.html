<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onuvuti Video Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; }
  #loginScreen, #deniedScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  #deniedScreen { display: none; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
  button {
    background: #4285F4; color: #fff; border: none;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  #adminScreen { display: none; }

  header {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 14px 18px; background: #161b22; border-bottom: 1px solid #262c36;
  }
  #logoutBtn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: #262c36; color: #f87171; padding: 6px 14px; border-radius: 14px; font-size: 12px;
  }

  main { padding: 20px 16px; max-width: 640px; margin: 0 auto; }
  .folderTitle { font-size: 18px; font-weight: bold; margin-bottom: 16px; }

  .section { background: #161b22; border: 1px solid #262c36; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .section h2 { font-size: 15px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .row label { width: 110px; font-size: 13px; color: #9ca3af; flex-shrink: 0; }
  input[type="number"], input[type="text"] {
    flex: 1; width: 100%; background: #0d1117; border: 1px solid #30363d; color: #fff;
    padding: 8px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .hint { font-size: 11px; color: #6b7280; margin-top: 4px; margin-bottom: 8px; }

  .sectionSaveBtn { width: 100%; padding: 9px; border-radius: 10px; font-size: 13px; margin-top: 6px; }
  .sectionStatus { text-align: center; font-size: 12px; margin-top: 6px; min-height: 15px; }

  .listCard { background: #161b22; border: 1px solid #262c36; border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
  .listCard .metaRow { display: flex; justify-content: space-between; color: #6b7280; font-size: 11px; margin-bottom: 6px; }
  .listEmpty { text-align: center; color: #6b7280; font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>

  <div id="loginScreen">
    <h1>Onuvuti Video Admin</h1>
    <p>এডমিন অ্যাক্সেসের জন্য লগইন করুন</p>
    <button id="googleLoginBtn">🔵 Google দিয়ে লগইন করুন</button>
  </div>

  <div id="deniedScreen">
    <h1>⛔ প্রবেশাধিকার নেই</h1>
    <p>এই অ্যাকাউন্টটি এডমিন হিসেবে অনুমোদিত নয়।</p>
    <button id="logoutBtn2">লগ আউট</button>
  </div>

  <div id="adminScreen">
    <header>
      <span>🎬 Video Admin Panel</span>
      <button id="logoutBtn">লগ আউট</button>
    </header>

    <main>
      <div class="folderTitle">🎬 ভিডিও</div>

      <div class="section">
        <h2>👤 একাউন্ট</h2>
        <input type="text" id="accountSearch" placeholder="🔍 ইউনিক আইডি (UID) দিয়ে সার্চ করুন..." style="margin-bottom:12px;">
        <div id="accountsList"><div class="listEmpty">লোড হচ্ছে...</div></div>
      </div>

      <div class="section">
        <h2>🪙 কয়েন সেটিংস</h2>
        <div class="row"><label>ইউনিটের নাম</label><input type="text" id="coinUnitName" placeholder="Coin"></div>
        <div class="row"><label>প্রতি ভিডিও আপলোডের খরচ</label><input type="number" id="coinVideoCost" placeholder="100"></div>
        <div class="row"><label>প্রতি বিজ্ঞাপনের খরচ</label><input type="number" id="coinAdCost" placeholder="5"></div>
        <div class="row"><label>বিজ্ঞাপন দেখলে পুরস্কার</label><input type="number" id="coinAdReward" placeholder="1"></div>
        <button class="sectionSaveBtn" id="saveCoinSettingsBtn">💾 সেভ করুন</button>
        <div class="sectionStatus" id="coinSettingsStatus"></div>
      </div>
    </main>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection, getDocs
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:d87ae40431210088df8b25",
    measurementId: "G-WJ8N8XLPSZ"
  };

  const ADMIN_EMAILS = ["hmjunaid9999@gmail.com"];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById('loginScreen');
  const deniedScreen = document.getElementById('deniedScreen');
  const adminScreen = document.getElementById('adminScreen');

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.error(e); alert('লগইন এরর: ' + e.message); }
  });
  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
  document.getElementById('logoutBtn2').addEventListener('click', () => signOut(auth));

  // ---- একাউন্ট ----
  let allAccountsCache = [];

  async function loadAccounts() {
    const listEl = document.getElementById('accountsList');
    listEl.innerHTML = '<div class="listEmpty">লোড হচ্ছে...</div>';
    try {
      const snap = await getDocs(collection(db, "users"));
      allAccountsCache = [];
      snap.forEach(docSnap => allAccountsCache.push({ id: docSnap.id, data: docSnap.data() }));
      renderAccounts(allAccountsCache);
    } catch (e) {
      listEl.innerHTML = '<div class="listEmpty">এরর: ' + e.message + '</div>';
    }
  }

  function renderAccounts(accounts) {
    const listEl = document.getElementById('accountsList');
    if (!accounts.length) { listEl.innerHTML = '<div class="listEmpty">কোনো একাউন্ট পাওয়া যায়নি</div>'; return; }
    listEl.innerHTML = '';
    accounts.forEach(({ id, data }) => {
      const card = document.createElement('div');
      card.className = 'listCard';
      card.innerHTML = `
        <div class="metaRow">
          <span>${(data.name || 'নাম নেই').replace(/</g, '&lt;')}</span>
        </div>
        <div class="hint" style="margin-bottom:8px; word-break:break-all;">UID: ${id}${data.email ? ' • ' + data.email.replace(/</g, '&lt;') : ''}</div>
        <div class="row"><label>বিজ্ঞাপন ব্যালেন্স</label><input type="number" class="adBalanceInput" value="${Number(data.adBalance || 0)}"></div>
        <div class="row"><label>ভিডিও ব্যালেন্স</label><input type="number" class="videoBalanceInput" value="${Number(data.videoBalance || 0)}"></div>
        <button class="sectionSaveBtn saveAccountBtn">💾 সেভ করুন</button>
        <div class="sectionStatus"></div>
      `;
      card.querySelector('.saveAccountBtn').addEventListener('click', async () => {
        const adVal = Number(card.querySelector('.adBalanceInput').value) || 0;
        const videoVal = Number(card.querySelector('.videoBalanceInput').value) || 0;
        const statusEl = card.querySelector('.sectionStatus');
        try {
          await setDoc(doc(db, "users", id), { adBalance: adVal, videoBalance: videoVal }, { merge: true });
          statusEl.style.color = '#4ade80';
          statusEl.textContent = '✅ সেভ হয়েছে!';
          setTimeout(() => { statusEl.textContent = ''; }, 2000);
        } catch (e) {
          statusEl.style.color = '#f87171';
          statusEl.textContent = 'এরর: ' + e.message;
        }
      });
      listEl.appendChild(card);
    });
  }

  document.getElementById('accountSearch').addEventListener('input', (e) => {
    const term = e.target.value.trim().toLowerCase();
    const filtered = term ? allAccountsCache.filter(a => a.id.toLowerCase().includes(term)) : allAccountsCache;
    renderAccounts(filtered);
  });

  // ---- কয়েন সেটিংস ----
  async function loadCoinSettings() {
    const statusEl = document.getElementById('coinSettingsStatus');
    try {
      const snap = await getDoc(doc(db, "settings", "video"));
      const d = snap.exists() ? snap.data() : {};
      document.getElementById('coinUnitName').value = d.unitName || 'Coin';
      document.getElementById('coinVideoCost').value = (typeof d.videoCost === 'number') ? d.videoCost : 100;
      document.getElementById('coinAdCost').value = (typeof d.adCost === 'number') ? d.adCost : 5;
      document.getElementById('coinAdReward').value = (typeof d.adRewardCoins === 'number') ? d.adRewardCoins : 1;
    } catch (e) {
      statusEl.style.color = '#f87171';
      statusEl.textContent = 'লোড এরর: ' + e.message;
    }
  }

  document.getElementById('saveCoinSettingsBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('coinSettingsStatus');
    const unitName = document.getElementById('coinUnitName').value.trim() || 'Coin';
    const videoCost = Number(document.getElementById('coinVideoCost').value) || 0;
    const adCost = Number(document.getElementById('coinAdCost').value) || 0;
    const adRewardCoins = Number(document.getElementById('coinAdReward').value) || 0;
    try {
      await setDoc(doc(db, "settings", "video"), { unitName, videoCost, adCost, adRewardCoins }, { merge: true });
      statusEl.style.color = '#4ade80';
      statusEl.textContent = '✅ সেভ হয়েছে!';
      setTimeout(() => { statusEl.textContent = ''; }, 2000);
    } catch (e) {
      statusEl.style.color = '#f87171';
      statusEl.textContent = 'এরর: ' + e.message;
    }
  });

  onAuthStateChanged(auth, (user) => {
    loginScreen.style.display = 'none';
    deniedScreen.style.display = 'none';
    adminScreen.style.display = 'none';

    if (!user) {
      loginScreen.style.display = 'flex';
    } else if (ADMIN_EMAILS.includes(user.email)) {
      adminScreen.style.display = 'block';
      loadAccounts();
      loadCoinSettings();
    } else {
      deniedScreen.style.display = 'flex';
    }
  });
</script>
</body>
</html>
