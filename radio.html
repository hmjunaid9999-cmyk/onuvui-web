<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেডিও — Onuvuti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; }
  header {
    position: relative; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: #161b22; border-bottom: 1px solid #262c36;
  }
  header h1 { font-size: 18px; font-weight: bold; }
  #backBtn, #playerBackBtn {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    background: #21262d; color: #fff; width: 36px; height: 36px; border-radius: 50%;
    text-decoration: none; font-size: 16px; display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer;
  }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .radioChannelList { display: flex; flex-direction: column; gap: 10px; }
  .radioChannelBtn {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: #161b22; border: 1px solid #262c36; color: #fff;
    padding: 14px; border-radius: 14px; font-size: 14px; cursor: pointer;
  }
  .radioChannelBtn.playing { border-color: #4285F4; color: #4285F4; }
  .emptyMsg { text-align: center; color: #6b7280; font-size: 13px; padding: 40px 16px; }

  /* --- player (new page) view --- */
  #playerView { display: none; }
  .playerCard {
    background: #161b22; border: 1px solid #262c36; border-radius: 16px;
    padding: 28px 20px; text-align: center;
  }
  .playerChannelName { font-size: 17px; font-weight: bold; margin-bottom: 4px; }
  .playerStatus { font-size: 12px; color: #6b7280; margin-bottom: 20px; min-height: 16px; }
  .playPauseBig {
    width: 76px; height: 76px; border-radius: 50%; background: #4285F4; color: #fff;
    font-size: 30px; border: none; display: flex; align-items: center; justify-content: center;
    margin: 0 auto; cursor: pointer;
  }
  .visualizer {
    display: flex; align-items: flex-end; justify-content: center; gap: 4px;
    height: 46px; margin-top: 22px;
  }
  .visualizer span {
    width: 5px; border-radius: 3px; background: #4285F4; opacity: 0.85;
    animation: bar 1s ease-in-out infinite;
  }
  .visualizer span:nth-child(1) { height: 14px; animation-delay: 0s; }
  .visualizer span:nth-child(2) { height: 30px; animation-delay: 0.15s; }
  .visualizer span:nth-child(3) { height: 44px; animation-delay: 0.3s; }
  .visualizer span:nth-child(4) { height: 22px; animation-delay: 0.45s; }
  .visualizer span:nth-child(5) { height: 36px; animation-delay: 0.6s; }
  .visualizer.paused span { animation-play-state: paused; opacity: 0.35; }
  @keyframes bar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* --- ad slot (renders admin-provided ad code) --- */
  #adSlot { margin-top: 18px; display: none; }
  .adLabel { font-size: 11px; color: #6b7280; margin-bottom: 6px; text-align: center; }
  #adInner { border-radius: 12px; overflow: hidden; }
  #adInner img, #adInner video, #adInner iframe { width: 100%; display: block; border: 0; border-radius: 12px; }

  /* --- debug panel --- */
  .debugBox {
    margin-top: 18px; background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 12px; font-size: 12px; line-height: 1.7; color: #9ca3af;
    white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
  }
  .debugBox b { color: #fff; }
  .debugBox .err { color: #f87171; }
  .debugBox .ok { color: #4ade80; }
  .debugTitle { font-size: 12px; color: #6b7280; margin: 18px 0 6px; }
</style>
</head>
<body>

  <header>
    <a href="index.html" id="backBtn" title="ফিরে যান">←</a>
    <button id="playerBackBtn" title="তালিকায় ফিরে যান" style="display:none;">←</button>
    <h1 id="headerTitle">📻 রেডিও</h1>
  </header>

  <main>
    <div id="listView">
      <div id="channelList"></div>
    </div>

    <div id="playerView">
      <div class="playerCard">
        <div class="playerChannelName" id="playerChannelName"></div>
        <div class="playerStatus" id="playerStatus">লোড হচ্ছে…</div>
        <button type="button" id="playPauseBtn" class="playPauseBig">⏸️</button>
        <div class="visualizer" id="visualizer">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div id="adSlot">
        <div class="adLabel">বিজ্ঞাপন</div>
        <div id="adInner"></div>
      </div>
    </div>

    <div class="debugTitle">🔧 ডিবাগ লগ (সমস্যা হলে এখানে দেখুন)</div>
    <div id="debugBox" class="debugBox">এখনো কিছু চালানো হয়নি।</div>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  // মূল সাইটের (index.html) মতোই ফায়ারবেজ কনফিগ — একই প্রজেক্ট, একই ডাটা
  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:538c47101eade3e2df8b25",
    measurementId: "G-2K2L45CMWR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const listView = document.getElementById('listView');
  const playerView = document.getElementById('playerView');
  const channelList = document.getElementById('channelList');
  const debugBox = document.getElementById('debugBox');
  const headerTitle = document.getElementById('headerTitle');
  const backBtn = document.getElementById('backBtn');
  const playerBackBtn = document.getElementById('playerBackBtn');
  const playerChannelName = document.getElementById('playerChannelName');
  const playerStatus = document.getElementById('playerStatus');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const visualizer = document.getElementById('visualizer');
  const adSlot = document.getElementById('adSlot');
  const adInner = document.getElementById('adInner');

  let channels = [];
  let adCodes = [];
  let adIndex = -1; // পরের বার কোন বিজ্ঞাপন দেখানো হবে তার হিসাব (পালা করে)
  let currentAudio = null;
  let currentIndex = -1;
  let playerHistoryPushed = false; // প্লেয়ার-ভিউর জন্য history-তে একটা এক্সট্রা এন্ট্রি রাখা হয়েছে কিনা

  // MediaError.code সংখ্যাকে মানুষ-পড়ার-মতো বার্তায় রূপান্তর
  const MEDIA_ERROR_MESSAGES = {
    1: 'MEDIA_ERR_ABORTED — লোড হওয়ার মাঝপথে থামানো হয়েছে',
    2: 'MEDIA_ERR_NETWORK — নেটওয়ার্ক এরর (লিংকে পৌঁছানো যায়নি, সার্ভার বন্ধ, অথবা HTTPS সাইট থেকে HTTP লিংক ব্লক হয়েছে — Mixed Content)',
    3: 'MEDIA_ERR_DECODE — ফাইল/স্ট্রিম ডিকোড করা যাচ্ছে না (ফরম্যাট সাপোর্টেড না বা করাপ্টেড)',
    4: 'MEDIA_ERR_SRC_NOT_SUPPORTED — এই সোর্স/ফরম্যাট ব্রাউজার সাপোর্ট করে না, অথবা লিংকটা ভুল/৪০৪'
  };

  function log(msg, cls) {
    const time = new Date().toLocaleTimeString('bn-BD');
    const line = document.createElement('div');
    line.innerHTML = '[' + time + '] ' + (cls ? '<span class="' + cls + '">' + msg + '</span>' : msg);
    if (debugBox.textContent.trim() === 'এখনো কিছু চালানো হয়নি।') debugBox.innerHTML = '';
    debugBox.appendChild(line);
    debugBox.scrollTop = debugBox.scrollHeight;
  }

  function escapeHtml(str) {
    return (str || '').replace(/</g, '&lt;');
  }

  // এডমিনের দেওয়া কাঁচা HTML/JS বিজ্ঞাপন কোড ইনজেক্ট করে — <script> ট্যাগগুলোও রি-এক্সিকিউট করে,
  // কারণ innerHTML দিয়ে বসালে স্ক্রিপ্ট নিজে থেকে চলে না।
  function injectAd(container, code) {
    container.innerHTML = '';
    if (!code || !code.trim()) { adSlot.style.display = 'none'; return; }
    adSlot.style.display = 'block';
    const temp = document.createElement('div');
    temp.innerHTML = code;
    temp.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      [...oldScript.attributes].forEach(attr => newScript.setAttribute(attr.name, attr.value));
      newScript.textContent = oldScript.textContent;
      oldScript.replaceWith(newScript);
    });
    Array.from(temp.childNodes).forEach(node => container.appendChild(node));
  }

  // চ্যানেল চালু/পরিবর্তনের প্রতিবার পালা করে (রোটেশনে) পরের বিজ্ঞাপন কোডটা দেখানো
  function showAd() {
    if (!adCodes.length) { hideAd(); return; }
    adIndex = (adIndex + 1) % adCodes.length;
    injectAd(adInner, adCodes[adIndex]);
  }

  function hideAd() {
    adInner.innerHTML = '';
    adSlot.style.display = 'none';
  }

  function renderList() {
    if (!channels.length) {
      channelList.innerHTML = '<div class="emptyMsg">এখনো কোনো রেডিও চ্যানেল যুক্ত করা হয়নি</div>';
      return;
    }
    channelList.innerHTML =
      '<div class="radioChannelList">' +
      channels.map((ch, i) =>
        '<button type="button" class="radioChannelBtn' + (i === currentIndex ? ' playing' : '') + '" data-idx="' + i + '">' +
        '▶️ ' + escapeHtml(ch.name || ('চ্যানেল ' + (i + 1))) +
        '</button>'
      ).join('') +
      '</div>';
    channelList.querySelectorAll('.radioChannelBtn').forEach(btn => {
      btn.addEventListener('click', () => openChannel(Number(btn.dataset.idx)));
    });
  }

  // চ্যানেল লিস্ট থেকে "নতুন পেজ" এর মতো প্লেয়ার-ভিউ তে চলে যাওয়া
  function showPlayerView(ch) {
    listView.style.display = 'none';
    playerView.style.display = 'block';
    backBtn.style.display = 'none';
    playerBackBtn.style.display = 'flex';
    headerTitle.textContent = '📻 ' + (ch.name || 'রেডিও');
    playerChannelName.textContent = ch.name || '';
  }

  function showListView() {
    playerView.style.display = 'none';
    listView.style.display = 'block';
    playerBackBtn.style.display = 'none';
    backBtn.style.display = 'flex';
    headerTitle.textContent = '📻 রেডিও';
  }

  function stopPlayback() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    currentIndex = -1;
    hideAd();
    renderList();
  }

  // তালিকায় ফিরে যাওয়ার একমাত্র জায়গা — ব্যাক বাটন চাপা হোক বা ফোনের/ব্রাউজারের
  // ব্যাক বাটন/জেসচার চাপা হোক, দুটোই একই পথে যায় যাতে সাইট থেকে বের হয়ে না যায়
  function goBackToList() {
    if (playerHistoryPushed) {
      history.back(); // এতে popstate ইভেন্ট চলবে, যেটা আসলে তালিকায় ফিরিয়ে নেবে
    } else {
      stopPlayback();
      showListView();
    }
  }

  playerBackBtn.addEventListener('click', goBackToList);

  // ফোনের/ব্রাউজারের ব্যাক বাটন বা ব্যাক-জেসচার চাপলে — প্লেয়ার-ভিউতে থাকলে
  // সরাসরি সাইট থেকে বের না করে আগে তালিকায় ফিরিয়ে আনা
  window.addEventListener('popstate', (e) => {
    const view = e.state && e.state.radioView;
    if (view !== 'player') {
      playerHistoryPushed = false;
      stopPlayback();
      showListView();
    }
  });

  playPauseBtn.addEventListener('click', () => {
    if (!currentAudio) return;
    if (currentAudio.paused) {
      currentAudio.play().catch(() => {});
    } else {
      currentAudio.pause();
    }
  });

  function setPlayingUi(isPlaying) {
    playPauseBtn.textContent = isPlaying ? '⏸️' : '▶️';
    visualizer.classList.toggle('paused', !isPlaying);
  }

  // চ্যানেলে ক্লিক করলেই "নতুন পেজ" (প্লেয়ার-ভিউ) খোলে, নিচে ভিজ্যুয়ালাইজার/অডিও আর প্রতিবার বিজ্ঞাপন দেখানো হয়
  function openChannel(idx) {
    const ch = channels[idx];
    if (!ch || !ch.url) return;

    if (currentAudio) { currentAudio.pause(); currentAudio = null; }

    currentIndex = idx;
    showPlayerView(ch);
    playerStatus.textContent = 'লোড হচ্ছে…';
    setPlayingUi(true);

    // চ্যানেল খোলার সাথে সাথে history-তে একটা "player" স্টেট রাখা হয়, যাতে
    // ফোনের ব্যাক বাটন চাপলে প্রথমে তালিকায় ফেরে, সরাসরি সাইট থেকে বের না হয়ে যায়
    if (!playerHistoryPushed) {
      history.pushState({ radioView: 'player' }, '', location.href);
      playerHistoryPushed = true;
    } else {
      history.replaceState({ radioView: 'player' }, '', location.href);
    }

    log('▶️ চেষ্টা করা হচ্ছে: <b>' + escapeHtml(ch.name) + '</b><br>লিংক: ' + escapeHtml(ch.url));

    // পেজ https কিনা আর লিংক http কিনা — সেটা আগেই চেক করে জানিয়ে দেওয়া
    if (location.protocol === 'https:' && ch.url.trim().toLowerCase().startsWith('http://')) {
      log('⚠️ সতর্কতা: এই পেজ HTTPS দিয়ে চলছে কিন্তু লিংকটা HTTP (নিরাপদ না)। ব্রাউজার এটা ব্লক করে দিতে পারে (Mixed Content)।', 'err');
    }

    currentAudio = new Audio(ch.url);

    currentAudio.addEventListener('loadstart', () => log('… লোড শুরু হয়েছে'));
    currentAudio.addEventListener('canplay', () => { log('✅ স্ট্রিম রেডি, বাজানো যাচ্ছে', 'ok'); playerStatus.textContent = 'লাইভ শোনা যাচ্ছে'; });
    currentAudio.addEventListener('playing', () => { log('🔊 আসলেই বাজছে এখন', 'ok'); setPlayingUi(true); });
    currentAudio.addEventListener('pause', () => setPlayingUi(false));
    currentAudio.addEventListener('stalled', () => log('⚠️ ডেটা আসা থেমে গেছে (stalled) — নেটওয়ার্ক বা সার্ভারের সমস্যা হতে পারে', 'err'));
    currentAudio.addEventListener('ended', () => { log('স্ট্রিম শেষ হয়ে গেছে'); goBackToList(); });

    currentAudio.addEventListener('error', () => {
      const mediaErr = currentAudio.error;
      const code = mediaErr ? mediaErr.code : null;
      const detail = code && MEDIA_ERROR_MESSAGES[code] ? MEDIA_ERROR_MESSAGES[code] : 'অজানা এরর';
      log('❌ এরর কোড ' + code + ': ' + detail, 'err');
      playerStatus.textContent = 'চালানো যাচ্ছে না';
      setPlayingUi(false);
    });

    currentAudio.play()
      .then(() => log('play() সফল হয়েছে (ব্রাউজার আটকায়নি)', 'ok'))
      .catch((e) => {
        log('❌ play() রিজেক্ট হয়েছে: ' + e.name + ' — ' + e.message, 'err');
        playerStatus.textContent = 'চালানো যাচ্ছে না — নিচের প্লে বাটনে চাপুন';
        setPlayingUi(false);
      });

    showAd(); // চ্যানেল ক্লিক করা মাত্রই নতুন বিজ্ঞাপন
    renderList();
  }

  // পেজ প্রথম লোড হওয়ার সময় বর্তমান history এন্ট্রিটাকে "list" হিসেবে চিহ্নিত করা
  history.replaceState({ radioView: 'list' }, '', location.href);

  onSnapshot(doc(db, "settings", "radio"), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    channels = data.channels || [];
    adCodes = data.adCodes || [];
    renderList();
  }, (err) => {
    log('❌ Firestore থেকে চ্যানেল লিস্ট আনতে সমস্যা: ' + err.message, 'err');
  });
</script>
</body>
</html>
