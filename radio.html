<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেডিও — Onuvuti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; }
  header {
    position: relative; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: #161b22; border-bottom: 1px solid #262c36;
  }
  header h1 { font-size: 18px; font-weight: bold; }
  #backBtn {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    background: #21262d; color: #fff; width: 36px; height: 36px; border-radius: 50%;
    text-decoration: none; font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .radioChannelList { display: flex; flex-direction: column; gap: 10px; }
  .radioChannelRow {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: #161b22; border: 1px solid #262c36; border-radius: 14px; padding: 6px;
  }
  .radioChannelRow.playing { border-color: #4285F4; }
  .radioChannelBtn {
    display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-align: left;
    background: transparent; border: none; color: #fff;
    padding: 8px; font-size: 14px; cursor: pointer;
  }
  .radioChannelRow.playing .radioChannelBtn { color: #4285F4; }
  .emptyMsg { text-align: center; color: #6b7280; font-size: 13px; padding: 40px 16px; }

  .recordBtn {
    flex-shrink: 0; background: #21262d; color: #fff; border: none;
    padding: 8px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
  }
  .recordBtn.recording { background: #f87171; color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* --- debug panel --- */
  .debugBox {
    margin-top: 18px; background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 12px; font-size: 12px; line-height: 1.7; color: #9ca3af;
    white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
  }
  .debugBox b { color: #fff; }
  .debugBox .err { color: #f87171; }
  .debugBox .ok { color: #4ade80; }
  .debugTitle { font-size: 12px; color: #6b7280; margin: 18px 0 6px; }
</style>
</head>
<body>

  <header>
    <a href="index.html" id="backBtn" title="ফিরে যান">←</a>
    <h1>📻 রেডিও</h1>
  </header>

  <main>
    <div id="channelList"></div>
    <div class="debugTitle">🔧 ডিবাগ লগ (সমস্যা হলে এখানে দেখুন)</div>
    <div id="debugBox" class="debugBox">এখনো কিছু চালানো হয়নি।</div>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  // মূল সাইটের (index.html) মতোই ফায়ারবেজ কনফিগ — একই প্রজেক্ট, একই ডাটা
  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:538c47101eade3e2df8b25",
    measurementId: "G-2K2L45CMWR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const channelList = document.getElementById('channelList');
  const debugBox = document.getElementById('debugBox');
  let channels = [];
  let currentAudio = null;
  let currentIndex = -1;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  // MediaError.code সংখ্যাকে মানুষ-পড়ার-মতো বার্তায় রূপান্তর
  const MEDIA_ERROR_MESSAGES = {
    1: 'MEDIA_ERR_ABORTED — লোড হওয়ার মাঝপথে থামানো হয়েছে',
    2: 'MEDIA_ERR_NETWORK — নেটওয়ার্ক এরর (লিংকে পৌঁছানো যায়নি, সার্ভার বন্ধ, অথবা HTTPS সাইট থেকে HTTP লিংক ব্লক হয়েছে — Mixed Content)',
    3: 'MEDIA_ERR_DECODE — ফাইল/স্ট্রিম ডিকোড করা যাচ্ছে না (ফরম্যাট সাপোর্টেড না বা করাপ্টেড)',
    4: 'MEDIA_ERR_SRC_NOT_SUPPORTED — এই সোর্স/ফরম্যাট ব্রাউজার সাপোর্ট করে না, অথবা লিংকটা ভুল/৪০৪'
  };

  function log(msg, cls) {
    const time = new Date().toLocaleTimeString('bn-BD');
    const line = document.createElement('div');
    line.innerHTML = '[' + time + '] ' + (cls ? '<span class="' + cls + '">' + msg + '</span>' : msg);
    if (debugBox.textContent.trim() === 'এখনো কিছু চালানো হয়নি।') debugBox.innerHTML = '';
    debugBox.appendChild(line);
    debugBox.scrollTop = debugBox.scrollHeight;
  }

  function escapeHtml(str) {
    return (str || '').replace(/</g, '&lt;');
  }

  function render() {
    if (!channels.length) {
      channelList.innerHTML = '<div class="emptyMsg">এখনো কোনো রেডিও চ্যানেল যুক্ত করা হয়নি</div>';
      return;
    }
    channelList.innerHTML =
      '<div class="radioChannelList">' +
      channels.map((ch, i) => {
        const playing = i === currentIndex;
        const recBtnLabel = (playing && isRecording) ? '⏹ থামান ও ডাউনলোড' : '⏺ রেকর্ড';
        const recBtnClass = (playing && isRecording) ? 'recordBtn recording' : 'recordBtn';
        return (
          '<div class="radioChannelRow' + (playing ? ' playing' : '') + '">' +
          '<button type="button" class="radioChannelBtn" data-idx="' + i + '">' +
          (playing ? '⏸️' : '▶️') + ' ' + escapeHtml(ch.name || ('চ্যানেল ' + (i + 1))) +
          '</button>' +
          (playing ? '<button type="button" class="' + recBtnClass + '" data-recidx="' + i + '">' + recBtnLabel + '</button>' : '') +
          '</div>'
        );
      }).join('') +
      '</div>';
    channelList.querySelectorAll('.radioChannelBtn').forEach(btn => {
      btn.addEventListener('click', () => toggle(Number(btn.dataset.idx)));
    });
    channelList.querySelectorAll('.recordBtn').forEach(btn => {
      btn.addEventListener('click', () => toggleRecording());
    });
  }

  function toggle(idx) {
    const ch = channels[idx];
    if (!ch || !ch.url) return;

    if (currentIndex === idx) {
      if (isRecording) stopRecording(true);
      if (currentAudio) currentAudio.pause();
      log('⏸️ থামানো হয়েছে: <b>' + escapeHtml(ch.name) + '</b>');
      currentIndex = -1;
      render();
      return;
    }

    if (isRecording) stopRecording(true);
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }

    log('▶️ চেষ্টা করা হচ্ছে: <b>' + escapeHtml(ch.name) + '</b><br>লিংক: ' + escapeHtml(ch.url));

    // পেজ https কিনা আর লিংক http কিনা — সেটা আগেই চেক করে জানিয়ে দেওয়া
    if (location.protocol === 'https:' && ch.url.trim().toLowerCase().startsWith('http://')) {
      log('⚠️ সতর্কতা: এই পেজ HTTPS দিয়ে চলছে কিন্তু লিংকটা HTTP (নিরাপদ না)। ব্রাউজার এটা ব্লক করে দিতে পারে (Mixed Content)।', 'err');
    }

    currentAudio = new Audio();
    currentAudio.crossOrigin = 'anonymous'; // রেকর্ডিং কাজ করার জন্য চেষ্টা — সার্ভার অনুমতি না দিলে কাজ নাও করতে পারে
    currentAudio.src = ch.url;
    currentIndex = idx;

    currentAudio.addEventListener('loadstart', () => log('… লোড শুরু হয়েছে'));
    currentAudio.addEventListener('canplay', () => log('✅ স্ট্রিম রেডি, বাজানো যাচ্ছে', 'ok'));
    currentAudio.addEventListener('playing', () => log('🔊 আসলেই বাজছে এখন', 'ok'));
    currentAudio.addEventListener('stalled', () => log('⚠️ ডেটা আসা থেমে গেছে (stalled) — নেটওয়ার্ক বা সার্ভারের সমস্যা হতে পারে', 'err'));
    currentAudio.addEventListener('ended', () => { log('স্ট্রিম শেষ হয়ে গেছে'); currentIndex = -1; render(); });

    currentAudio.addEventListener('error', () => {
      const mediaErr = currentAudio.error;
      const code = mediaErr ? mediaErr.code : null;
      const detail = code && MEDIA_ERROR_MESSAGES[code] ? MEDIA_ERROR_MESSAGES[code] : 'অজানা এরর';
      log('❌ এরর কোড ' + code + ': ' + detail, 'err');
      currentIndex = -1;
      render();
    });

    currentAudio.play()
      .then(() => log('play() সফল হয়েছে (ব্রাউজার আটকায়নি)', 'ok'))
      .catch((e) => {
        log('❌ play() রিজেক্ট হয়েছে: ' + e.name + ' — ' + e.message, 'err');
        currentIndex = -1;
        render();
      });

    render();
  }

  function toggleRecording() {
    if (isRecording) {
      stopRecording(false);
    } else {
      startRecording();
    }
  }

  function startRecording() {
    if (!currentAudio || currentIndex === -1) return;
    if (typeof currentAudio.captureStream !== 'function' && typeof currentAudio.mozCaptureStream !== 'function') {
      log('❌ এই ব্রাউজার রেকর্ডিং সাপোর্ট করে না (captureStream পাওয়া যায়নি)।', 'err');
      return;
    }
    try {
      const stream = currentAudio.captureStream ? currentAudio.captureStream() : currentAudio.mozCaptureStream();
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onerror = (e) => {
        log('❌ রেকর্ডিং এরর: ' + (e.error ? e.error.name + ' — ' + e.error.message : 'অজানা') + '। সম্ভবত স্ট্রিম সার্ভার CORS অনুমতি দেয়নি।', 'err');
      };
      mediaRecorder.start();
      isRecording = true;
      log('⏺️ রেকর্ডিং শুরু হয়েছে: <b>' + escapeHtml(channels[currentIndex].name) + '</b>');
      render();
    } catch (e) {
      log('❌ রেকর্ডিং শুরু করা যায়নি: ' + e.name + ' — ' + e.message + '। সম্ভবত এই স্ট্রিম সার্ভার ক্রস-অরিজিন (CORS) অনুমতি দেয়নি, তাই রেকর্ড করা সম্ভব না।', 'err');
      isRecording = false;
      render();
    }
  }

  function stopRecording(silent) {
    if (!mediaRecorder) { isRecording = false; return; }
    const chName = (currentIndex !== -1 && channels[currentIndex]) ? channels[currentIndex].name : 'radio';
    mediaRecorder.onstop = () => {
      isRecording = false;
      if (!recordedChunks.length) {
        log('❌ কোনো অডিও ডেটা রেকর্ড হয়নি — সম্ভবত স্ট্রিম সার্ভার CORS অনুমতি দেয়নি (ফাঁকা ফাইল হতো তাই ডাউনলোড করা হলো না)।', 'err');
        render();
        return;
      }
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      a.href = url;
      a.download = (chName || 'radio').replace(/[^\w\u0980-\u09FF-]+/g, '_') + '-' + stamp + '.webm';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      if (!silent) log('✅ রেকর্ডিং থামানো হয়েছে, ফাইল ডাউনলোড শুরু হয়েছে (.webm ফরম্যাট)।', 'ok');
      else log('ℹ️ চ্যানেল পরিবর্তনের কারণে রেকর্ডিং স্বয়ংক্রিয়ভাবে থামিয়ে ডাউনলোড করা হয়েছে।', 'ok');
      render();
    };
    try { mediaRecorder.stop(); } catch (e) { isRecording = false; }
  }

  onSnapshot(doc(db, "settings", "radio"), (snap) => {
    channels = snap.exists() ? (snap.data().channels || []) : [];
    render();
  }, (err) => {
    log('❌ Firestore থেকে চ্যানেল লিস্ট আনতে সমস্যা: ' + err.message, 'err');
  });
</script>
</body>
</html>
