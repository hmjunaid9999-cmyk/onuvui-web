<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onuvuti Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; }
  #loginScreen, #deniedScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  #deniedScreen { display: none; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
  button {
    background: #4285F4; color: #fff; border: none;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  #adminScreen { display: none; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: #161b22; border-bottom: 1px solid #262c36;
  }
  #logoutBtn { background: #262c36; color: #f87171; padding: 8px 16px; border-radius: 16px; font-size: 13px; }
  main { padding: 20px 16px; max-width: 640px; margin: 0 auto; }

  .section { background: #161b22; border: 1px solid #262c36; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .section h2 { font-size: 15px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .row label { width: 130px; font-size: 13px; color: #9ca3af; flex-shrink: 0; }
  .row input[type="color"] { width: 44px; height: 32px; border: none; border-radius: 6px; background: none; }
  .row input[type="number"], .row input[type="text"], textarea {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff;
    padding: 8px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  textarea { width: 100%; resize: vertical; min-height: 80px; margin-top: 4px; }
  .hint { font-size: 11px; color: #6b7280; margin-top: 4px; }
  #saveBtn { width: 100%; padding: 10px; border-radius: 10px; font-size: 14px; margin-top: 6px; }
  #saveStatus { text-align: center; font-size: 13px; margin-top: 10px; color: #4ade80; min-height: 16px; }
</style>
</head>
<body>

  <div id="loginScreen">
    <h1>Onuvuti Admin Panel</h1>
    <p>এডমিন অ্যাক্সেসের জন্য লগইন করুন</p>
    <button id="googleLoginBtn">🔵 Google দিয়ে লগইন করুন</button>
  </div>

  <div id="deniedScreen">
    <h1>⛔ প্রবেশাধিকার নেই</h1>
    <p>এই অ্যাকাউন্টটি এডমিন হিসেবে অনুমোদিত নয়।</p>
    <button id="logoutBtn2">লগ আউট</button>
  </div>

  <div id="adminScreen">
    <header>
      <span>🛠️ Site Design Admin</span>
      <button id="logoutBtn">লগ আউট</button>
    </header>
    <main>

      <div class="section">
        <h2>🎨 রং</h2>
        <div class="row"><label>Primary (বাটন/মেনু)</label><input type="color" id="primaryColor"></div>
        <div class="row"><label>Background</label><input type="color" id="bgColor"></div>
        <div class="row"><label>Card রং</label><input type="color" id="cardColor"></div>
        <div class="row"><label>টেক্সট রং</label><input type="color" id="textColor"></div>
      </div>

      <div class="section">
        <h2>📏 মার্জিন / প্রস্থ</h2>
        <div class="row"><label>Max width (px)</label><input type="number" id="maxWidth" placeholder="640"></div>
        <div class="hint">সাইটের মূল কনটেন্ট কতটা চওড়া হবে</div>
      </div>

      <div class="section">
        <h2>📋 মেনু বার</h2>
        <textarea id="menuItems" placeholder="হোম|https://example.com&#10;আমাদের সম্পর্কে|https://example.com/about"></textarea>
        <div class="hint">প্রতি লাইনে একটা মেনু আইটেম, ফরম্যাট: নাম|লিংক</div>
      </div>

      <div class="section">
        <h2>📌 সাইডবার</h2>
        <textarea id="sidebarText" placeholder="সাইডবারে যা লেখা দেখাবে..."></textarea>
      </div>

      <div class="section">
        <h2>⬇️ ফুটার</h2>
        <textarea id="footerText" placeholder="ফুটারে যা লেখা দেখাবে..."></textarea>
      </div>

      <button id="saveBtn">💾 সেভ করুন</button>
      <div id="saveStatus"></div>
    </main>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:d87ae40431210088df8b25",
    measurementId: "G-WJ8N8XLPSZ"
  };

  const ADMIN_EMAILS = ["hmjunaid9999@gmail.com"];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById('loginScreen');
  const deniedScreen = document.getElementById('deniedScreen');
  const adminScreen = document.getElementById('adminScreen');

  const primaryColor = document.getElementById('primaryColor');
  const bgColor = document.getElementById('bgColor');
  const cardColor = document.getElementById('cardColor');
  const textColor = document.getElementById('textColor');
  const maxWidth = document.getElementById('maxWidth');
  const menuItems = document.getElementById('menuItems');
  const sidebarText = document.getElementById('sidebarText');
  const footerText = document.getElementById('footerText');
  const saveStatus = document.getElementById('saveStatus');

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.error(e); alert('লগইন এরর: ' + e.message); }
  });
  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
  document.getElementById('logoutBtn2').addEventListener('click', () => signOut(auth));

  async function loadSettings() {
    const snap = await getDoc(doc(db, "settings", "site"));
    const s = snap.exists() ? snap.data() : {};
    primaryColor.value = s.primaryColor || '#4285F4';
    bgColor.value = s.bgColor || '#0d1117';
    cardColor.value = s.cardColor || '#161b22';
    textColor.value = s.textColor || '#ffffff';
    maxWidth.value = s.maxWidth || 640;
    menuItems.value = (s.menuItems || []).map(m => m.label + '|' + m.url).join('\n');
    sidebarText.value = s.sidebarText || '';
    footerText.value = s.footerText || '';
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const parsedMenu = menuItems.value.split('\n')
      .map(line => line.trim())
      .filter(Boolean)
      .map(line => {
        const [label, url] = line.split('|');
        return { label: (label || '').trim(), url: (url || '#').trim() };
      });

    const data = {
      primaryColor: primaryColor.value,
      bgColor: bgColor.value,
      cardColor: cardColor.value,
      textColor: textColor.value,
      maxWidth: Number(maxWidth.value) || 640,
      menuItems: parsedMenu,
      sidebarText: sidebarText.value,
      footerText: footerText.value
    };

    try {
      await setDoc(doc(db, "settings", "site"), data, { merge: true });
      saveStatus.textContent = '✅ সেভ হয়েছে!';
      setTimeout(() => { saveStatus.textContent = ''; }, 2500);
    } catch (e) {
      console.error(e);
      saveStatus.style.color = '#f87171';
      saveStatus.textContent = 'এরর: ' + e.message;
    }
  });

  onAuthStateChanged(auth, (user) => {
    loginScreen.style.display = 'none';
    deniedScreen.style.display = 'none';
    adminScreen.style.display = 'none';

    if (!user) {
      loginScreen.style.display = 'flex';
    } else if (ADMIN_EMAILS.includes(user.email)) {
      adminScreen.style.display = 'block';
      loadSettings();
    } else {
      deniedScreen.style.display = 'flex';
    }
  });
</script>
</body>
</html>
