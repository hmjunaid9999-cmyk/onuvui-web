<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ক্রিকেট স্কোর - Onuvuti</title>
<style>
  body { font-family: sans-serif; background:#0f0f0f; color:#fff; padding:20px; margin:0; }
  h1 { text-align:center; }
  .match-card {
    background:#1a1a1a; border-radius:10px; padding:15px; margin:10px 0;
    border-left: 4px solid #0f0;
  }
  .teams { font-size:18px; font-weight:bold; margin-bottom:6px; }
  .score { font-size:16px; color:#ccc; margin:4px 0; }
  .status { color:#0f0; font-weight:bold; margin-top:6px; }
  .league { color:#888; font-size:13px; margin-bottom:6px; }
  .loading, .empty { text-align:center; margin-top:50px; color:#aaa; }
  button {
    display:block; margin:20px auto; padding:10px 20px;
    background:#0f0; color:#000; border:none; border-radius:5px; font-weight:bold;
  }
</style>
</head>
<body>

<h1>🏏 ক্রিকেট স্কোর (লাইভ)</h1>
<button onclick="loadScores()">🔄 রিফ্রেশ করুন</button>
<div id="scores" class="loading">লোড হচ্ছে...</div>

<script>
async function loadScores() {
  const container = document.getElementById("scores");
  container.innerHTML = "লোড হচ্ছে...";
  try {
    const res = await fetch("/.netlify/functions/cricket-score");
    const json = await res.json();
    const matches = json.data || [];

    const liveMatches = matches.filter(m => {
      const desc = (m.description || "").toLowerCase();
      return desc.includes("in play");
    });

    if (liveMatches.length === 0) {
      container.innerHTML = "<p class='empty'>এই মুহূর্তে কোনো লাইভ ম্যাচ নেই।<br>একটু পরে আবার চেষ্টা করুন।</p>";
      return;
    }

    container.innerHTML = "";
    liveMatches.forEach(match => {
      const home = match.homeTeam ? match.homeTeam.name : "টিম ১";
      const away = match.awayTeam ? match.awayTeam.name : "টিম ২";

      let homeScore = "-";
      let awayScore = "-";
      if (match.state && match.state.teams) {
        if (match.state.teams.home && match.state.teams.home.score) {
          homeScore = match.state.teams.home.score;
        }
        if (match.state.teams.away && match.state.teams.away.score) {
          awayScore = match.state.teams.away.score;
        }
      }

      const league = match.league ? match.league.name : "";
      const desc = match.description || "";

      const card = document.createElement("div");
      card.className = "match-card";
      card.innerHTML = `
        <div class="league">${league}</div>
        <div class="teams">${home} vs ${away}</div>
        <div class="score">${home}: ${homeScore}</div>
        <div class="score">${away}: ${awayScore}</div>
        <div class="status">🔴 ${desc}</div>
      `;
      container.appendChild(card);
    });
  } catch (e) {
    container.innerHTML = "<p class='empty'>স্কোর আনতে সমস্যা হয়েছে।</p>";
  }
}
loadScores();
</script>

</body>
</html>
