<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onuvuti Video Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; }
  #loginScreen, #deniedScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  #deniedScreen { display: none; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
  button {
    background: #4285F4; color: #fff; border: none;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  #adminScreen { display: none; }

  header {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 14px 18px; background: #161b22; border-bottom: 1px solid #262c36;
  }
  #logoutBtn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: #262c36; color: #f87171; padding: 6px 14px; border-radius: 14px; font-size: 12px;
  }

  main { padding: 20px 16px; max-width: 640px; margin: 0 auto; }
  .folderTitle { font-size: 18px; font-weight: bold; margin-bottom: 16px; }

  .section { background: #161b22; border: 1px solid #262c36; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .section h2 { font-size: 15px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .row label { width: 110px; font-size: 13px; color: #9ca3af; flex-shrink: 0; }
  input[type="number"], input[type="text"] {
    flex: 1; width: 100%; background: #0d1117; border: 1px solid #30363d; color: #fff;
    padding: 8px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .hint { font-size: 11px; color: #6b7280; margin-top: 4px; margin-bottom: 8px; }

  .sectionSaveBtn { width: 100%; padding: 9px; border-radius: 10px; font-size: 13px; margin-top: 6px; }
  .sectionStatus { text-align: center; font-size: 12px; margin-top: 6px; min-height: 15px; }

  .listCard { background: #161b22; border: 1px solid #262c36; border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
  .listCard .metaRow { display: flex; justify-content: space-between; color: #6b7280; font-size: 11px; margin-bottom: 6px; }
  .listEmpty { text-align: center; color: #6b7280; font-size: 13px; padding: 30px 0; }

  .accCard { background: #161b22; border: 1px solid #262c36; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .accName { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
  .accEmail { font-size: 12px; color: #9ca3af; margin-bottom: 4px; word-break: break-all; }
  .accUid { font-size: 11px; color: #6b7280; margin-bottom: 12px; word-break: break-all; }
  .accTabs { display: flex; background: #0d1117; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .accTabBtn { flex: 1; background: transparent; color: #9ca3af; padding: 7px; border-radius: 8px; font-size: 12px; font-weight: normal; }
  .accTabBtn.active { background: #262c36; color: #fff; font-weight: bold; }
  .accTabContent.hidden { display: none; }
  .historyRow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 12px; }
  .historyRow:last-child { border-bottom: none; }
  .historyType { color: #d1d5db; }
  .historyDate { color: #6b7280; font-size: 11px; margin-top: 2px; }
  .historyAmount { font-weight: bold; }
  .historyAmount.pos { color: #4ade80; }
  .historyAmount.neg { color: #f87171; }

  .fabAddAccount {
    position: fixed; right: 18px; bottom: 18px; width: 52px; height: 52px; border-radius: 50%;
    padding: 0; font-size: 24px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4); z-index: 50;
  }
  .modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modalOverlay.show { display: flex; }
  .modalBox { background: #161b22; border: 1px solid #262c36; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; }
  .modalBox h3 { font-size: 15px; margin-bottom: 14px; }
  .modalActions { display: flex; gap: 10px; margin-top: 12px; }
  .modalActions button { flex: 1; padding: 9px; border-radius: 10px; font-size: 13px; }
  .modalCancelBtn { background: #262c36; color: #d1d5db; }

  .swiperDots { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #30363d; cursor: pointer; transition: background 0.2s, transform 0.2s; }
  .dot.active { background: #4285F4; transform: scale(1.25); }

  .swiperContainer { overflow: hidden; }
  .swiperTrack {
    display: flex; width: 200%;
    transition: transform 0.3s ease;
    touch-action: pan-y;
  }
  .swiperTrack.dragging { transition: none; }
  .swiperPage { width: 50%; flex-shrink: 0; min-width: 0; }
  .swiperPage .section { margin-bottom: 0; }
</style>
</head>
<body>

  <div id="loginScreen">
    <h1>Onuvuti Video Admin</h1>
    <p>এডমিন অ্যাক্সেসের জন্য লগইন করুন</p>
    <button id="googleLoginBtn">🔵 Google দিয়ে লগইন করুন</button>
  </div>

  <div id="deniedScreen">
    <h1>⛔ প্রবেশাধিকার নেই</h1>
    <p>এই অ্যাকাউন্টটি এডমিন হিসেবে অনুমোদিত নয়।</p>
    <button id="logoutBtn2">লগ আউট</button>
  </div>

  <div id="adminScreen">
    <header>
      <span>🎬 Video Admin Panel</span>
      <button id="logoutBtn">লগ আউট</button>
    </header>

    <main>
      <div class="folderTitle">🎬 ভিডিও</div>

      <div class="swiperDots">
        <span class="dot active" data-page="0"></span>
        <span class="dot" data-page="1"></span>
      </div>

      <div class="swiperContainer" id="swiperContainer">
        <div class="swiperTrack" id="swiperTrack">

          <div class="swiperPage">
            <div class="section">
              <h2>👤 একাউন্ট</h2>
              <input type="text" id="accountSearch" placeholder="🔍 নাম, ইমেইল বা UID দিয়ে সার্চ করুন..." style="margin-bottom:12px;">
              <div id="accountsList"><div class="listEmpty">লোড হচ্ছে...</div></div>
            </div>
          </div>

          <div class="swiperPage">
            <div class="section">
              <h2>🪙 কয়েন সেটিংস</h2>
              <div class="row"><label>ইউনিটের নাম</label><input type="text" id="coinUnitName" placeholder="Coin"></div>
              <div class="row"><label>প্রতি ভিডিও আপলোডের খরচ</label><input type="number" id="coinVideoCost" placeholder="100"></div>
              <div class="row"><label>প্রতি বিজ্ঞাপনের খরচ</label><input type="number" id="coinAdCost" placeholder="5"></div>
              <div class="row"><label>বিজ্ঞাপন দেখলে পুরস্কার</label><input type="number" id="coinAdReward" placeholder="1"></div>
              <button class="sectionSaveBtn" id="saveCoinSettingsBtn">💾 সেভ করুন</button>
              <div class="sectionStatus" id="coinSettingsStatus"></div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <button class="fabAddAccount" id="addAccountFab" title="নতুন একাউন্ট যোগ করুন">➕</button>

    <div class="modalOverlay" id="addAccountModal">
      <div class="modalBox">
        <h3>➕ নতুন একাউন্ট যোগ করুন</h3>
        <div class="row" style="margin-bottom:10px;"><label>নাম</label><input type="text" id="newAccName" placeholder="ঐচ্ছিক"></div>
        <div class="row" style="margin-bottom:10px;"><label>ইমেইল</label><input type="text" id="newAccEmail" placeholder="example@gmail.com"></div>
        <div class="row" style="margin-bottom:10px;"><label>UID</label><input type="text" id="newAccUid" placeholder="ইউনিক আইডি"></div>
        <div class="sectionStatus" id="addAccountStatus"></div>
        <div class="modalActions">
          <button class="modalCancelBtn" id="addAccountCancelBtn">বাতিল</button>
          <button id="addAccountSaveBtn">💾 তৈরি করুন</button>
        </div>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection, onSnapshot, query, orderBy, limit, addDoc, serverTimestamp, getDocs
  } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:d87ae40431210088df8b25",
    measurementId: "G-WJ8N8XLPSZ"
  };

  const ADMIN_EMAILS = ["hmjunaid9999@gmail.com"];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById('loginScreen');
  const deniedScreen = document.getElementById('deniedScreen');
  const adminScreen = document.getElementById('adminScreen');

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.error(e); alert('লগইন এরর: ' + e.message); }
  });
  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
  document.getElementById('logoutBtn2').addEventListener('click', () => signOut(auth));

  // ---- একাউন্ট ----
  let allAccountsCache = [];
  let accountsUnsub = null;

  const HISTORY_LABELS = {
    adBalanceAdd: '🪙 বিজ্ঞাপন ব্যালেন্স যোগ হয়েছে',
    videoBalanceAdd: '🎬 ভিডিও ব্যালেন্স যোগ হয়েছে',
    adSpend: '📉 বিজ্ঞাপন থেকে খরচ হয়েছে',
    adReward: '📈 বিজ্ঞাপন থেকে ইনকাম হয়েছে'
  };

  function startAccountsListener() {
    const listEl = document.getElementById('accountsList');
    listEl.innerHTML = '<div class="listEmpty">লোড হচ্ছে...</div>';
    if (accountsUnsub) accountsUnsub();
    // onSnapshot ব্যবহার করায় কেউ নতুন একাউন্ট খুললেই (মূল অ্যাপ থেকে) এই লিস্টে
    // পাতা রিফ্রেশ ছাড়াই স্বয়ংক্রিয়ভাবে চলে আসবে।
    accountsUnsub = onSnapshot(collection(db, "users"), (snap) => {
      allAccountsCache = [];
      snap.forEach(docSnap => allAccountsCache.push({ id: docSnap.id, data: docSnap.data() }));
      applyAccountFilter();
    }, (e) => {
      listEl.innerHTML = '<div class="listEmpty">এরর: ' + e.message + '</div>';
    });
  }

  function applyAccountFilter() {
    const term = document.getElementById('accountSearch').value.trim().toLowerCase();
    const filtered = term ? allAccountsCache.filter(({ id, data }) => {
      const name = (data.name || '').toLowerCase();
      const email = (data.email || '').toLowerCase();
      return name.includes(term) || email.includes(term) || id.toLowerCase().includes(term);
    }) : allAccountsCache;
    renderAccounts(filtered);
  }

  function renderAccounts(accounts) {
    const listEl = document.getElementById('accountsList');
    if (!accounts.length) { listEl.innerHTML = '<div class="listEmpty">কোনো একাউন্ট পাওয়া যায়নি</div>'; return; }
    listEl.innerHTML = '';
    accounts.forEach(({ id, data }) => {
      const card = document.createElement('div');
      card.className = 'accCard';
      card.innerHTML = `
        <div class="accName">${(data.name || 'নাম নেই').replace(/</g, '&lt;')}</div>
        <div class="accEmail">${data.email ? data.email.replace(/</g, '&lt;') : 'ইমেইল নেই'}</div>
        <div class="accUid">UID: ${id}</div>
        <div class="accTabs">
          <button class="accTabBtn historyTabBtn">🕘 হিস্ট্রি</button>
          <button class="accTabBtn balanceTabBtn active">💰 ব্যালেন্স</button>
        </div>
        <div class="accTabContent balanceContent">
          <div class="row"><label>বিজ্ঞাপন ব্যালেন্স</label><input type="number" class="adBalanceInput" value="${Number(data.adBalance || 0)}"></div>
          <div class="row"><label>ভিডিও ব্যালেন্স</label><input type="number" class="videoBalanceInput" value="${Number(data.videoBalance || 0)}"></div>
          <button class="sectionSaveBtn saveAccountBtn">💾 সেভ করুন</button>
          <div class="sectionStatus"></div>
        </div>
        <div class="accTabContent historyContent hidden">
          <div class="historyList"><div class="listEmpty">লোড হচ্ছে...</div></div>
        </div>
      `;

      const historyBtn = card.querySelector('.historyTabBtn');
      const balanceBtn = card.querySelector('.balanceTabBtn');
      const historyContent = card.querySelector('.historyContent');
      const balanceContent = card.querySelector('.balanceContent');
      let historyLoaded = false;

      historyBtn.addEventListener('click', () => {
        historyBtn.classList.add('active');
        balanceBtn.classList.remove('active');
        historyContent.classList.remove('hidden');
        balanceContent.classList.add('hidden');
        if (!historyLoaded) {
          historyLoaded = true;
          loadHistory(id, card.querySelector('.historyList'));
        }
      });
      balanceBtn.addEventListener('click', () => {
        balanceBtn.classList.add('active');
        historyBtn.classList.remove('active');
        balanceContent.classList.remove('hidden');
        historyContent.classList.add('hidden');
      });

      card.querySelector('.saveAccountBtn').addEventListener('click', async () => {
        const adInput = card.querySelector('.adBalanceInput');
        const videoInput = card.querySelector('.videoBalanceInput');
        const adVal = Number(adInput.value) || 0;
        const videoVal = Number(videoInput.value) || 0;
        const prevAd = Number(data.adBalance || 0);
        const prevVideo = Number(data.videoBalance || 0);
        const statusEl = card.querySelector('.sectionStatus');
        try {
          await setDoc(doc(db, "users", id), { adBalance: adVal, videoBalance: videoVal }, { merge: true });
          // ব্যালেন্স যত বদলাবে, ততটুকুর একটা হিস্ট্রি এন্ট্রি সাথে সাথে সেভ হবে
          const historyWrites = [];
          if (adVal !== prevAd) {
            historyWrites.push(addDoc(collection(db, "users", id, "history"), {
              type: 'adBalanceAdd', amount: adVal - prevAd, createdAt: serverTimestamp()
            }));
          }
          if (videoVal !== prevVideo) {
            historyWrites.push(addDoc(collection(db, "users", id, "history"), {
              type: 'videoBalanceAdd', amount: videoVal - prevVideo, createdAt: serverTimestamp()
            }));
          }
          await Promise.all(historyWrites);
          data.adBalance = adVal;
          data.videoBalance = videoVal;
          historyLoaded = false; // পরে হিস্ট্রি ট্যাবে গেলে নতুন এন্ট্রি সহ আবার লোড হবে
          statusEl.style.color = '#4ade80';
          statusEl.textContent = '✅ সেভ হয়েছে!';
          setTimeout(() => { statusEl.textContent = ''; }, 2000);
        } catch (e) {
          statusEl.style.color = '#f87171';
          statusEl.textContent = 'এরর: ' + e.message;
        }
      });

      listEl.appendChild(card);
    });
  }

  async function loadHistory(uid, containerEl) {
    containerEl.innerHTML = '<div class="listEmpty">লোড হচ্ছে...</div>';
    try {
      const q = query(collection(db, "users", uid, "history"), orderBy("createdAt", "desc"), limit(5));
      const snap = await getDocs(q);
      if (snap.empty) {
        containerEl.innerHTML = '<div class="listEmpty">কোনো হিস্ট্রি পাওয়া যায়নি</div>';
        return;
      }
      containerEl.innerHTML = '';
      snap.forEach(docSnap => {
        const h = docSnap.data();
        const amount = Number(h.amount || 0);
        const dateStr = (h.createdAt && h.createdAt.toDate) ? h.createdAt.toDate().toLocaleString('bn-BD') : '—';
        const row = document.createElement('div');
        row.className = 'historyRow';
        row.innerHTML = `
          <div>
            <div class="historyType">${HISTORY_LABELS[h.type] || h.type}</div>
            <div class="historyDate">${dateStr}</div>
          </div>
          <div class="historyAmount ${amount >= 0 ? 'pos' : 'neg'}">${amount >= 0 ? '+' : ''}${amount}</div>
        `;
        containerEl.appendChild(row);
      });
    } catch (e) {
      containerEl.innerHTML = '<div class="listEmpty">এরর: ' + e.message + '</div>';
    }
  }

  document.getElementById('accountSearch').addEventListener('input', applyAccountFilter);

  // ---- ম্যানুয়াল একাউন্ট যোগ করা ----
  const addAccountFab = document.getElementById('addAccountFab');
  const addAccountModal = document.getElementById('addAccountModal');

  addAccountFab.addEventListener('click', () => {
    document.getElementById('newAccName').value = '';
    document.getElementById('newAccEmail').value = '';
    document.getElementById('newAccUid').value = '';
    document.getElementById('addAccountStatus').textContent = '';
    addAccountModal.classList.add('show');
  });
  document.getElementById('addAccountCancelBtn').addEventListener('click', () => {
    addAccountModal.classList.remove('show');
  });
  addAccountModal.addEventListener('click', (e) => {
    if (e.target === addAccountModal) addAccountModal.classList.remove('show');
  });
  document.getElementById('addAccountSaveBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('addAccountStatus');
    const name = document.getElementById('newAccName').value.trim();
    const email = document.getElementById('newAccEmail').value.trim();
    const uid = document.getElementById('newAccUid').value.trim();
    if (!uid) {
      statusEl.style.color = '#f87171';
      statusEl.textContent = 'UID অবশ্যই দিতে হবে';
      return;
    }
    try {
      // যদি এই UID দিয়ে আগে থেকেই ডকুমেন্ট থাকে (যেমন মূল অ্যাপ থেকে সাইন আপ করা), merge:true
      // থাকায় সেটার উপরেই বসবে, ডুপ্লিকেট হবে না — না থাকলে নতুন তৈরি হবে।
      await setDoc(doc(db, "users", uid), {
        name: name || '', email: email || '', adBalance: 0, videoBalance: 0
      }, { merge: true });
      statusEl.style.color = '#4ade80';
      statusEl.textContent = '✅ একাউন্ট তৈরি হয়েছে!';
      setTimeout(() => { addAccountModal.classList.remove('show'); }, 900);
    } catch (e) {
      statusEl.style.color = '#f87171';
      statusEl.textContent = 'এরর: ' + e.message;
    }
  });

  // ---- কয়েন সেটিংস ----
  async function loadCoinSettings() {
    const statusEl = document.getElementById('coinSettingsStatus');
    try {
      const snap = await getDoc(doc(db, "settings", "video"));
      const d = snap.exists() ? snap.data() : {};
      document.getElementById('coinUnitName').value = d.unitName || 'Coin';
      document.getElementById('coinVideoCost').value = (typeof d.videoCost === 'number') ? d.videoCost : 100;
      document.getElementById('coinAdCost').value = (typeof d.adCost === 'number') ? d.adCost : 5;
      document.getElementById('coinAdReward').value = (typeof d.adRewardCoins === 'number') ? d.adRewardCoins : 1;
    } catch (e) {
      statusEl.style.color = '#f87171';
      statusEl.textContent = 'লোড এরর: ' + e.message;
    }
  }

  document.getElementById('saveCoinSettingsBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('coinSettingsStatus');
    const unitName = document.getElementById('coinUnitName').value.trim() || 'Coin';
    const videoCost = Number(document.getElementById('coinVideoCost').value) || 0;
    const adCost = Number(document.getElementById('coinAdCost').value) || 0;
    const adRewardCoins = Number(document.getElementById('coinAdReward').value) || 0;
    try {
      await setDoc(doc(db, "settings", "video"), { unitName, videoCost, adCost, adRewardCoins }, { merge: true });
      statusEl.style.color = '#4ade80';
      statusEl.textContent = '✅ সেভ হয়েছে!';
      setTimeout(() => { statusEl.textContent = ''; }, 2000);
    } catch (e) {
      statusEl.style.color = '#f87171';
      statusEl.textContent = 'এরর: ' + e.message;
    }
  });

  // ---- সোয়াইপার (একাউন্ট <-> কয়েন সেটিংস) ----
  const swiperContainer = document.getElementById('swiperContainer');
  const swiperTrack = document.getElementById('swiperTrack');
  const dots = document.querySelectorAll('.dot');
  let currentPage = 0;
  let startX = 0;
  let currentTranslate = 0;
  let isDragging = false;

  function goToPage(index) {
    currentPage = Math.max(0, Math.min(1, index));
    swiperTrack.style.transform = `translateX(-${currentPage * 50}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === currentPage));
  }

  dots.forEach(dot => {
    dot.addEventListener('click', () => goToPage(Number(dot.dataset.page)));
  });

  function onDragStart(clientX) {
    isDragging = true;
    startX = clientX;
    swiperTrack.classList.add('dragging');
  }

  function onDragMove(clientX) {
    if (!isDragging) return;
    const deltaX = clientX - startX;
    const containerWidth = swiperContainer.offsetWidth;
    const deltaPercent = (deltaX / containerWidth) * 50;
    currentTranslate = -(currentPage * 50) + deltaPercent;
    swiperTrack.style.transform = `translateX(${currentTranslate}%)`;
  }

  function onDragEnd(clientX) {
    if (!isDragging) return;
    isDragging = false;
    swiperTrack.classList.remove('dragging');
    const deltaX = clientX - startX;
    const threshold = 50;
    if (deltaX < -threshold) goToPage(currentPage + 1);
    else if (deltaX > threshold) goToPage(currentPage - 1);
    else goToPage(currentPage);
  }

  swiperContainer.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientX), { passive: true });
  swiperContainer.addEventListener('touchmove', (e) => onDragMove(e.touches[0].clientX), { passive: true });
  swiperContainer.addEventListener('touchend', (e) => onDragEnd(e.changedTouches[0].clientX));

  swiperContainer.addEventListener('mousedown', (e) => onDragStart(e.clientX));
  swiperContainer.addEventListener('mousemove', (e) => { if (isDragging) onDragMove(e.clientX); });
  swiperContainer.addEventListener('mouseup', (e) => onDragEnd(e.clientX));
  swiperContainer.addEventListener('mouseleave', (e) => { if (isDragging) onDragEnd(e.clientX); });

  onAuthStateChanged(auth, (user) => {
    loginScreen.style.display = 'none';
    deniedScreen.style.display = 'none';
    adminScreen.style.display = 'none';

    if (!user) {
      if (accountsUnsub) { accountsUnsub(); accountsUnsub = null; }
      loginScreen.style.display = 'flex';
    } else if (ADMIN_EMAILS.includes(user.email)) {
      adminScreen.style.display = 'block';
      startAccountsListener();
      loadCoinSettings();
    } else {
      deniedScreen.style.display = 'flex';
    }
  });
</script>
</body>
</html>
